[project]
name = "posit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "bokeh",
    "databricks-sql-connector[pyarrow] ; python_full_version < '3.15'",
    "duckdb ; python_full_version < '3.15'",
    "fastcore",
    "geopandas",
    "google-cloud-bigquery",
    "haystack-ai",
    "holoviews>=1.20",
    "hvplot",
    "ibis-framework[duckdb] ; python_full_version >= '3.10' and python_full_version < '3.15'",
    "ibis-framework[polars] ; python_full_version == '3.9.*'",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "lightning ; python_full_version < '3.15'",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "plotnine",
    "polars",
    # polars 1.x Series methods return None on Python 3.15; fixed in 2.0.
    "polars>=2.0.0 ; python_full_version >= '3.15'",
    "polars[timezone] ; sys_platform == 'win32'",
    "pyarrow",
    "pymssql",
    "pyodbc ; python_full_version < '3.15'",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-rerunfailures",
    "pytz",
    "scipy",
    "seaborn",
    "snowflake-connector-python ; python_full_version < '3.15'",
    "sqlalchemy",
    "syrupy",
    "torch ; python_full_version < '3.15'",
]
