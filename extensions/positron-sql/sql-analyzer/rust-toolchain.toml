# Pinned so that everyone builds the committed module with the same compiler: a different rustc
# (or LLVM) produces a different module from the same crate. This file is one of the inputs in
# wasm-fingerprint.txt, so bumping it means rebuilding resources/sql-analyzer.wasm in the same
# change, which CI enforces.
[toolchain]
channel = "1.97.1"
profile = "minimal"
targets = ["wasm32-unknown-unknown"]
