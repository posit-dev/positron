[package]
name = "positron-sql-analyzer"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sqlparser = { version = "0.62", default-features = false, features = ["std", "visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
