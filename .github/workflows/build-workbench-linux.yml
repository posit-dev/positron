name: "Build: Positron Workbench (Linux x64)"

on:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA to test"
        required: false
        default: ""
        type: string
    outputs:
      artifact-name:
        description: "Name of the workbench artifact uploaded"
        value: ${{ jobs.build-workbench.outputs.artifact-name }}

permissions:
  contents: read
  packages: read

jobs:
  build-workbench:
    name: Build Positron Workbench Linux x64
    runs-on: ubuntu-latest-amd64-8-core
    timeout-minutes: 180
    outputs:
      artifact-name: positron-workbench-linux-x64
    container:
      image: ghcr.io/posit-dev/positron-builds-rocky8:6
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory '*'
          git rev-parse --show-toplevel

      - name: Checkout specific commit
        if: ${{ inputs.commit != '' }}
        run: git checkout ${{ inputs.commit }}

      - name: Install build dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          npm_config_arch: x64
        shell: scl enable gcc-toolset-14 -- bash -eo pipefail {0}
        run: |
          # Parallel node-gyp postinstalls race on this cache and can read a truncated common.gypi
          node "$(npm root -g)/npm/node_modules/node-gyp/bin/node-gyp.js" install \
            --target="$(npm config get target)" --dist-url="$(npm config get disturl)"

          npm install --prefix build --fetch-timeout 120000
          npm ci --fetch-timeout 120000

      - name: Download compiled core
        uses: actions/download-artifact@v8
        with:
          name: positron-compilation

      - name: Build Positron Workbench
        env:
          npm_config_arch: x64
        run: |
          tar xzf positron-compilation.tar.gz
          npm run gulp -- --series compile-extensions-build copy-extension-binaries compile-copilot-extension-build compile-extension-media-build vscode-reh-web-pwb-linux-x64-min-ci

      - name: Package workbench tar.gz
        run: |
          cd ..
          tar czvf positron/positron-workbench-linux-x64-branch.tar.gz vscode-reh-web-pwb-linux-x64

      - name: Upload workbench artifact
        uses: actions/upload-artifact@v7
        with:
          name: positron-workbench-linux-x64
          path: positron-workbench-linux-x64-branch.tar.gz
          retention-days: 1
