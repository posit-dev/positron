name: "Test: Exploratory"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to explore."
        required: true
        type: string
      model:
        description: "Model to explore with. 'both' runs opus and sonnet in parallel."
        required: false
        default: "opus"
        type: choice
        options:
          - opus
          - sonnet
          - both
      enable_gate:
        description: "Let a pre-flight pass decline the run when the change cannot be exercised here"
        required: false
        default: false
        type: boolean
  # `/test` on a PR. Runs from main's copy of this file with full secrets, and
  # the explore job builds and executes the PR's code, so the membership job is
  # the entire defence. See its comment.
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  # Decides who may run this. Not to be confused with `worthiness`, which
  # decides whether a change is worth testing.
  #
  # issue_comment runs in base-repo context with full secrets, even for fork
  # PRs, and explore compiles and runs the PR head. PETE also mounts the PR
  # read-only; that layer is not available here, since running the PR's code is
  # the point. So BOTH the commenter and the PR author must be active
  # positron-dev members: an outsider cannot bait a member into commenting
  # `/test` on their PR. Fails closed on any error.
  membership:
    name: membership
    # Cheap prefilter so ordinary comments do not start a runner. startsWith,
    # not contains: contains fires on a comment that merely mentions /test.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    # Reads membership with the App token below, not GITHUB_TOKEN. No write
    # access on the one job that runs for every matching comment, which is
    # also why a blocked caller gets silence rather than a rejection comment.
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Mint org-scoped App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          owner: posit-dev

      - name: Check command and membership
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          echo "ok=false" >> "$GITHUB_OUTPUT"

          # The prefilter matched a prefix, so "/testing" got this far. Only the
          # exact command counts: the first word of the first non-blank line.
          # Web UI comments use CRLF, so drop the CR or "/test\r" never matches.
          first=$(printf '%s\n' "$BODY" | tr -d '\r' | awk 'NF { print $1; exit }')
          if [ "$first" != "/test" ]; then
            echo "Not a /test command (first word: '$first')"
            exit 0
          fi

          # Active member: 200 {"state":"active"}. Non-member: 404, empty
          # stdout. Pending invite: "pending", which does not count.
          is_member() {
            local state
            state=$(gh api "orgs/posit-dev/teams/positron-dev/memberships/$1" --jq '.state' 2>/dev/null)
            [ "$state" = "active" ]
          }

          if is_member "$COMMENTER" && is_member "$PR_AUTHOR"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Membership gate: ok"
          else
            echo "Membership gate: blocked (commenter=$COMMENTER, author=$PR_AUTHOR)"
          fi

  # Decides whether the change is worth testing, before anything is built. Not
  # to be confused with `membership`, which decides who may run this at all.
  # The explore job needs a compile, an Xvfb, a launch and a Playwright attach;
  # a change this pass declines should not pay for twenty minutes of 8-core
  # runner first. One pass serves every matrix leg.
  worthiness:
    name: worthiness
    if: ${{ inputs.enable_gate }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      testable: ${{ steps.gate.outputs.testable }}
      reason: ${{ steps.gate.outputs.reason }}
      cost: ${{ steps.gate.outputs.cost }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # The checkout above is the branch under test, and it is the code this job
      # builds and drives. It is not where the job's own tooling comes from.
      # `./.github/actions/...` resolves against the workspace root, so every
      # local action would be whichever version that branch happens to carry:
      # missing entirely for one this branch adds, and stale for one it changes.
      # Take the actions and the skill from the ref the workflow was dispatched
      # from, so a run is driven by this version whatever it is pointed at.
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-testing
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/main HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "diff_stat<<DIFFEOF"
            git --no-pager diff "$BASE"...HEAD --stat
            echo "DIFFEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"

      - name: Rule on the change
        id: gate
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: gate
          anthropic-api-key: ${{ env.ANTHROPIC_KEY }}
          # gate mode does not read the skill, but the harness copy is the one
          # this job means either way; leaving it to default would quietly point
          # at the branch under test the day gate mode does read it.
          skill-path: ${{ github.workspace }}/.harness/.claude/skills/exploratory-testing/SKILL.md
          branch: ${{ inputs.ref || github.ref_name }}
          diff-stat: ${{ steps.base.outputs.diff_stat }}
          base-sha: ${{ steps.base.outputs.base }}
          head-sha: ${{ steps.base.outputs.head }}

      # A declined run skips the explore job, which on its own looks like
      # nothing happened. The gate's whole output is the reason it declined, so
      # put it where the person who dispatched the run will see it.
      - name: Say why the run was declined
        if: ${{ steps.gate.outputs.testable == 'false' }}
        shell: bash
        env:
          REASON: ${{ steps.gate.outputs.reason }}
          COST: ${{ steps.gate.outputs.cost }}
        run: |
          set -euo pipefail
          {
            printf '## Exploratory test: not run\n\n'
            printf 'The pre-flight pass declined this change.\n\n'
            printf '%s\n' "${REASON:-No reason recorded.}"
            printf '\n_gate: $%s_\n' "${COST:-?}"
          } >> "$GITHUB_STEP_SUMMARY"

  explore:
    name: explore (${{ matrix.model }})
    needs: [worthiness, membership]
    # always(): both needs are skipped on some path (worthiness when off,
    # membership on dispatch), and a skipped need would otherwise skip this job.
    # On a comment, only an explicit ok=true from membership runs it, so a
    # failed or cancelled membership job runs nothing.
    if: >-
      ${{ always() &&
      needs.worthiness.outputs.testable != 'false' &&
      (github.event_name == 'workflow_dispatch' || needs.membership.outputs.ok == 'true') }}
    # Job-level, not workflow-level: every comment on every PR starts a run of
    # this workflow, and a workflow-level group would let any of them cancel an
    # in-flight /test. Per model, so the two legs of `both` do not cancel each
    # other.
    concurrency:
      group: pr-exploratory-${{ github.event.issue.number || inputs.ref }}-${{ matrix.model }}
      cancel-in-progress: true
    # Job-level permissions replace the workflow's, so repeat those too.
    permissions:
      id-token: write
      contents: read
      packages: read
      pull-requests: write
      issues: write
    strategy:
      # One model failing should not cancel the other; a partial comparison is
      # still worth reading.
      fail-fast: false
      matrix:
        # Every branch is a literal. Building the JSON with format() put a
        # dispatch input inside the document it was about to parse, which only
        # held because `type: choice` happens to constrain the value.
        model: ${{ (inputs.model || 'opus') == 'both' && fromJSON('["opus","sonnet"]')
          || (inputs.model || 'opus') == 'sonnet' && fromJSON('["sonnet"]')
          || fromJSON('["opus"]') }}
    timeout-minutes: 90
    runs-on: ubuntu-latest-8x
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.18.0
      options: --user 0:0 --init
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0
      HOME: /root
      R_LIBS_SITE: /usr/local/lib/R/site-library
      R_LIBS_USER: /usr/local/lib/R/site-library
      RETICULATE_PYTHON: /root/.venv/bin/python
    steps:
      # First, so the commenter sees it was picked up before the slow steps.
      - name: Acknowledge /test
        id: ack
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          REACTION_ID=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes --jq '.id' 2>/dev/null) || echo "Failed to add reaction (non-fatal)"
          echo "reaction_id=${REACTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR head
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"head_sha=\(.head.sha)\nhead_ref=\(.head.ref)"' >> "$GITHUB_OUTPUT"

      # By SHA, not branch name: a fork's branch is not in this repo, and a push
      # after the comment should not change what gets tested.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || steps.pr.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # The checkout above is the branch under test, and it is the code this job
      # builds and drives. It is not where the job's own tooling comes from.
      # `./.github/actions/...` resolves against the workspace root, so every
      # local action would be whichever version that branch happens to carry:
      # missing entirely for one this branch adds, and stale for one it changes.
      # Take the actions and the skill from the ref the workflow was dispatched
      # from, so a run is driven by this version whatever it is pointed at.
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-testing
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post running comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: running
          pr-number: ${{ github.event.issue.number }}
          github-token: ${{ github.token }}
          head-sha: ${{ steps.pr.outputs.head_sha }}

      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # fetch-depth: 0 fetched all branches, so origin/main is present.
          BASE=$(git merge-base origin/main HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"
          git --no-pager diff "$BASE"...HEAD --stat
          {
            echo "diff_stat<<DIFFEOF"
            git --no-pager diff "$BASE"...HEAD --stat
            echo "DIFFEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore caches
        id: restore-caches
        uses: ./.harness/.github/actions/restore-build-caches

      - name: Install node dependencies
        if: steps.restore-caches.outputs.cache-npm-core-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true'
        uses: nick-fields/retry@v4
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          POSITRON_GITHUB_RO_PAT: ${{ github.token }}
          POSITRON_PARALLEL_INSTALL: '0'
          POSITRON_NPM_CONCURRENCY: '10'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NPM_CONFIG_DEVDIR: '.node-gyp-cache'
          DOCKER_CONFIG: /tmp/.docker
          POSITRON_EXTENSIONS_FILTER: ${{ (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true' && 'stable') || (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' && 'volatile') || '' }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 5
          shell: bash
          command: bash scripts/install-npm-parallel.sh

      - name: Download binaries (Ark, Kallichore)
        uses: ./.harness/.github/actions/download-binaries
        with:
          cache-hit: ${{ steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' ||
                         steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' }}

      - name: Install E2E test dependencies
        run: npm --prefix test/e2e ci --prefer-offline --no-audit --no-fund

      - name: Compile Positron and Download Electron
        run: npm exec -- npm-run-all --max-old-space-size=8192 -p compile "electron x64"

      - name: Prelaunch
        run: npm run prelaunch

      - name: Set permissions on SUID sandbox helper
        run: |
          ELECTRON_ROOT=.build/electron
          sudo chown root $ELECTRON_ROOT/chrome-sandbox
          sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
          stat $ELECTRON_ROOT/chrome-sandbox

      - name: Setup E2E Test Environment
        uses: ./.harness/.github/actions/setup-test-env
        with:
          aws-role-to-assume: ${{ secrets.QA_AWS_RO_ROLE }}
          aws-region: ${{ secrets.QA_AWS_REGION }}

      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          # Not in the container image. launch.sh output parsing below needs
          # it, and so do monaco-paste.sh, quickpick-enum.sh, and the snapshot
          # recipe the agent follows from the drive-positron skill.
          sudo apt-get update && sudo apt-get install -y jq
          jq --version

      - name: Setup Xvfb
        uses: ./.harness/.github/actions/setup-xvfb

      - name: Alter AppArmor restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Write seed profile and scratch workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/positron-seed/User
          # window.dialogStyle defaults to native, and a native message box is a
          # separate OS window: invisible to CDP screenshots and unclickable by
          # the driver, so the extension host waits on it forever. A run hit that
          # and filed the stuck button as a major product defect. launch.sh sets
          # this too, but only on branches carrying that change, so pin it here
          # where the harness controls it.
          printf '{ "window.dialogStyle": "custom", "files.simpleDialog.enable": true }\n' \
            > /tmp/positron-seed/User/settings.json
          mkdir -p /tmp/exploratory-workspace
          echo "# scratch" > /tmp/exploratory-workspace/README.md

      - name: Check compiled output exists
        shell: bash
        run: |
          set -euo pipefail
          test -d out || { echo "out/ missing -- compile did not run"; exit 1; }
          echo "out/ present, $(find out -name '*.js' | wc -l) js files"

      - name: Allocate report dir
        uses: ./.harness/.github/actions/gen-report-dir
        with:
          identifier: exploratory-${{ matrix.model }}
          skip-summary: "true"

      - name: Allocate run directory
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPLORE_DIR=/tmp/exploratory-run" >> "$GITHUB_ENV"
          echo "REPORT_BASE_URL=${REPORT_URL%/index.html}" >> "$GITHUB_ENV"
          mkdir -p /tmp/exploratory-run/shots

      - name: Launch Positron
        shell: bash
        run: |
          set -euo pipefail
          LAUNCH_JSON=$(.claude/skills/drive-positron/scripts/launch.sh \
            --source-user-data-dir /tmp/positron-seed -- \
            --folder-uri file:///tmp/exploratory-workspace \
            --log debug \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=swiftshader \
            --enable-unsafe-swiftshader \
            --disable-gpu-compositing \
            --password-store=basic)
          echo "$LAUNCH_JSON"
          CDP_PORT=$(echo "$LAUNCH_JSON" | jq -r .cdpPort)
          test -n "$CDP_PORT" && test "$CDP_PORT" != "null" || {
            echo "cdpPort missing from launch.sh output"; exit 1;
          }
          echo "CDP_PORT=$CDP_PORT" >> "$GITHUB_ENV"

      - name: Attach Playwright
        shell: bash
        run: |
          set -euo pipefail
          npx @playwright/cli -s=positron attach --cdp=http://127.0.0.1:"$CDP_PORT"
          npx @playwright/cli -s=positron resize 1600 1100
          TITLE=$(npx @playwright/cli -s=positron eval '(() => document.title)()')
          echo "document.title = $TITLE"
          test -n "$TITLE" || { echo "document.title is empty"; exit 1; }
          npx @playwright/cli -s=positron screenshot --filename="$EXPLORE_DIR/attach-proof.png"
          test -s "$EXPLORE_DIR/attach-proof.png" || { echo "screenshot empty"; exit 1; }

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"

      - name: Explore
        id: explore
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          anthropic-api-key: ${{ env.ANTHROPIC_KEY }}
          skill-path: ${{ github.workspace }}/.harness/.claude/skills/exploratory-testing/SKILL.md
          work-dir: ${{ env.EXPLORE_DIR }}
          cdp-port: ${{ env.CDP_PORT }}
          branch: ${{ inputs.ref || steps.pr.outputs.head_ref }}
          diff-stat: ${{ steps.base.outputs.diff_stat }}
          base-sha: ${{ steps.base.outputs.base }}
          head-sha: ${{ steps.base.outputs.head }}
          report-base-url: ${{ env.REPORT_BASE_URL }}
          model: ${{ matrix.model }}

      - name: Stage publishable run directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/exploratory-publish
          mkdir -p /tmp/exploratory-publish
          if [ -d /tmp/exploratory-run ]; then
            cp -a /tmp/exploratory-run/. /tmp/exploratory-publish/
            rm -f /tmp/exploratory-publish/actions.log
          fi

      - name: Upload run directory to S3
        id: s3-upload
        if: always()
        continue-on-error: true
        uses: ./.harness/.github/actions/upload-report-to-s3
        with:
          role-to-assume: ${{ secrets.AWS_TEST_REPORTS_ROLE }}
          report-dir: ${{ env.REPORT_DIR }}
          source-dir: /tmp/exploratory-publish

      - name: Warn if S3 upload failed
        if: always() && steps.s3-upload.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "**WARNING: the S3 upload failed. Screenshot links in the report above will 404. The full run directory is still in the workflow artifact.**" >> "$GITHUB_STEP_SUMMARY"

      # always(): a failed build must still replace "running" with the truth.
      # Links only when the upload succeeded, so the comment never points at a
      # CDN page that 404s; the run link still reaches the artifact.
      - name: Post result comment
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: result
          outcome: ${{ steps.explore.outputs.outcome }}
          work-dir: ${{ env.EXPLORE_DIR }}
          report-base-url: ${{ steps.s3-upload.outcome == 'success' && env.REPORT_BASE_URL || '' }}
          pr-number: ${{ github.event.issue.number }}
          github-token: ${{ github.token }}
          head-sha: ${{ steps.pr.outputs.head_sha }}

      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exploratory-run-${{ matrix.model }}
          path: |
            /tmp/exploratory-run
            /tmp/positron-dev-launch/*/code.log
          if-no-files-found: warn

      # rocket only when the agent finished on its own. A partial run (turn
      # cap) and a hard failure both get confused. A second /test cancelling
      # this run never reaches here, leaving eyes on the first comment:
      # accepted, since the upserted comment is still current.
      - name: Finalize reaction
        if: always() && github.event_name == 'issue_comment' && steps.ack.outputs.reaction_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ steps.ack.outputs.reaction_id }}
          OUTCOME: ${{ steps.explore.outputs.outcome }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}" \
            || echo "Failed to remove eyes reaction (non-fatal)"
          if [ "$OUTCOME" = "complete" ]; then FINAL=rocket; else FINAL=confused; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="$FINAL" || echo "Failed to add ${FINAL} reaction (non-fatal)"
