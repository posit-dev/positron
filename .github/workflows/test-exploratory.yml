name: "Test: Exploratory"

# Names what the run tests, before any job starts. test-exploratory-suggest.yml
# finds an auto-run by its "Exploratory auto-run #N" prefix to start one per PR.
# A comment that is not a run command keeps the default, as whitespace does.
# The command must be a whole word, as resolve requires, so "/testing" is not
# named a run. Membership cannot be checked here: a blocked caller's run is
# still named, and resolve then stops it with nothing done.
run-name: >-
  ${{ inputs.auto_run_pr && format('Exploratory auto-run #{0} ({1})', inputs.auto_run_pr, inputs.ref)
  || github.event_name == 'workflow_dispatch' && format('Explore {0}', inputs.ref)
  || github.event.issue.pull_request && (
    github.event.comment.body == '/explore'
    || startsWith(github.event.comment.body, '/explore ')
    || startsWith(github.event.comment.body, format('/explore{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/explore{0}', fromJSON('"\n"')))
    || github.event.comment.body == '/test'
    || startsWith(github.event.comment.body, '/test ')
    || startsWith(github.event.comment.body, format('/test{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/test{0}', fromJSON('"\n"')))
    || github.event.comment.body == '/exploratory-test'
    || startsWith(github.event.comment.body, '/exploratory-test ')
    || startsWith(github.event.comment.body, format('/exploratory-test{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/exploratory-test{0}', fromJSON('"\n"'))))
    && format('Explore #{0}: {1}', github.event.issue.number, github.event.issue.title)
  || ' ' }}

on:
  workflow_dispatch:
    inputs:
      # main against main has no diff, so a run of it needs a Test focus;
      # without one the worthiness check declines it.
      ref:
        description: "Branch to explore"
        required: true
        default: "main"
        type: string
      # Set it when the ref's PR targets a release branch.
      base:
        description: "Base branch"
        required: false
        default: "main"
        type: string
      # Replaces the branch diff as the target and skips the worthiness check.
      focus:
        description: "Test focus"
        required: false
        default: ""
        type: string
      # resolve maps each option to the opus/sonnet/both the explore matrix
      # compares, so a renamed option needs its case updated there too.
      model:
        description: "Model"
        required: false
        default: "Opus"
        type: choice
        options:
          - Opus
          - Sonnet
          - Both (Opus + Sonnet)
      # Minutes to explore; the agent is told when they are up and stopped 10
      # minutes later. Setup and the build are not counted. 15 is about the
      # least that yields a useful run.
      time_limit:
        description: "Time limit (minutes)"
        required: false
        default: ""
        type: string
      worthiness_check:
        description: "Worthiness check"
        required: false
        default: true
        type: boolean
      # Replays each finding on main's latest daily build to group it (Only in
      # PR, Also in latest build, Unknown). Off: no download, no replays, and
      # the report has no groups. The repo variable EXPLORE_MAIN_REPLAY=off
      # turns it off for every run, /explore included.
      main_replay:
        description: "Compare findings with main's latest build"
        required: false
        default: true
        type: boolean
      # Set by test-exploratory-suggest.yml for the auto-run experiment
      # (#16610). The run then posts to this PR like a `/explore`, but only
      # once the worthiness check passes it: a decline stays off the PR.
      auto_run_pr:
        description: "Auto-run: PR to post results on"
        required: false
        default: ""
        type: string
  # `/explore` (or `/test`, `/exploratory-test`) on a PR. Runs from main's copy of this
  # file with full secrets, and the explore job builds and executes the PR's
  # code, so the resolve job is the entire defence. See its comment.
  issue_comment:
    types: [created]

# No job here takes id-token: the S3 upload happens in positron-builds, and
# every job here reads untrusted input.
permissions:
  contents: read
  packages: read

jobs:
  # Decides who may run this, and on what. Not to be confused with
  # `worthiness`, which decides whether a change is worth testing. Both
  # triggers end in the same outputs: ok=true, the pinned SHA, whether worthiness
  # runs, and the PR, base, model, focus and time limit. Every later job reads
  # only these.
  #
  # issue_comment runs in base-repo context with full secrets, even for fork
  # PRs, and explore compiles and runs the PR head. PETE also mounts the PR
  # read-only; that layer is not available here, since running the PR's code is
  # the point. So BOTH the commenter and the PR author must be active
  # positron-dev members: an outsider cannot bait a member into commenting
  # `/test` on their PR. A PR opened by the @claude workflow's App counts as a
  # member's. Fails closed on any error.
  #
  # Dispatching already takes write access, so there is no team lookup, but
  # `ref` must be a branch of this repo: refs/pull/N/head and bare SHAs also
  # reach a fork PR's code, which the comment path refuses.
  resolve:
    name: resolve
    # Cheap prefilter so ordinary comments do not start a runner. startsWith,
    # not contains: contains fires on a comment that merely mentions /test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/explore') ||
        startsWith(github.event.comment.body, '/test') ||
        startsWith(github.event.comment.body, '/exploratory-test')))
    runs-on: ubuntu-latest
    # Reads membership with the App token below and the PR with GITHUB_TOKEN.
    # No write access on the one job that runs for every matching comment. A
    # blocked member gets the reason from announce; anyone else gets silence.
    permissions:
      # To find a run already going on the PR.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.comment.outputs.ok || steps.dispatch.outputs.ok }}
      busy: ${{ steps.comment.outputs.busy }}
      blocked: ${{ steps.comment.outputs.blocked }}
      sha: ${{ steps.comment.outputs.sha || steps.dispatch.outputs.sha }}
      ref: ${{ steps.comment.outputs.ref || steps.dispatch.outputs.ref }}
      base_ref: ${{ steps.comment.outputs.base_ref || steps.dispatch.outputs.base_ref }}
      pr_number: ${{ steps.comment.outputs.pr_number || steps.dispatch.outputs.pr_number }}
      model: ${{ steps.comment.outputs.model || steps.dispatch.outputs.model }}
      focus: ${{ steps.comment.outputs.focus || steps.dispatch.outputs.focus }}
      time_limit: ${{ steps.comment.outputs.time_limit || steps.dispatch.outputs.time_limit }}
      # run, focus or off: whether worthiness runs, and if not, why.
      worthiness: ${{ steps.comment.outputs.worthiness || steps.dispatch.outputs.worthiness }}
    steps:
      # dispatch hands this ref's SHA to positron-builds as the harness, which
      # must be main's.
      - name: Refuse runs off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Exploratory runs start only from main. To test a harness change, run explore-pr.yml by hand in positron-builds, from a throwaway branch cut from its main, with harness_ref set to your branch."
          exit 1

      - name: Mint org-scoped App token
        id: app-token
        if: github.event_name == 'issue_comment'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          owner: posit-dev

      - name: Check command and membership
        id: comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          echo "ok=false" >> "$GITHUB_OUTPUT"

          # The prefilter matched a prefix, so "/testing" got this far. Only the
          # exact command counts: the first word of the first non-blank line.
          # /explore is the advertised name; /test and /exploratory-test (the
          # skill's name) are older aliases.
          # Web UI comments use CRLF, so drop the CR or "/test\r" never matches.
          first=$(printf '%s\n' "$BODY" | tr -d '\r' | awk 'NF { print $1; exit }')
          if [ "$first" != "/explore" ] && [ "$first" != "/test" ] && [ "$first" != "/exploratory-test" ]; then
            echo "Not an /explore command (first word: '$first')"
            exit 0
          fi

          # After the command, an optional time limit (20m) and then the focus:
          # everything else, on one line. The model is the dispatch's choice
          # only; a comment always runs opus.
          rest=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk 'NF && !seen { seen = 1; sub(/^[ \t]*[^ \t]+/, "") } seen' \
            | tr '\n\t' '  ' | tr -s ' ' | sed 's/^ //; s/ $//')
          time_limit=""
          word=$(printf '%s' "${rest%% *}" | tr '[:upper:]' '[:lower:]')
          if [[ "$word" =~ ^[0-9]+m$ ]]; then
            time_limit=$word
            if [[ "$rest" == *" "* ]]; then rest=${rest#* }; else rest=""; fi
          fi
          # Capped: it is shown in the PR comment and handed to the agent.
          focus=${rest:0:500}

          # Active member: 200 {"state":"active"}. Non-member: 404, empty
          # stdout. Pending invite: "pending", which does not count.
          is_member() {
            local state
            state=$(gh api "orgs/posit-dev/teams/positron-dev/memberships/$1" --jq '.state' 2>/dev/null)
            [ "$state" = "active" ]
          }

          # The URL of a run still queued or going on this PR's head ($1), or
          # nothing. Each run's comment names its run and short SHA; an auto-run
          # yet to comment is found by its run-name. A focused run is no repeat.
          busy_run() {
            local seen status
            seen=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '[.[] | select(.user.type == "Bot") | .body
                | select(contains("<!-- exploratory-test -->") and (contains("\nFocus: ") | not))
                | {run: (capture("actions/runs/(?<r>[0-9]+)").r | tonumber), sha: capture("Exploratory testing\\*\\* (?<s>[0-9a-f]{7})").s}]' \
              | jq -sc 'add // []')
            for status in queued in_progress; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test-exploratory.yml/runs?status=${status}&per_page=100" \
                | jq -r --argjson seen "$seen" --arg head "${1:0:7}" --arg title "Exploratory auto-run #${PR_NUMBER}" \
                  '.workflow_runs[] | .id as $id | ($seen | map(select(.run == $id))) as $mine
                  | select(if $mine == [] then (.display_title == $title or (.display_title | startswith($title + " "))) else any($mine[]; .sha == $head) end) | .html_url'
            done | head -n 1
          }

          # claude.yml opens PRs as positron-projects[bot], which cannot join a
          # team. Only users with write access can invoke it, and the head-repo
          # check below still applies.
          author_ok() {
            [ "$1" = "positron-projects[bot]" ] || is_member "$1"
          }

          # Past the commenter check, so the reason goes back on the PR.
          block() {
            echo "Membership gate: blocked ($1)"
            { echo "blocked=$1"; echo "pr_number=$PR_NUMBER"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! is_member "$COMMENTER"; then
            echo "Membership gate: blocked (commenter $COMMENTER is not an active positron-dev member)"
            exit 0
          fi
          if ! author_ok "$PR_AUTHOR"; then
            block "the PR author, $PR_AUTHOR, is not an active positron-dev member"
          fi

          # Authoring a PR is not controlling its head: a fork's owner can push
          # after a member comments. Only an open PR whose head is in this repo,
          # where pushing already takes write access. Pin the SHA here, so a
          # later push does not change what explore checks out.
          if ! pr=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
            block "the workflow could not read this PR"
          fi
          state=$(jq -r '.state' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr")
          if [ "$state" != "open" ]; then
            block "the PR is $state"
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            block "the PR branch is in $head_repo, not this repo"
          fi

          # A plain /explore while a run on the same head is going is a repeat. Fails
          # open: a missed repeat costs a run, a wrong block costs theirs.
          if [ -z "$focus" ]; then
            busy=$(GH_TOKEN="$REPO_TOKEN" busy_run "$(jq -r '.head.sha' <<<"$pr")" 2>/dev/null)
            if [ -n "$busy" ]; then
              { echo "busy=$busy"; echo "pr_number=$PR_NUMBER"; } >> "$GITHUB_OUTPUT"
              echo "Already running on this PR: $busy"
              exit 0
            fi
          fi
          {
            echo "sha=$(jq -r '.head.sha' <<<"$pr")"
            echo "ref=$(jq -r '.head.ref' <<<"$pr")"
            echo "base_ref=$(jq -r '.base.ref' <<<"$pr")"
            echo "pr_number=$PR_NUMBER"
            echo "model=opus"
            echo "time_limit=$time_limit"
            echo "focus=$focus"
            echo "worthiness=$([ -n "$focus" ] && echo focus || echo run)"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"
          echo "Membership gate: ok (time limit=${time_limit:-none}, focus=${focus:-none})"

      - name: Resolve branch and PR
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base }}
          MODEL: ${{ inputs.model }}
          FOCUS: ${{ inputs.focus }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          WORTHINESS_CHECK: ${{ inputs.worthiness_check }}
          AUTO_RUN_PR: ${{ inputs.auto_run_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every value below goes into GITHUB_OUTPUT, where a newline would
          # start a new key: a second sha= would replace the pinned one. Each
          # input is held to the shape it needs, or is flattened, before it
          # is written.
          if ! [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::'${BASE_REF}' is not a branch name."
            exit 1
          fi
          if ! [[ "$TIME_LIMIT" =~ ^([0-9]+[mM]?)?$ ]]; then
            echo "::error::Time limit '${TIME_LIMIT}' is not a number of minutes, as 20 or 20m."
            exit 1
          fi
          if ! [[ "$AUTO_RUN_PR" =~ ^[0-9]*$ ]]; then
            echo "::error::auto_run_pr '${AUTO_RUN_PR}' is not a PR number."
            exit 1
          fi
          # Exact name only: git ls-remote patterns match any ref that ends in them.
          sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${REF}" \
            | awk -v want="refs/heads/${REF}" '$2 == want { print $1 }')
          if [ -z "$sha" ]; then
            echo "::error::'${REF}' is not a branch of ${GITHUB_REPOSITORY}. Pass a branch name; fork PRs, refs/pull/* and SHAs are refused."
            exit 1
          fi
          echo "Exploring ${REF} at ${sha}"
          # A dispatch has no PR in its event. An auto-run names its PR; for
          # any other, find the ref's open PR so the summary and report can
          # link it. None found just means no link.
          pr=$AUTO_RUN_PR
          if [ -z "$pr" ]; then
            pr=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${REF}" -f state=open \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -n "$pr" ]; then echo "PR #$pr"; else echo "no open PR"; fi
          # The choice's label, as the name the explore matrix compares. Any
          # case, and the bare names, since an API dispatch may send either.
          case "$(printf '%s' "$MODEL" | tr '[:upper:]' '[:lower:]')" in
            sonnet) model=sonnet ;;
            both | "both (opus + sonnet)") model=both ;;
            *) model=opus ;;
          esac
          focus=$(printf '%s' "$FOCUS" | tr '\r\n\t' '   ' | tr -s ' ' | sed 's/^ //; s/ $//')
          if [ -n "$focus" ]; then worthiness=focus
          elif [ "$WORTHINESS_CHECK" != "true" ]; then worthiness=off
          else worthiness=run
          fi
          {
            echo "sha=$sha"
            echo "ref=$REF"
            echo "base_ref=$BASE_REF"
            echo "pr_number=$pr"
            echo "model=$model"
            echo "time_limit=$TIME_LIMIT"
            # On one line, as a comment's focus is.
            echo "focus=$focus"
            echo "worthiness=$worthiness"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"

  # The write half of resolve, split off so the job that reads every matching
  # comment holds no write token. Runs alongside worthiness, so the run page
  # names its PR and the commenter sees the run was picked up within seconds.
  # A repeat /explore gets a pointer to the run already going instead, and a
  # blocked one gets the reason.
  announce:
    name: announce
    needs: [resolve]
    if: needs.resolve.outputs.ok == 'true' || needs.resolve.outputs.busy != '' || needs.resolve.outputs.blocked != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      reaction_id: ${{ steps.react.outputs.reaction_id }}
      comment_id: ${{ steps.running.outputs.comment-id }}
    steps:
      - name: Point to the run already going
        if: needs.resolve.outputs.busy != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_URL: ${{ needs.resolve.outputs.busy }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="An exploratory test is already running on this PR ([view run](${RUN_URL})), so this \`/explore\` was skipped. Comment \`/explore\` again once it finishes, or \`/explore <focus>\` to test something specific alongside it." > /dev/null

      - name: Say why the run was blocked
        if: needs.resolve.outputs.blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REASON: ${{ needs.resolve.outputs.blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="This \`/explore\` was skipped: ${REASON} ([view run](${RUN_URL}))." > /dev/null

      - name: Acknowledge /explore
        id: react
        if: github.event_name == 'issue_comment' && needs.resolve.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          REACTION_ID=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes --jq '.id' 2>/dev/null) || echo "Failed to add reaction (non-fatal)"
          echo "reaction_id=${REACTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        if: needs.resolve.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # One comment per /explore, under the command that asked for it. report
      # turns it into this run's result; earlier runs' results stay put. An
      # auto-run's comment waits for the gate, in ack-auto.
      - name: Post running comment
        id: running
        if: github.event_name == 'issue_comment' && needs.resolve.outputs.ok == 'true'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: running
          focus: ${{ needs.resolve.outputs.focus }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

      # The run page names its PR now, not when explore ends.
      - name: Summarize the target
        if: needs.resolve.outputs.ok == 'true'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: summary
          branch: ${{ needs.resolve.outputs.ref }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          focus: ${{ needs.resolve.outputs.focus }}
          time-limit: ${{ needs.resolve.outputs.time_limit }}

      # worthiness writes its own verdict when it runs. When it does not, say
      # why here, so the run page never leaves it unexplained.
      - name: Say why the worthiness check is skipped
        if: needs.resolve.outputs.ok == 'true' && needs.resolve.outputs.worthiness != 'run'
        env:
          WHY: ${{ needs.resolve.outputs.worthiness == 'focus' && 'A test focus was named, and what to test is then the person''s call' || 'It was turned off for this run' }}
        run: |
          printf '**Worthiness check skipped**, explore will run.\n\n%s.\n' "$WHY" >> "$GITHUB_STEP_SUMMARY"

  # Decides whether the change is worth testing, before anything is built. Not
  # to be confused with `resolve`, which decides who may run this at all.
  # The explore job needs a compile, an Xvfb, a launch and a Playwright attach;
  # a change this pass declines should not pay for twenty minutes of 8-core
  # runner first. One pass serves every matrix leg.
  worthiness:
    name: worthiness
    needs: [resolve]
    # Runs when no focus is named, on a comment or on a dispatch that leaves it
    # on: the gate rules on the diff, and a named feature is the person's call.
    # resolve decides which, and announce reads the same output to say why
    # this job was skipped. Behind resolve, because it checks out the PR and
    # gives an agent a shell in it.
    if: needs.resolve.outputs.ok == 'true' && needs.resolve.outputs.worthiness == 'run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      testable: ${{ steps.gate.outputs.testable }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The checkout above is the branch under test, and it is the code this job
      # builds and drives. It is not where the job's own tooling comes from.
      # `./.github/actions/...` resolves against the workspace root, so every
      # local action would be whichever version that branch happens to carry:
      # missing entirely for one this branch adds, and stale for one it changes.
      # Take the actions and the skill from the ref the workflow was dispatched
      # from, so a run is driven by this version whatever it is pointed at.
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve diff base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ needs.resolve.outputs.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::error::Base branch '$BASE_REF' not found on origin"
            exit 1
          fi
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A blocker such as an unmerged companion PR is often named only in the
      # description. Best effort: no PR, or a failed lookup, writes no file and
      # the gate rules on the diff alone.
      - name: Fetch the PR description
        id: pr-body
        if: needs.resolve.outputs.pr_number != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pr-body.md"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""' > "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"

      - name: Rule on the change
        id: gate
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: gate
          anthropic-api-key: ${{ env.ANTHROPIC_KEY }}
          pr-body-file: ${{ steps.pr-body.outputs.file }}
          base-sha: ${{ steps.base.outputs.base }}
          head-sha: ${{ steps.base.outputs.head }}

  # announce's running comment for an auto-run, after the gate rather than
  # alongside it: nobody asked for this run, so a declined one says nothing on
  # the PR. No reaction, since there is no comment to react to.
  ack-auto:
    name: ack-auto
    needs: [resolve, worthiness]
    # always(): worthiness is skipped when its check is off.
    if: >-
      ${{ always() && inputs.auto_run_pr != '' &&
      needs.resolve.outputs.ok == 'true' && needs.worthiness.outputs.testable != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      comment_id: ${{ steps.running.outputs.comment-id }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post running comment
        id: running
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: running
          auto-run: "true"
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

  # Runs the exploration in posit-dev/positron-builds (explore-pr.yml), which
  # builds and runs the PR's code, scans the output and publishes the report.
  # This job holds no secret but the bot key: it cuts a branch for the run,
  # dispatches it, waits, and turns its result files into one state per model.
  dispatch:
    name: dispatch
    needs: [resolve, worthiness]
    # always(): worthiness is skipped when its check is off or a focus is named,
    # and a skipped need would otherwise skip this job. Only an explicit ok=true
    # from resolve runs it, so a failed or cancelled resolve runs nothing. Only
    # main may hand its harness SHA to positron-builds.
    if: >-
      ${{ always() && needs.resolve.outputs.ok == 'true' &&
      needs.worthiness.outputs.testable != 'false' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      # To tell which positron runs a leftover explore-run branch belongs to.
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
      run_attempt: ${{ steps.run.outputs.attempt }}
      results: ${{ steps.collect.outputs.results }}
      scan_urls: ${{ steps.collect.outputs.scan_urls }}
    env:
      POSITRON_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      LANE: explore-run/${{ github.run_id }}-${{ github.run_attempt }}
      # on or off: whether findings are replayed on main's latest daily build.
      MAIN_REPLAY: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.main_replay) || vars.EXPLORE_MAIN_REPLAY == 'off') && 'off' || 'on' }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            /.nvmrc
            .github/actions/pr-exploratory-test
            .claude/skills/exploratory-test/renderer
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # dispatch-result.ts needs a Node that runs TypeScript.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .harness/.nvmrc

      # lib.mjs reads the renderer's shared text helpers, which need marked.
      - name: Install renderer dependencies
        run: npm ci --prefix .harness/.claude/skills/exploratory-test/renderer --ignore-scripts --no-audit --no-fund

      - name: Mint a token for the sweep and the branch
        id: setup-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: write
          permission-contents: write

      # A run whose cleanup failed leaves its branch behind; remove those whose
      # positron run has finished.
      - name: Remove finished runs' branches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.setup-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          refs=$(gh api --paginate "repos/posit-dev/positron-builds/git/matching-refs/heads/explore-run/" --jq '.[].ref') || {
            echo "::warning::Could not list explore-run branches."
            exit 0
          }
          for ref in $refs; do
            name=${ref#refs/heads/}
            run=${name#explore-run/}
            [[ "$run" =~ ^[0-9]+-[0-9]+$ ]] || continue
            status=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run%%-*}" --jq '.status' 2>/dev/null) || continue
            if [ "$status" = "completed" ]; then
              if gh api -X DELETE "repos/posit-dev/positron-builds/git/refs/heads/$name" > /dev/null; then
                echo "Removed $name"
              else
                echo "::warning::Could not remove $name."
              fi
            fi
          done

      # positron-builds runs a bot dispatch only from its own branch cut from
      # main, so a cache one run saves is never restored by another.
      - name: Cut the run branch
        id: cut
        env:
          GH_TOKEN: ${{ steps.setup-token.outputs.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api repos/posit-dev/positron-builds/git/ref/heads/main --jq '.object.sha')
          gh api repos/posit-dev/positron-builds/git/refs -f "ref=refs/heads/$LANE" -f "sha=$main_sha" > /dev/null
          echo "Cut $LANE at $main_sha"

      # Minted here so the first wait part has its full hour.
      - name: Mint a token for the dispatch and the first wait
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: write

      - name: Dispatch the explore run
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
          PR: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref || 'main' }}
          MODEL: ${{ needs.resolve.outputs.model }}
          FOCUS: ${{ needs.resolve.outputs.focus }}
          TIME_LIMIT: ${{ needs.resolve.outputs.time_limit }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(-f "positron_run=$POSITRON_RUN" -f "sha=$SHA" -f "base=$BASE_REF" -f "model=$MODEL"
            -f "focus=$FOCUS" -f "time_limit=$TIME_LIMIT" -f "main_replay=$MAIN_REPLAY" -f "harness_sha=$HARNESS_SHA")
          if [ -n "$PR" ]; then args+=(-f "pr_number=$PR"); else args+=(-f "branch=$REF"); fi
          gh workflow run explore-pr.yml -R posit-dev/positron-builds --ref "$LANE" "${args[@]}"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          # The dispatch API returns no run id; find the run by its run-name, and
          # only among dispatches the bot itself started.
          id=""
          for _ in $(seq 1 24); do
            id=$(gh api "repos/posit-dev/positron-builds/actions/workflows/explore-pr.yml/runs?event=workflow_dispatch&branch=$LANE" \
              --jq ".workflow_runs[] | select((.display_title | startswith(\"explore $POSITRON_RUN \")) and .triggering_actor.login == \"positron-bot[bot]\") | .id" | head -n 1)
            if [ -n "$id" ]; then break; fi
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "::error::Dispatched explore-pr.yml but could not find its run within two minutes."
            exit 1
          fi
          url="https://github.com/posit-dev/positron-builds/actions/runs/$id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "Exploring at $url"
          echo "Exploratory run in positron-builds: $url" >> "$GITHUB_STEP_SUMMARY"

      # App tokens live for an hour. Wait in parts with a fresh token for each,
      # so a long run is still reported rather than lost.
      - name: Wait for the explore run (first hour)
        id: wait1
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set +e
          bash .harness/.github/actions/pr-exploratory-test/wait-run.sh "$RUN_ID" 3300
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 124 ] && echo "Still running after 55 minutes; waiting with a fresh token."
          exit 0

      - name: Mint a second token
        if: steps.wait1.outputs.code == '124'
        id: token2
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: read

      - name: Wait for the explore run (second hour)
        if: steps.wait1.outputs.code == '124'
        id: wait2
        env:
          GH_TOKEN: ${{ steps.token2.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set +e
          bash .harness/.github/actions/pr-exploratory-test/wait-run.sh "$RUN_ID" 3300
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 124 ] && echo "Still running after 110 minutes; waiting with a fresh token."
          exit 0

      - name: Mint a third token
        if: steps.wait2.outputs.code == '124'
        id: token3
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: read

      - name: Wait for the explore run (third hour)
        if: steps.wait2.outputs.code == '124'
        id: wait3
        env:
          GH_TOKEN: ${{ steps.token3.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set +e
          bash .harness/.github/actions/pr-exploratory-test/wait-run.sh "$RUN_ID" 3300
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 124 ] && echo "::warning::Still running after 165 minutes; cancelling it."
          exit 0

      # Fresh, for everything after the wait: cancel, read, download, clean up.
      - name: Mint a token to finish with
        if: always() && steps.cut.outcome == 'success'
        id: final-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: write
          permission-contents: write

      # Cancelling this run would otherwise leave the explore job running there,
      # as would a dispatch whose run the lookup never found, a wait that gave
      # up (code 2), or a run that outlasted every wait.
      - name: Cancel the explore run
        if: >-
          ${{ always() && ((cancelled() && steps.dispatch.outputs.run_id != '') ||
          (steps.dispatch.outputs.dispatched == 'true' && steps.dispatch.outputs.run_id == '') ||
          steps.wait1.outputs.code == '2' || steps.wait2.outputs.code == '2' ||
          steps.wait3.outputs.code == '2' || steps.wait3.outputs.code == '124') }}
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/posit-dev/positron-builds/actions/workflows/explore-pr.yml/runs?event=workflow_dispatch&branch=$LANE" \
              --jq ".workflow_runs[] | select((.display_title | startswith(\"explore $POSITRON_RUN \")) and .triggering_actor.login == \"positron-bot[bot]\") | .id" \
              | head -n 1) || RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::warning::Found no explore run to cancel."
            exit 0
          fi
          gh run cancel "$RUN_ID" -R posit-dev/positron-builds || echo "::warning::Could not cancel explore run $RUN_ID."

      # A model timed out when its explore job did not succeed and ran for the
      # whole job limit. The bot has no Checks access, so the timeout
      # annotation cannot be read; the job's own times can.
      - name: Read the explore run
        id: run
        if: always() && steps.dispatch.outputs.run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          # Must match the explore job's timeout-minutes in positron-builds' explore-pr.yml.
          EXPLORE_TIMEOUT_MINUTES: 90
        run: |
          set -euo pipefail
          run=$(gh api "repos/posit-dev/positron-builds/actions/runs/$RUN_ID")
          echo "conclusion=$(jq -r '.conclusion // ""' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -r '.run_attempt' <<<"$run")" >> "$GITHUB_OUTPUT"
          JOBS="$RUNNER_TEMP/builds-jobs.json"
          gh api --paginate "repos/posit-dev/positron-builds/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | {id, name, conclusion, html_url, started_at, completed_at}' | jq -s . > "$JOBS"
          # A minute of slack: the reported times can land just under the limit.
          timed_out=$(jq -c --argjson limit "$((EXPLORE_TIMEOUT_MINUTES * 60 - 60))" '[.[]
            | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped"
              and .started_at != null and .completed_at != null)
            | select((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601) >= $limit)
            | .name | capture("^explore \\((?<m>[a-z]+)\\)$").m]' "$JOBS")
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"

      # A missing file means that model failed, so the download never stops the job.
      - name: Download the result files
        if: always() && steps.dispatch.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          repository: posit-dev/positron-builds
          run-id: ${{ steps.dispatch.outputs.run_id }}
          github-token: ${{ steps.final-token.outputs.token }}
          pattern: explore-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/explore-results

      - name: Download the report URL files
        if: always() && steps.dispatch.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          repository: posit-dev/positron-builds
          run-id: ${{ steps.dispatch.outputs.run_id }}
          github-token: ${{ steps.final-token.outputs.token }}
          pattern: explore-report-url-*
          merge-multiple: true
          path: ${{ runner.temp }}/explore-results

      - name: Collect the results
        id: collect
        if: always()
        env:
          RESULT_DIR: ${{ runner.temp }}/explore-results
          JOBS_FILE: ${{ runner.temp }}/builds-jobs.json
          MODEL: ${{ needs.resolve.outputs.model }}
          RUN_CONCLUSION: ${{ job.status == 'cancelled' && 'cancelled' || steps.run.outputs.conclusion }}
          TIMED_OUT: ${{ steps.run.outputs.timed_out }}
          BUILDS_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          BUILDS_RUN_ATTEMPT: ${{ steps.run.outputs.attempt }}
        run: node .harness/.github/actions/pr-exploratory-test/dispatch-result.ts

      - name: Delete the run branch
        if: always() && steps.cut.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
        run: |
          gh api -X DELETE "repos/posit-dev/positron-builds/git/refs/heads/$LANE" > /dev/null \
            || echo "::warning::Could not delete $LANE; the next run's sweep removes it."

      - name: Report the explore run
        if: always() && steps.dispatch.outputs.run_id != ''
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          url="https://github.com/posit-dev/positron-builds/actions/runs/$RUN_ID"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::The explore run ended ${CONCLUSION:-unfinished}: $url"
            exit 1
          fi
          echo "The explore run passed: $url"

  # Replaces this run's "running" comment with the result and swaps the reaction. A separate job
  # for the same reason as announce. always(): a failed build must still replace
  # "running" with the truth.
  # A /explore's result, or an auto-run's once ack-auto has said it is running.
  report:
    name: report
    needs: [resolve, worthiness, announce, ack-auto, dispatch]
    if: >-
      ${{ always() && needs.resolve.outputs.ok == 'true' &&
      (github.event_name == 'issue_comment' || (inputs.auto_run_pr != '' && needs.ack-auto.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      # actions: read lets the comment name the step a failed run broke at.
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The comment covers one model: opus, or sonnet when it ran alone. A
      # dispatch that wrote no results counts as failed. The comment names the
      # failed step only for an empty outcome, so failed is passed as empty.
      - name: Read the dispatch result
        id: result
        env:
          DECLINED: ${{ needs.worthiness.outputs.testable == 'false' }}
          MODEL: ${{ needs.resolve.outputs.model == 'sonnet' && 'sonnet' || 'opus' }}
          RESULTS: ${{ needs.dispatch.outputs.results }}
          SCAN_URLS: ${{ needs.dispatch.outputs.scan_urls }}
        run: |
          set -uo pipefail
          state=failed
          report_url=""
          scan_url=""
          if [ "$DECLINED" = "true" ]; then
            state=declined
          elif [ -n "$RESULTS" ]; then
            state=$(jq -r --arg m "$MODEL" '.[$m].state // "failed"' <<<"$RESULTS" 2>/dev/null) || state=failed
            report_url=$(jq -r --arg m "$MODEL" '.[$m].reportUrl // ""' <<<"$RESULTS" 2>/dev/null) || report_url=""
            if [ -n "$SCAN_URLS" ]; then
              scan_url=$(jq -r --arg m "$MODEL" '.[$m] // ""' <<<"$SCAN_URLS" 2>/dev/null) || scan_url=""
            fi
          fi
          [[ "$state" =~ ^[a-z-]+$ ]] || state=failed
          [[ "$report_url" =~ ^https://[^[:space:]]+$ ]] || report_url=""
          [[ "$scan_url" =~ ^https://[^[:space:]]+$ ]] || scan_url=""
          {
            echo "model=$MODEL"
            echo "state=$state"
            echo "outcome=$([ "$state" = failed ] || echo "$state")"
            echo "report_url=$report_url"
            echo "scan_url=$scan_url"
          } >> "$GITHUB_OUTPUT"
          echo "Outcome for $MODEL: $state"

      - name: Mint a token to read positron-builds
        id: builds-token
        if: needs.dispatch.outputs.run_id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: read

      - name: Download run directory
        if: steps.builds-token.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: exploratory-run-${{ steps.result.outputs.model }}
          path: /tmp/run-artifact
          repository: posit-dev/positron-builds
          run-id: ${{ needs.dispatch.outputs.run_id }}
          github-token: ${{ steps.builds-token.outputs.token }}

      # The artifact root is the common parent of what matched, so the run dir
      # is nested when code.log or the workspace was uploaded too and at the
      # root when neither was.
      - name: Locate run directory
        run: |
          if [ -d /tmp/run-artifact/exploratory-run ]; then
            echo "WORK_DIR=/tmp/run-artifact/exploratory-run" >> "$GITHUB_ENV"
          else
            echo "WORK_DIR=/tmp/run-artifact" >> "$GITHUB_ENV"
          fi

      # Links only when the upload succeeded, so the comment never points at a
      # report page that 404s; the run link still reaches the artifact.
      - name: Post result comment
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: result
          focus: ${{ needs.resolve.outputs.focus }}
          auto-run: ${{ inputs.auto_run_pr != '' }}
          # Empty when announce could not post; comment mode then posts a new one.
          comment-id: ${{ needs.announce.outputs.comment_id || needs.ack-auto.outputs.comment_id }}
          outcome: ${{ steps.result.outputs.outcome }}
          decline-reason: ${{ needs.worthiness.outputs.reason }}
          work-dir: ${{ env.WORK_DIR }}
          report-base-url: ${{ steps.result.outputs.report_url }}
          builds-run-id: ${{ needs.dispatch.outputs.run_id }}
          builds-run-attempt: ${{ needs.dispatch.outputs.run_attempt || '1' }}
          builds-token: ${{ steps.builds-token.outputs.token }}
          scan-url: ${{ steps.result.outputs.scan_url }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

      # rocket only when the agent finished on its own, +1 when the gate
      # declined. A partial run (turn cap), a job timeout, a failed scan and a
      # hard failure all get confused.
      - name: Finalize reaction
        if: needs.announce.outputs.reaction_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ needs.announce.outputs.reaction_id }}
          OUTCOME: ${{ steps.result.outputs.state }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}" \
            || echo "Failed to remove eyes reaction (non-fatal)"
          case "$OUTCOME" in
            complete) FINAL=rocket ;;
            declined) FINAL=+1 ;;
            *) FINAL=confused ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="$FINAL" || echo "Failed to add ${FINAL} reaction (non-fatal)"
