name: "Test: Exploratory"

# Names what the run tests, before any job starts. test-exploratory-suggest.yml
# finds an auto-run by its "Exploratory auto-run #N" prefix to start one per PR.
# A comment that is not a run command keeps the default, as whitespace does.
# The command must be a whole word, as resolve requires, so "/testing" is not
# named a run. Membership cannot be checked here: a blocked caller's run is
# still named, and resolve then stops it with nothing done.
run-name: >-
  ${{ inputs.auto_run_pr && format('Exploratory auto-run #{0} ({1})', inputs.auto_run_pr, inputs.ref)
  || github.event_name == 'workflow_dispatch' && format('Explore {0}', inputs.ref)
  || github.event.issue.pull_request && (
    github.event.comment.body == '/explore'
    || startsWith(github.event.comment.body, '/explore ')
    || startsWith(github.event.comment.body, format('/explore{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/explore{0}', fromJSON('"\n"')))
    || github.event.comment.body == '/test'
    || startsWith(github.event.comment.body, '/test ')
    || startsWith(github.event.comment.body, format('/test{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/test{0}', fromJSON('"\n"')))
    || github.event.comment.body == '/exploratory-test'
    || startsWith(github.event.comment.body, '/exploratory-test ')
    || startsWith(github.event.comment.body, format('/exploratory-test{0}', fromJSON('"\r"')))
    || startsWith(github.event.comment.body, format('/exploratory-test{0}', fromJSON('"\n"'))))
    && format('Explore #{0}: {1}', github.event.issue.number, github.event.issue.title)
  || ' ' }}

on:
  workflow_dispatch:
    inputs:
      # main against main has no diff, so a run of it needs a Test focus;
      # without one the worthiness check declines it.
      ref:
        description: "Branch to explore"
        required: true
        default: "main"
        type: string
      # Set it when the ref's PR targets a release branch.
      base:
        description: "Base branch"
        required: false
        default: "main"
        type: string
      # Replaces the branch diff as the target and skips the worthiness check.
      focus:
        description: "Test focus"
        required: false
        default: ""
        type: string
      # resolve maps each option to the opus/sonnet/both the explore matrix
      # compares, so a renamed option needs its case updated there too.
      model:
        description: "Model"
        required: false
        default: "Opus"
        type: choice
        options:
          - Opus
          - Sonnet
          - Both (Opus + Sonnet)
      # Minutes to explore; the agent is told when they are up and stopped 10
      # minutes later. Setup and the build are not counted. 15 is about the
      # least that yields a useful run.
      time_limit:
        description: "Time limit (minutes)"
        required: false
        default: ""
        type: string
      worthiness_check:
        description: "Worthiness check"
        required: false
        default: true
        type: boolean
      # Replays each finding on main's latest daily build to group it (Only in
      # PR, Also in latest build, Unknown). Off: no download, no replays, and
      # the report has no groups. The repo variable EXPLORE_MAIN_REPLAY=off
      # turns it off for every run, /explore included.
      main_replay:
        description: "Compare findings with main's latest build"
        required: false
        default: true
        type: boolean
      # Set by test-exploratory-suggest.yml for the auto-run experiment
      # (#16610). The run then posts to this PR like a `/explore`, but only
      # once the worthiness check passes it: a decline stays off the PR.
      auto_run_pr:
        description: "Auto-run: PR to post results on"
        required: false
        default: ""
        type: string
  # `/explore` (or `/test`, `/exploratory-test`) on a PR. Runs from main's copy of this
  # file with full secrets, and the explore job builds and executes the PR's
  # code, so the resolve job is the entire defence. See its comment.
  issue_comment:
    types: [created]

# id-token is granted only to publish, the one job that assumes an AWS role.
# Every other job reads untrusted input, and an OIDC token there could assume
# the report bucket's role.
permissions:
  contents: read
  packages: read

jobs:
  # Decides who may run this, and on what. Not to be confused with
  # `worthiness`, which decides whether a change is worth testing. Both
  # triggers end in the same outputs: ok=true, the pinned SHA, whether worthiness
  # runs, and the PR, base, model, focus and time limit. Every later job reads
  # only these.
  #
  # issue_comment runs in base-repo context with full secrets, even for fork
  # PRs, and explore compiles and runs the PR head. PETE also mounts the PR
  # read-only; that layer is not available here, since running the PR's code is
  # the point. So BOTH the commenter and the PR author must be active
  # positron-dev members: an outsider cannot bait a member into commenting
  # `/test` on their PR. A PR opened by the @claude workflow's App counts as a
  # member's. Fails closed on any error.
  #
  # Dispatching already takes write access, so there is no team lookup, but
  # `ref` must be a branch of this repo: refs/pull/N/head and bare SHAs also
  # reach a fork PR's code, which the comment path refuses.
  resolve:
    name: resolve
    # Cheap prefilter so ordinary comments do not start a runner. startsWith,
    # not contains: contains fires on a comment that merely mentions /test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/explore') ||
        startsWith(github.event.comment.body, '/test') ||
        startsWith(github.event.comment.body, '/exploratory-test')))
    runs-on: ubuntu-latest
    # Reads membership with the App token below and the PR with GITHUB_TOKEN.
    # No write access on the one job that runs for every matching comment. A
    # blocked member gets the reason from announce; anyone else gets silence.
    permissions:
      # To find a run already going on the PR.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.comment.outputs.ok || steps.dispatch.outputs.ok }}
      busy: ${{ steps.comment.outputs.busy }}
      blocked: ${{ steps.comment.outputs.blocked }}
      sha: ${{ steps.comment.outputs.sha || steps.dispatch.outputs.sha }}
      ref: ${{ steps.comment.outputs.ref || steps.dispatch.outputs.ref }}
      base_ref: ${{ steps.comment.outputs.base_ref || steps.dispatch.outputs.base_ref }}
      pr_number: ${{ steps.comment.outputs.pr_number || steps.dispatch.outputs.pr_number }}
      model: ${{ steps.comment.outputs.model || steps.dispatch.outputs.model }}
      focus: ${{ steps.comment.outputs.focus || steps.dispatch.outputs.focus }}
      time_limit: ${{ steps.comment.outputs.time_limit || steps.dispatch.outputs.time_limit }}
      # run, focus or off: whether worthiness runs, and if not, why.
      worthiness: ${{ steps.comment.outputs.worthiness || steps.dispatch.outputs.worthiness }}
    steps:
      - name: Mint org-scoped App token
        id: app-token
        if: github.event_name == 'issue_comment'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          owner: posit-dev

      - name: Check command and membership
        id: comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          echo "ok=false" >> "$GITHUB_OUTPUT"

          # The prefilter matched a prefix, so "/testing" got this far. Only the
          # exact command counts: the first word of the first non-blank line.
          # /explore is the advertised name; /test and /exploratory-test (the
          # skill's name) are older aliases.
          # Web UI comments use CRLF, so drop the CR or "/test\r" never matches.
          first=$(printf '%s\n' "$BODY" | tr -d '\r' | awk 'NF { print $1; exit }')
          if [ "$first" != "/explore" ] && [ "$first" != "/test" ] && [ "$first" != "/exploratory-test" ]; then
            echo "Not an /explore command (first word: '$first')"
            exit 0
          fi

          # After the command, an optional time limit (20m) and then the focus:
          # everything else, on one line. The model is the dispatch's choice
          # only; a comment always runs opus.
          rest=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk 'NF && !seen { seen = 1; sub(/^[ \t]*[^ \t]+/, "") } seen' \
            | tr '\n\t' '  ' | tr -s ' ' | sed 's/^ //; s/ $//')
          time_limit=""
          word=$(printf '%s' "${rest%% *}" | tr '[:upper:]' '[:lower:]')
          if [[ "$word" =~ ^[0-9]+m$ ]]; then
            time_limit=$word
            if [[ "$rest" == *" "* ]]; then rest=${rest#* }; else rest=""; fi
          fi
          # Capped: it is shown in the PR comment and handed to the agent.
          focus=${rest:0:500}

          # Active member: 200 {"state":"active"}. Non-member: 404, empty
          # stdout. Pending invite: "pending", which does not count.
          is_member() {
            local state
            state=$(gh api "orgs/posit-dev/teams/positron-dev/memberships/$1" --jq '.state' 2>/dev/null)
            [ "$state" = "active" ]
          }

          # The URL of a run still queued or going on this PR's head ($1), or
          # nothing. Each run's comment names its run and short SHA; an auto-run
          # yet to comment is found by its run-name. A focused run is no repeat.
          busy_run() {
            local seen status
            seen=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '[.[] | select(.user.type == "Bot") | .body
                | select(contains("<!-- exploratory-test -->") and (contains("\nFocus: ") | not))
                | {run: (capture("actions/runs/(?<r>[0-9]+)").r | tonumber), sha: capture("Exploratory testing\\*\\* (?<s>[0-9a-f]{7})").s}]' \
              | jq -sc 'add // []')
            for status in queued in_progress; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test-exploratory.yml/runs?status=${status}&per_page=100" \
                | jq -r --argjson seen "$seen" --arg head "${1:0:7}" --arg title "Exploratory auto-run #${PR_NUMBER}" \
                  '.workflow_runs[] | .id as $id | ($seen | map(select(.run == $id))) as $mine
                  | select(if $mine == [] then (.display_title == $title or (.display_title | startswith($title + " "))) else any($mine[]; .sha == $head) end) | .html_url'
            done | head -n 1
          }

          # claude.yml opens PRs as positron-projects[bot], which cannot join a
          # team. Only users with write access can invoke it, and the head-repo
          # check below still applies.
          author_ok() {
            [ "$1" = "positron-projects[bot]" ] || is_member "$1"
          }

          # Past the commenter check, so the reason goes back on the PR.
          block() {
            echo "Membership gate: blocked ($1)"
            { echo "blocked=$1"; echo "pr_number=$PR_NUMBER"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! is_member "$COMMENTER"; then
            echo "Membership gate: blocked (commenter $COMMENTER is not an active positron-dev member)"
            exit 0
          fi
          if ! author_ok "$PR_AUTHOR"; then
            block "the PR author, $PR_AUTHOR, is not an active positron-dev member"
          fi

          # Authoring a PR is not controlling its head: a fork's owner can push
          # after a member comments. Only an open PR whose head is in this repo,
          # where pushing already takes write access. Pin the SHA here, so a
          # later push does not change what explore checks out.
          if ! pr=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
            block "the workflow could not read this PR"
          fi
          state=$(jq -r '.state' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr")
          if [ "$state" != "open" ]; then
            block "the PR is $state"
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            block "the PR branch is in $head_repo, not this repo"
          fi

          # A plain /explore while a run on the same head is going is a repeat. Fails
          # open: a missed repeat costs a run, a wrong block costs theirs.
          if [ -z "$focus" ]; then
            busy=$(GH_TOKEN="$REPO_TOKEN" busy_run "$(jq -r '.head.sha' <<<"$pr")" 2>/dev/null)
            if [ -n "$busy" ]; then
              { echo "busy=$busy"; echo "pr_number=$PR_NUMBER"; } >> "$GITHUB_OUTPUT"
              echo "Already running on this PR: $busy"
              exit 0
            fi
          fi
          {
            echo "sha=$(jq -r '.head.sha' <<<"$pr")"
            echo "ref=$(jq -r '.head.ref' <<<"$pr")"
            echo "base_ref=$(jq -r '.base.ref' <<<"$pr")"
            echo "pr_number=$PR_NUMBER"
            echo "model=opus"
            echo "time_limit=$time_limit"
            echo "focus=$focus"
            echo "worthiness=$([ -n "$focus" ] && echo focus || echo run)"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"
          echo "Membership gate: ok (time limit=${time_limit:-none}, focus=${focus:-none})"

      - name: Resolve branch and PR
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base }}
          MODEL: ${{ inputs.model }}
          FOCUS: ${{ inputs.focus }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          WORTHINESS_CHECK: ${{ inputs.worthiness_check }}
          AUTO_RUN_PR: ${{ inputs.auto_run_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every value below goes into GITHUB_OUTPUT, where a newline would
          # start a new key: a second sha= would replace the pinned one. Each
          # input is held to the shape it needs, or is flattened, before it
          # is written.
          if ! [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::'${BASE_REF}' is not a branch name."
            exit 1
          fi
          if ! [[ "$TIME_LIMIT" =~ ^([0-9]+[mM]?)?$ ]]; then
            echo "::error::Time limit '${TIME_LIMIT}' is not a number of minutes, as 20 or 20m."
            exit 1
          fi
          if ! [[ "$AUTO_RUN_PR" =~ ^[0-9]*$ ]]; then
            echo "::error::auto_run_pr '${AUTO_RUN_PR}' is not a PR number."
            exit 1
          fi
          # Exact name only: git ls-remote patterns match any ref that ends in them.
          sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${REF}" \
            | awk -v want="refs/heads/${REF}" '$2 == want { print $1 }')
          if [ -z "$sha" ]; then
            echo "::error::'${REF}' is not a branch of ${GITHUB_REPOSITORY}. Pass a branch name; fork PRs, refs/pull/* and SHAs are refused."
            exit 1
          fi
          echo "Exploring ${REF} at ${sha}"
          # A dispatch has no PR in its event. An auto-run names its PR; for
          # any other, find the ref's open PR so the summary and report can
          # link it. None found just means no link.
          pr=$AUTO_RUN_PR
          if [ -z "$pr" ]; then
            pr=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${REF}" -f state=open \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -n "$pr" ]; then echo "PR #$pr"; else echo "no open PR"; fi
          # The choice's label, as the name the explore matrix compares. Any
          # case, and the bare names, since an API dispatch may send either.
          case "$(printf '%s' "$MODEL" | tr '[:upper:]' '[:lower:]')" in
            sonnet) model=sonnet ;;
            both | "both (opus + sonnet)") model=both ;;
            *) model=opus ;;
          esac
          focus=$(printf '%s' "$FOCUS" | tr '\r\n\t' '   ' | tr -s ' ' | sed 's/^ //; s/ $//')
          if [ -n "$focus" ]; then worthiness=focus
          elif [ "$WORTHINESS_CHECK" != "true" ]; then worthiness=off
          else worthiness=run
          fi
          {
            echo "sha=$sha"
            echo "ref=$REF"
            echo "base_ref=$BASE_REF"
            echo "pr_number=$pr"
            echo "model=$model"
            echo "time_limit=$TIME_LIMIT"
            # On one line, as a comment's focus is.
            echo "focus=$focus"
            echo "worthiness=$worthiness"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"

  # The write half of resolve, split off so the job that reads every matching
  # comment holds no write token. Runs alongside worthiness, so the run page
  # names its PR and the commenter sees the run was picked up within seconds.
  # A repeat /explore gets a pointer to the run already going instead, and a
  # blocked one gets the reason.
  announce:
    name: announce
    needs: [resolve]
    if: needs.resolve.outputs.ok == 'true' || needs.resolve.outputs.busy != '' || needs.resolve.outputs.blocked != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      reaction_id: ${{ steps.react.outputs.reaction_id }}
      comment_id: ${{ steps.running.outputs.comment-id }}
    steps:
      - name: Point to the run already going
        if: needs.resolve.outputs.busy != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_URL: ${{ needs.resolve.outputs.busy }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="An exploratory test is already running on this PR ([view run](${RUN_URL})), so this \`/explore\` was skipped. Comment \`/explore\` again once it finishes, or \`/explore <focus>\` to test something specific alongside it." > /dev/null

      - name: Say why the run was blocked
        if: needs.resolve.outputs.blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REASON: ${{ needs.resolve.outputs.blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="This \`/explore\` was skipped: ${REASON} ([view run](${RUN_URL}))." > /dev/null

      - name: Acknowledge /explore
        id: react
        if: github.event_name == 'issue_comment' && needs.resolve.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          REACTION_ID=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes --jq '.id' 2>/dev/null) || echo "Failed to add reaction (non-fatal)"
          echo "reaction_id=${REACTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Check out the harness
        if: needs.resolve.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # One comment per /explore, under the command that asked for it. report
      # turns it into this run's result; earlier runs' results stay put. An
      # auto-run's comment waits for the gate, in ack-auto.
      - name: Post running comment
        id: running
        if: github.event_name == 'issue_comment' && needs.resolve.outputs.ok == 'true'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: running
          focus: ${{ needs.resolve.outputs.focus }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

      # The run page names its PR now, not when explore ends.
      - name: Summarize the target
        if: needs.resolve.outputs.ok == 'true'
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: summary
          branch: ${{ needs.resolve.outputs.ref }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          focus: ${{ needs.resolve.outputs.focus }}
          time-limit: ${{ needs.resolve.outputs.time_limit }}

      # worthiness writes its own verdict when it runs. When it does not, say
      # why here, so the run page never leaves it unexplained.
      - name: Say why the worthiness check is skipped
        if: needs.resolve.outputs.ok == 'true' && needs.resolve.outputs.worthiness != 'run'
        env:
          WHY: ${{ needs.resolve.outputs.worthiness == 'focus' && 'A test focus was named, and what to test is then the person''s call' || 'It was turned off for this run' }}
        run: |
          printf '**Worthiness check skipped**, explore will run.\n\n%s.\n' "$WHY" >> "$GITHUB_STEP_SUMMARY"

  # Decides whether the change is worth testing, before anything is built. Not
  # to be confused with `resolve`, which decides who may run this at all.
  # The explore job needs a compile, an Xvfb, a launch and a Playwright attach;
  # a change this pass declines should not pay for twenty minutes of 8-core
  # runner first. One pass serves every matrix leg.
  worthiness:
    name: worthiness
    needs: [resolve]
    # Runs when no focus is named, on a comment or on a dispatch that leaves it
    # on: the gate rules on the diff, and a named feature is the person's call.
    # resolve decides which, and announce reads the same output to say why
    # this job was skipped. Behind resolve, because it checks out the PR and
    # gives an agent a shell in it.
    if: needs.resolve.outputs.ok == 'true' && needs.resolve.outputs.worthiness == 'run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      testable: ${{ steps.gate.outputs.testable }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The checkout above is the branch under test, and it is the code this job
      # builds and drives. It is not where the job's own tooling comes from.
      # `./.github/actions/...` resolves against the workspace root, so every
      # local action would be whichever version that branch happens to carry:
      # missing entirely for one this branch adds, and stale for one it changes.
      # Take the actions and the skill from the ref the workflow was dispatched
      # from, so a run is driven by this version whatever it is pointed at.
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve diff base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ needs.resolve.outputs.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::error::Base branch '$BASE_REF' not found on origin"
            exit 1
          fi
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A blocker such as an unmerged companion PR is often named only in the
      # description. Best effort: no PR, or a failed lookup, writes no file and
      # the gate rules on the diff alone.
      - name: Fetch the PR description
        id: pr-body
        if: needs.resolve.outputs.pr_number != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pr-body.md"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""' > "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"

      - name: Rule on the change
        id: gate
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: gate
          anthropic-api-key: ${{ env.ANTHROPIC_KEY }}
          pr-body-file: ${{ steps.pr-body.outputs.file }}
          base-sha: ${{ steps.base.outputs.base }}
          head-sha: ${{ steps.base.outputs.head }}

  # announce's running comment for an auto-run, after the gate rather than
  # alongside it: nobody asked for this run, so a declined one says nothing on
  # the PR. No reaction, since there is no comment to react to.
  ack-auto:
    name: ack-auto
    needs: [resolve, worthiness]
    # always(): worthiness is skipped when its check is off.
    if: >-
      ${{ always() && inputs.auto_run_pr != '' &&
      needs.resolve.outputs.ok == 'true' && needs.worthiness.outputs.testable != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      comment_id: ${{ steps.running.outputs.comment-id }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post running comment
        id: running
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: running
          auto-run: "true"
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

  explore:
    name: explore (${{ matrix.model }})
    needs: [resolve, worthiness]
    # always(): worthiness is skipped when its check is off or a focus is named,
    # and a skipped need would otherwise skip this job. Only an explicit ok=true
    # from resolve runs it, so a failed or cancelled resolve runs nothing.
    if: >-
      ${{ always() && needs.resolve.outputs.ok == 'true' &&
      needs.worthiness.outputs.testable != 'false' }}
    # No concurrency group: two /explore comments on one head, each with its
    # own focus, are meant to run side by side.
    # Read-only on purpose: this job runs PR code and an agent with a shell, and
    # GITHUB_TOKEN is in their environment. announce and report do the writing, and
    # publish does the S3 upload, so no id-token either.
    permissions:
      contents: read
      packages: read
    outputs:
      outcome: ${{ steps.explore.outputs.outcome }}
      outdated: ${{ steps.helpers.outputs.reason }}
    strategy:
      # One model failing should not cancel the other; a partial comparison is
      # still worth reading.
      fail-fast: false
      matrix:
        # Every branch is a literal. Building the JSON with format() put a
        # dispatch input inside the document it was about to parse, which only
        # held because `type: choice` happens to constrain the value.
        # resolve names it opus, sonnet or both; a comment always runs opus.
        model: ${{ needs.resolve.outputs.model == 'both' && fromJSON('["opus","sonnet"]')
          || needs.resolve.outputs.model == 'sonnet' && fromJSON('["sonnet"]')
          || fromJSON('["opus"]') }}
    timeout-minutes: 90
    runs-on: ubuntu-latest-amd64-8-core
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.22.1-py3.14.7-r4.6.1
      options: --user 0:0 --init
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
    # The e2e lane's database, reachable from the container at host "postgres".
    # Its login is a fixed test value, not the e2e secret: the database lives
    # only for this job, and Positron's connection form shows the password
    # unmasked, so it ends up in screenshots redaction cannot reach.
    services:
      postgres:
        image: ghcr.io/posit-dev/positron-postgres:24.22.1-py3.14.7-r4.6.1
        credentials:
          username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
          password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
        env:
          # Match E2E_POSTGRES_USER / E2E_POSTGRES_PASSWORD in the job env below.
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: exploratory-test
          POSTGRES_DB: postgres
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0
      # on or off: whether findings are replayed on main's latest daily build.
      MAIN_REPLAY: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.main_replay) || vars.EXPLORE_MAIN_REPLAY == 'off') && 'off' || 'on' }}
      HOME: /root
      R_LIBS_SITE: /usr/local/lib/R/site-library
      R_LIBS_USER: /usr/local/lib/R/site-library
      # reticulate 1.47 cannot run on Python 3.14 (rstudio/reticulate#1930); bind the 3.13
      RETICULATE_PYTHON: /root/.pyenv/versions/3.13.0/bin/python
      E2E_POSTGRES_USER: e2e
      E2E_POSTGRES_PASSWORD: exploratory-test
    steps:
      # The SHA resolve pinned, so a push after the gate is
      # not tested.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # The tooling comes from the dispatching ref, as in the worthiness job.
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
            .claude/skills/drive-positron/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A build of main for the explorer to replay each finding on, which
      # decides the finding's Origin. One download, run in the background while
      # the PR builds: a process a step starts lives until the job ends. Main
      # daily ready below picks it up; a failure only means no Origins.
      - name: Download main daily (background)
        if: env.MAIN_REPLAY == 'on'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/positron-main"
          nohup node .harness/.claude/skills/exploratory-test/renderer/main-build.mjs fetch \
            --out "$RUNNER_TEMP/positron-main" --platform deb/x86_64 \
            > "$RUNNER_TEMP/positron-main.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/positron-main.pid"

      # The explorer's instructions come from the harness, the helpers from the
      # branch under test. A branch older than the helper rewrite lacks the
      # helpers they name, so stop before the build with what to do about it.
      - name: Check the branch has the current helpers
        id: helpers
        shell: bash
        run: |
          if [[ ! -f .claude/skills/drive-positron/scripts/dp.ts ]]; then
            # The result comment shows this reason, so the author need not open the run.
            REASON="this branch predates the drive-positron helper update that exploratory runs need. Rebase it onto main and comment /explore again."
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "::error::${REASON^}"
            exit 1
          fi

      - name: Resolve diff base
        id: base
        shell: bash
        env:
          # The PR's own target, so a PR into a release branch is not diffed
          # against everything main has gained since the branch was cut.
          BASE_REF: ${{ needs.resolve.outputs.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 fetched all branches, so origin/$BASE_REF is present.
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::error::Base branch '$BASE_REF' not found on origin"
            exit 1
          fi
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE (origin/$BASE_REF)"

      # Issues the PR fixes or that mention it, for the explorer's brief. Fetched
      # before the build so the lookup is done by the time the agent starts.
      # Best effort: any failure writes an empty list and the run goes on.
      - name: Fetch issues linked to the PR
        id: known
        if: needs.resolve.outputs.pr_number != ''
        continue-on-error: true
        shell: bash
        env:
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          RENDERER=.harness/.claude/skills/exploratory-test/renderer
          # Explore installs these later, but known-issues.mjs imports them now.
          npm --prefix "$RENDERER" ci --no-audit --no-fund
          OUT="$RUNNER_TEMP/known-issues.json"
          node "$RENDERER/known-issues.mjs" --pr "$PR" --out "$OUT" --repo "$GITHUB_REPOSITORY"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Restore caches
        id: restore-caches
        uses: ./.harness/.github/actions/restore-build-caches

      - name: Install node dependencies
        if: steps.restore-caches.outputs.cache-npm-core-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true'
        uses: nick-fields/retry@v4
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          POSITRON_GITHUB_RO_PAT: ${{ github.token }}
          POSITRON_PARALLEL_INSTALL: '0'
          POSITRON_NPM_CONCURRENCY: '10'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NPM_CONFIG_DEVDIR: '.node-gyp-cache'
          DOCKER_CONFIG: /tmp/.docker
          POSITRON_EXTENSIONS_FILTER: ${{ (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true' && 'stable') || (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' && 'volatile') || '' }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 5
          shell: bash
          command: bash scripts/install-npm-parallel.sh

      - name: Download binaries (Ark, Kallichore)
        uses: ./.harness/.github/actions/download-binaries
        with:
          cache-hit: ${{ steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' ||
                         steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' }}

      - name: Install E2E test dependencies
        run: npm --prefix test/e2e ci --prefer-offline --no-audit --no-fund

      - name: Compile Positron and Download Electron
        run: npm exec -- npm-run-all --max-old-space-size=8192 -p compile "electron x64"

      - name: Prelaunch
        run: npm run prelaunch

      # Waits for the download started before the build, which has usually
      # finished by now. Without a main build the run goes on, and no finding
      # gets an Origin.
      - name: Main daily ready
        if: env.MAIN_REPLAY == 'on'
        continue-on-error: true
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/positron-main"
          PID=$(cat "$RUNNER_TEMP/positron-main.pid" 2>/dev/null || true)
          for _ in $(seq 1 300); do
            if [[ -z "$PID" ]] || ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ -n "$PID" ]] && kill -0 "$PID" 2>/dev/null; then
            kill "$PID" || true
          fi
          if [[ ! -f "$DIR/main-build.json" ]]; then
            echo "::warning::No main build, so no finding gets an Origin: $(tail -n 5 "$RUNNER_TEMP/positron-main.log" 2>/dev/null | tr '\n' ' ')"
            exit 0
          fi
          # The verifier's drift check diffs the fix files between main's commit and the base.
          COMMIT=$(node -p 'require(process.argv[1]).commit' "$DIR/main-build.json")
          if ! git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$COMMIT" || echo "::warning::Could not fetch main at $COMMIT; findings whose fix files cannot be compared will be Unknown"
          fi
          echo "MAIN_BUILD=$DIR/main-build.json" >> "$GITHUB_ENV"
          echo "Main build: $(cat "$DIR/main-build.json")"

      - name: Set permissions on SUID sandbox helper
        run: |
          ELECTRON_ROOT=.build/electron
          sudo chown root $ELECTRON_ROOT/chrome-sandbox
          sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
          stat $ELECTRON_ROOT/chrome-sandbox

      # No setup-test-env: nothing here runs the e2e suite, and its QA AWS role
      # would sit in the agent's environment for no use. The S3 upload assumes
      # its own role after the agent has finished.

      - name: Install jq and lsof
        shell: bash
        run: |
          set -euo pipefail
          # Not in the container image. launch.sh output parsing below needs
          # jq, and so do monaco-paste.sh, quickpick-enum.sh, and the snapshot
          # recipe the agent follows from the drive-positron skill. stop.sh
          # needs lsof to find the instance on a CDP port.
          sudo apt-get update && sudo apt-get install -y jq lsof
          jq --version

      - name: Setup Xvfb
        uses: ./.harness/.github/actions/setup-xvfb

      - name: Alter AppArmor restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Write seed profile and scratch workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/positron-seed/User
          # window.dialogStyle defaults to native, and a native message box is a
          # separate OS window: invisible to CDP screenshots and unclickable by
          # the driver, so the extension host waits on it forever. A run hit that
          # and filed the stuck button as a major product defect. launch.sh sets
          # this too, but only on branches carrying that change, so pin it here
          # where the harness controls it.
          printf '{ "window.dialogStyle": "custom", "files.simpleDialog.enable": true }\n' \
            > /tmp/positron-seed/User/settings.json
          mkdir -p /tmp/exploratory-workspace
          echo "# scratch" > /tmp/exploratory-workspace/README.md

      - name: Check compiled output exists
        shell: bash
        run: |
          set -euo pipefail
          test -d out || { echo "out/ missing -- compile did not run"; exit 1; }
          echo "out/ present, $(find out -name '*.js' | wc -l) js files"

      # publish re-derives the same directory from these inputs, so change
      # them in both places.
      - name: Allocate report dir
        uses: ./.harness/.github/actions/gen-report-dir
        with:
          prefix: exploratory-report
          identifier: ${{ matrix.model }}
          arch: x64
          skip-summary: "true"

      - name: Allocate run directory
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPLORE_DIR=/tmp/exploratory-run" >> "$GITHUB_ENV"
          echo "REPORT_BASE_URL=${REPORT_URL%/index.html}" >> "$GITHUB_ENV"
          mkdir -p /tmp/exploratory-run/shots

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"

      - name: Launch Positron
        shell: bash
        env:
          # Assistant reads provider keys from the environment, so the app
          # starts signed in and the explorer can exercise it.
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_KEY }}
        run: |
          set -euo pipefail
          # Electron occasionally segfaults at startup inside fontconfig, before
          # any Positron code runs, and hangs until launch.sh times out. Each
          # attempt gets a fresh profile and ports, so a retry is clean once the
          # hung instance is killed.
          # The explorer's brief gives these to the main build's launch too.
          APP_ARGS=(--folder-uri file:///tmp/exploratory-workspace --log debug --no-sandbox
            --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader
            --disable-gpu-compositing --password-store=basic)
          echo "APP_ARGS=${APP_ARGS[*]}" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            if LAUNCH_JSON=$(.claude/skills/drive-positron/scripts/launch.sh \
              --source-user-data-dir /tmp/positron-seed -- "${APP_ARGS[@]}"); then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Positron failed to launch after $attempt attempts"; exit 1
            fi
            echo "::warning::Positron launch attempt $attempt failed; retrying"
            # launch.sh leaves a failed instance running. Nothing else in this
            # container runs the app, so match it by binary path.
            pkill -KILL -f "$PWD/.build/electron/" || true
            sleep 2
          done
          echo "$LAUNCH_JSON"
          CDP_PORT=$(echo "$LAUNCH_JSON" | jq -r .cdpPort)
          test -n "$CDP_PORT" && test "$CDP_PORT" != "null" || {
            echo "cdpPort missing from launch.sh output"; exit 1;
          }
          echo "CDP_PORT=$CDP_PORT" >> "$GITHUB_ENV"

      # Loaded after the launch, so the app starts signed in to Anthropic only
      # and the explorer signs in to anything else itself. The same items the
      # e2e lane uses; the redact step below lists every one of them.
      - name: Load test credentials
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_KEY: "op://Positron/OpenAI/credential"
          MS_FOUNDRY_KEY: "op://Positron/MS-Foundry-East2TestAI/credential"
          MS_FOUNDRY_BASE_URL: "op://Positron/MS-Foundry-East2TestAI/hostname"
          SNOWFLAKE_API_KEY: "op://Positron/Snowflake-API-key/credential"

      - name: Export database credentials
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DATABRICKS_WORKSPACE: ${{ secrets.DATABRICKS_WORKSPACE }}
          DATABRICKS_PAT: ${{ secrets.DATABRICKS_PAT }}
        run: |
          set -euo pipefail
          for NAME in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PASSWORD DATABRICKS_WORKSPACE DATABRICKS_PAT; do
            echo "$NAME=${!NAME}" >> "$GITHUB_ENV"
          done

      - name: Attach Playwright
        shell: bash
        run: |
          set -euo pipefail
          npx @playwright/cli -s=positron attach --cdp=http://127.0.0.1:"$CDP_PORT"
          npx @playwright/cli -s=positron resize 1600 1100
          TITLE=$(npx @playwright/cli -s=positron eval '(() => document.title)()')
          echo "document.title = $TITLE"
          test -n "$TITLE" || { echo "document.title is empty"; exit 1; }
          npx @playwright/cli -s=positron screenshot --filename="$EXPLORE_DIR/attach-proof.png"
          test -s "$EXPLORE_DIR/attach-proof.png" || { echo "screenshot empty"; exit 1; }

      - name: Explore
        id: explore
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          anthropic-api-key: ${{ env.ANTHROPIC_KEY }}
          explorer-path: ${{ github.workspace }}/.harness/.claude/skills/exploratory-test/explorer.md
          work-dir: ${{ env.EXPLORE_DIR }}
          cdp-port: ${{ env.CDP_PORT }}
          branch: ${{ needs.resolve.outputs.ref }}
          base-sha: ${{ steps.base.outputs.base }}
          base-ref: ${{ steps.base.outputs.ref }}
          head-sha: ${{ steps.base.outputs.head }}
          report-base-url: ${{ env.REPORT_BASE_URL }}
          model: ${{ matrix.model }}
          focus: ${{ needs.resolve.outputs.focus }}
          time-limit: ${{ needs.resolve.outputs.time_limit }}
          # The PR link in the summary and the report header. No PR, no link.
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          known-issues: ${{ steps.known.outputs.file }}

      # The app and the agent both hold these, and everything below is
      # published: the run directory to a public CDN, the rest as an artifact.
      # The names come from scan-shots.mjs, as a local publish's do: every
      # variable ending in KEY, TOKEN, SECRET, PASSWORD or PAT, and the ones it
      # lists by name. A credential added to this job later needs either a name
      # like that or a line in its OTHER_NAMES. The Postgres login is a fixed
      # test value, and redacting "exploratory-test" would mangle the report.
      - name: Redact secrets from run output
        if: always()
        shell: bash
        run: |
          # The uploads run even if this step fails, so a file that cannot be
          # redacted is removed rather than left in place.
          env -u E2E_POSTGRES_PASSWORD bash .harness/.claude/skills/exploratory-test/renderer/redact.sh --remove \
            /tmp/exploratory-run /tmp/positron-dev-launch /tmp/exploratory-workspace

      # The explorer blurs a key before it takes a screenshot. This reads each
      # one, paints over any secret still showing, and removes a shot it cannot
      # clean, as a text file that cannot be redacted is. The Postgres login
      # is a fixed test value the connection form shows on purpose, so it is
      # left out. A scan that cannot run removes every screenshot rather than
      # publish ones nobody checked.
      - name: Paint secrets out of screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RENDERER=.harness/.claude/skills/exploratory-test/renderer
          # Explore installs these; a job that failed before it did has not.
          [ -d "$RENDERER/node_modules/tesseract.js" ] || npm --prefix "$RENDERER" ci --no-audit --no-fund
          for DIR in /tmp/exploratory-run /tmp/exploratory-workspace; do
            [ -d "$DIR" ] || continue
            if ! env -u E2E_POSTGRES_PASSWORD node "$RENDERER/scan-shots.mjs" "$DIR" --remove; then
              echo "::warning::The screenshot scan did not run on $DIR; removing every screenshot in it."
              find "$DIR" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -delete
            fi
          done

      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exploratory-run-${{ matrix.model }}
          # The workspace as the run left it, a fallback for a test file the
          # agent did not save to files/. Artifact only, not the published page.
          # Hidden entries (.venv, .git) are already left out by default.
          # The run's tmp/ is scratch (a venv or build can run to gigabytes) and
          # never part of the report.
          path: |
            /tmp/exploratory-run
            !/tmp/exploratory-run/tmp
            /tmp/positron-dev-launch/*/code.log
            /tmp/positron-dev-launch/instances.log
            /tmp/exploratory-workspace
            !/tmp/exploratory-workspace/**/node_modules/**
            !/tmp/exploratory-workspace/**/__pycache__/**
            !/tmp/exploratory-workspace/**/renv/library/**
          if-no-files-found: warn
          retention-days: 3

  # Uploads each model's run directory to the public CDN. A job of its own so
  # the AWS role, and the id-token that assumes it, never share a runner with
  # the PR's code or the agent. It reads only the artifact explore left, which
  # was redacted before upload.
  publish:
    name: publish (${{ matrix.model }})
    needs: [resolve, explore]
    if: always() && needs.explore.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      report_base_url: ${{ steps.s3-upload.outcome == 'success' && steps.url.outputs.report_base_url || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors explore's matrix; keep the two in step.
        model: ${{ needs.resolve.outputs.model == 'both' && fromJSON('["opus","sonnet"]')
          || needs.resolve.outputs.model == 'sonnet' && fromJSON('["sonnet"]')
          || fromJSON('["opus"]') }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download run directory
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: exploratory-run-${{ matrix.model }}
          path: /tmp/run-artifact

      # The same inputs as explore's, so the same directory the report and
      # step summary already link to.
      - name: Allocate report dir
        uses: ./.harness/.github/actions/gen-report-dir
        with:
          prefix: exploratory-report
          identifier: ${{ matrix.model }}
          arch: x64
          skip-summary: "true"

      - name: Record report URL
        id: url
        shell: bash
        run: echo "report_base_url=${REPORT_URL%/index.html}" >> "$GITHUB_OUTPUT"

      # The artifact nests the run dir when code.log or the workspace was
      # uploaded too, and puts it at the root when neither was.
      - name: Stage publishable run directory
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/run-artifact
          [ -d "$SRC/exploratory-run" ] && SRC="$SRC/exploratory-run"
          rm -rf /tmp/exploratory-publish
          mkdir -p /tmp/exploratory-publish
          cp -a "$SRC/." /tmp/exploratory-publish/
          rm -f /tmp/exploratory-publish/actions.log /tmp/exploratory-publish/instances.jsonl
          # The raw log tree stays in the artifact: the page lists it unlinked,
          # and the curated files beside it are what a reader opens.
          rm -rf /tmp/exploratory-publish/logs/all
          # Scratch, never part of the report; older artifacts still carry it.
          rm -rf /tmp/exploratory-publish/tmp

      - name: Upload run directory to S3
        id: s3-upload
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: ./.harness/.github/actions/upload-report-to-s3
        with:
          role-to-assume: ${{ secrets.AWS_TEST_REPORTS_ROLE }}
          report-dir: ${{ env.REPORT_DIR }}
          source-dir: /tmp/exploratory-publish

      - name: Warn if S3 upload failed
        if: always() && steps.s3-upload.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "**WARNING: the S3 upload failed. Screenshot links in the report above will 404. The full run directory is still in the workflow artifact.**" >> "$GITHUB_STEP_SUMMARY"

  # Replaces this run's "running" comment with the result and swaps the reaction. A separate job
  # for the same reason as announce. always(): a failed build must still replace
  # "running" with the truth.
  # A /explore's result, or an auto-run's once ack-auto has said it is running.
  report:
    name: report
    needs: [resolve, worthiness, announce, ack-auto, explore, publish]
    if: >-
      ${{ always() && needs.resolve.outputs.ok == 'true' &&
      (github.event_name == 'issue_comment' || (inputs.auto_run_pr != '' && needs.ack-auto.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      # actions: read lets the comment name the step a failed run broke at.
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .harness
          sparse-checkout: |
            .github/actions
            .claude/skills/exploratory-test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download run directory
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: exploratory-run-${{ needs.resolve.outputs.model == 'sonnet' && 'sonnet' || 'opus' }}
          path: /tmp/run-artifact

      # The artifact root is the common parent of what matched, so the run dir
      # is nested when code.log or the workspace was uploaded too and at the
      # root when neither was.
      - name: Locate run directory
        run: |
          if [ -d /tmp/run-artifact/exploratory-run ]; then
            echo "WORK_DIR=/tmp/run-artifact/exploratory-run" >> "$GITHUB_ENV"
          else
            echo "WORK_DIR=/tmp/run-artifact" >> "$GITHUB_ENV"
          fi

      # Links only when the upload succeeded, so the comment never points at a
      # CDN page that 404s; the run link still reaches the artifact.
      - name: Post result comment
        continue-on-error: true
        uses: ./.harness/.github/actions/pr-exploratory-test
        with:
          mode: comment
          comment-state: result
          focus: ${{ needs.resolve.outputs.focus }}
          auto-run: ${{ inputs.auto_run_pr != '' }}
          # Empty when announce could not post; comment mode then posts a new one.
          comment-id: ${{ needs.announce.outputs.comment_id || needs.ack-auto.outputs.comment_id }}
          # A declined run never reaches explore, and an outdated branch stops
          # before the build; say which rather than "failed".
          outcome: ${{ needs.worthiness.outputs.testable == 'false' && 'declined' || needs.explore.result == 'cancelled' && 'cancelled' || needs.explore.outputs.outdated != '' && 'outdated' || needs.explore.outputs.outcome }}
          decline-reason: ${{ needs.worthiness.outputs.reason || needs.explore.outputs.outdated }}
          work-dir: ${{ env.WORK_DIR }}
          report-base-url: ${{ needs.publish.outputs.report_base_url }}
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          github-token: ${{ github.token }}
          head-sha: ${{ needs.resolve.outputs.sha }}

      # rocket only when the agent finished on its own, +1 when the gate
      # declined. A partial run (turn cap) and a hard failure both get confused.
      - name: Finalize reaction
        if: needs.announce.outputs.reaction_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ needs.announce.outputs.reaction_id }}
          OUTCOME: ${{ needs.worthiness.outputs.testable == 'false' && 'declined' || needs.explore.result == 'cancelled' && 'cancelled' || needs.explore.outputs.outdated != '' && 'outdated' || needs.explore.outputs.outcome }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}" \
            || echo "Failed to remove eyes reaction (non-fatal)"
          case "$OUTCOME" in
            complete) FINAL=rocket ;;
            declined) FINAL=+1 ;;
            *) FINAL=confused ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="$FINAL" || echo "Failed to add ${FINAL} reaction (non-fatal)"
