name: Update PWB Code Server Version on rstudio-pro

on:
  repository_dispatch:
    types: [trigger-pwb-code-server-update]

jobs:
  update-rstudio-pro:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      install_file: dependencies/common/install-code-server
      news_file: .github/NEWS.md
      default_reviewers: melissa-barca,cm421

    steps:
      - name: Check out vscode-server
        uses: actions/checkout@v4

      - name: Set version and branch
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV
          echo "CODE_OSS_VERSION=${{ github.event.client_payload.code_oss_version }}" >> $GITHUB_ENV
          echo "BRANCH=${{ github.event.client_payload.branch }}" >> $GITHUB_ENV
          echo "TOKEN=${{ github.event.client_payload.github_pat }}" >> $GITHUB_ENV

      - name: Fetch reviewers from merged PR
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Author + reviewers of the most recently merged PR into the branch, minus bots and teams
          candidates=$(gh pr list --repo "${{ github.repository }}" \
            --state merged --base "$BRANCH" --limit 10 \
            --json author,reviews,reviewRequests,mergedAt \
            --jq 'sort_by(.mergedAt) | last // empty
                  | [.author] + [.reviews[].author] + .reviewRequests
                  | map(select(.is_bot != true) | .login | strings)
                  | unique | .[]')

          # Filter out developers without write access to rstudio-pro.
          reviewers=$(for user in ${default_reviewers//,/ } $candidates; do
            GH_TOKEN="$TOKEN" gh api "repos/rstudio/rstudio-pro/collaborators/$user" --silent 2>/dev/null \
              && echo "$user"
          done | sort -u | paste -sd, -)

          # Safety net in case the collaborator checks fail (e.g. API outage)
          echo "reviewers=${reviewers:-$default_reviewers}" >> "$GITHUB_OUTPUT"
          echo "Requesting reviewers: ${reviewers:-$default_reviewers}"

      - name: Clone rstudio/rstudio-pro
        run: |
          git clone --depth=1 https://x-access-token:$TOKEN@github.com/rstudio/rstudio-pro.git
          cd rstudio-pro
          git checkout ${{ env.BRANCH }}

      - name: Update PWB Code Server version
        run: |
          cd rstudio-pro

          sed -i.bak "s/^VSCODE_VERSION=.*/VSCODE_VERSION=${VERSION}/" "$install_file"

          rm $install_file.bak

      - name: Update release notes
        run: |
          ./.github/scripts/update-news.sh \
            "rstudio-pro/${news_file}" \
            "${VERSION}" \
            "${CODE_OSS_VERSION}"

      - name: Git management
        run: |
          cd rstudio-pro
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ env.TOKEN }}
          commit-message: "Update PWB Code Server version to ${{ env.VERSION }}"
          title: "Automation PR: Update PWB Code Server version to ${{ env.VERSION }} on branch ${{ env.BRANCH }}"
          body: |
            This PR was automatically generated from https://github.com/rstudio/vscode-server branch `${{ env.BRANCH }}`.
            Updated PWB Code Server version to `${{ env.VERSION }}` in `${{ env.install_file }}`, and recorded the PWB Code Server (`${{ env.VERSION }}`) and Code OSS (`${{ env.CODE_OSS_VERSION }}`) versions in `${{ env.news_file }}`.

            @:vscode
          branch: update-pwb-code-server-${{ env.VERSION }}
          reviewers: ${{ steps.pr_info.outputs.reviewers }}
          path: rstudio-pro
