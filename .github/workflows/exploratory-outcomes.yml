name: "Exploratory: Outcome Pages"

# Rebuilds the Shipping impact page, what happened to /explore's findings, and deploys it to
# the Posit Connect content whose GUID is in the EXPLORE_OUTCOMES_CONNECT_GUID
# repo variable. Findings already fixed are carried over from the last
# publish, so only the rest cost model calls. See "What happened to a run's findings" in the exploratory-test
# skill's CONTRIBUTING.md.
# The triage job rebuilds the Triage outcomes page, where each filed issue
# stands today, into EXPLORE_TRIAGE_CONNECT_GUID. It makes no model calls. It
# runs after publish, even a failed one, to read the rows it published.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The checks diff PR commits against main, so they need its history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix .claude/skills/exploratory-test/renderer
          npm ci --no-audit --no-fund --prefix .github/actions/pr-exploratory-test

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: "op://Positron/Anthropic/credential"

      # connect.posit.it, which this job reads from and publishes to, is
      # reachable only from the tailnet.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}
          tags: tag:positron-gha

      - name: Fetch the last published rows
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: node outcomes-publish.mjs previous > "$RUNNER_TEMP/previous.jsonl"

      - name: Decide outcomes
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node outcomes.mjs --api --model claude-opus-5-5 --previous "$RUNNER_TEMP/previous.jsonl" --out "$RUNNER_TEMP/rows.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish the page
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: |
          node outcomes-page.mjs "$RUNNER_TEMP/rows.jsonl" > "$RUNNER_TEMP/index.html"
          node outcomes-publish.mjs deploy "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/rows.jsonl"

  triage:
    name: triage
    needs: publish
    if: ${{ !cancelled() && vars.EXPLORE_TRIAGE_CONNECT_GUID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix .claude/skills/exploratory-test/renderer
          npm ci --no-audit --no-fund --prefix .github/actions/pr-exploratory-test

      # connect.posit.it, which this job reads from and publishes to, is
      # reachable only from the tailnet.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}
          tags: tag:positron-gha

      # For the issues filed by hand that the Shipping impact rows matched to a finding.
      - name: Fetch the Shipping impact rows
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: |
          node outcomes-publish.mjs previous > "$RUNNER_TEMP/outcomes.jsonl" || {
            echo "::warning::Couldn't fetch the Shipping impact rows, so matched issues are left out"
            : > "$RUNNER_TEMP/outcomes.jsonl"
          }

      - name: Read where the issues stand
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/triage"
          node triage.mjs --outcomes "$RUNNER_TEMP/outcomes.jsonl" --out "$RUNNER_TEMP/triage/triage.json"

      - name: Build and publish the page
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_TRIAGE_CONNECT_GUID }}
        run: |
          node triage-page.mjs "$RUNNER_TEMP/triage/triage.json" > "$RUNNER_TEMP/triage/index.html"
          node outcomes-publish.mjs deploy "$RUNNER_TEMP/triage/index.html" "$RUNNER_TEMP/triage/triage.json"
