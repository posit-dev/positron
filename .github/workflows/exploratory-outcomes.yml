
name: "Exploratory: Outcome Pages"

# Rebuilds the PR outcomes page, what happened to /explore's findings, and deploys it to
# the Posit Connect content whose GUID is in the EXPLORE_OUTCOMES_CONNECT_GUID
# repo variable.
#
# Findings already fixed are carried over from the last publish, so only the rest
# cost model calls.
#
# The triage job rebuilds the Triage outcomes page into EXPLORE_TRIAGE_CONNECT_GUID.
# It makes no model calls and runs after publish, even a failed one.

on:
  schedule:
    # 6am Central and 4pm Eastern during daylight time.
    - cron: "0 11,20 * * *"

  workflow_dispatch:
    inputs:
      recheck:
        description: "Check every finding again, ignoring the outcomes already published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix .claude/skills/exploratory-test/renderer
          npm ci --no-audit --no-fund --prefix .github/actions/pr-exploratory-test

      # Verify that the 1Password authentication token exists.
      - name: Verify 1Password token is configured
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is missing. Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      # Load Anthropic API key from 1Password.
      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: "op://Positron/Anthropic/credential"

      # connect.posit.it is reachable only from the tailnet.
      - name: Join tailnet
        uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}
          required: 'true'

      - name: Fetch the last published rows
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: node outcomes-publish.mjs previous > "$RUNNER_TEMP/previous.jsonl"

      - name: Decide outcomes
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
          RECHECK: ${{ inputs.recheck }}
        run: |
          if [ "$RECHECK" = true ]; then set -- --recheck; fi
          node outcomes.mjs --api --model claude-opus-5-5 --previous "$RUNNER_TEMP/previous.jsonl" "$@" --out "$RUNNER_TEMP/rows.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish the page
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: |
          node outcomes-page.mjs "$RUNNER_TEMP/rows.jsonl" > "$RUNNER_TEMP/index.html"
          node outcomes-publish.mjs deploy "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/rows.jsonl"

  triage:
    name: triage
    needs: publish
    if: ${{ !cancelled() && vars.EXPLORE_TRIAGE_CONNECT_GUID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix .claude/skills/exploratory-test/renderer
          npm ci --no-audit --no-fund --prefix .github/actions/pr-exploratory-test

      # Best-effort tailnet connection.
      - name: Join tailnet
        uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}

      - name: Fetch the PR outcomes rows
        working-directory: .github/actions/pr-exploratory-test
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_CONTENT_GUID: ${{ vars.EXPLORE_OUTCOMES_CONNECT_GUID }}
        run: |
          node outcomes-publish.mjs previous > "$RUNNER_TEMP/outcomes.jsonl" || {
            echo "::warning::Couldn't fetch the PR outcomes rows, so matched issues are left out"
            : > "$RUNNER_TEMP/outcomes.jsonl"
          }

      - name: Read where the issues stand
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/triage"
          node triage.mjs --outcomes "$RUNNER_TEMP/outcomes.jsonl" --out "$RUNNER_TEMP/triage/triage.json"
