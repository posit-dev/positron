name: "Test: SQL Analyzer"

# The SQL analyzer is a Rust crate compiled to WebAssembly, and what ships is the committed
# module at extensions/positron-sql/resources/sql-analyzer.wasm. Two things therefore need
# checking, and neither is covered by the Node test suites:
#
#   - the crate's own tests (`cargo test`), which are where the parsing behaviour is pinned, along
#     with `cargo fmt` and `cargo clippy`.
#   - that the committed module was rebuilt when the crate changed (`--check`), since that is done
#     by hand. It compares a fingerprint of the crate's inputs and the module rather than
#     rebuilding and comparing bytes: the bytes differ between hosts, so a module built on macOS
#     could never match one built here. It also checks the module went in through Git LFS. The
#     checkout fetches no LFS objects, so the module's hash is read off its pointer, which names
#     it by that same hash. See scripts/build-analyzer.mts.
#
# Path-filtered and toolchain-only: this needs no npm install, because build-analyzer.mts uses
# only Node builtins. Keeping it out of Test: Unit means PRs that do not touch the crate do not
# pay for a Rust toolchain.

on:
  pull_request:
    paths:
      - 'extensions/positron-sql/sql-analyzer/**'
      - 'extensions/positron-sql/resources/sql-analyzer.wasm'
      - 'extensions/positron-sql/scripts/build-analyzer.mts'
      - 'extensions/positron-sql/scripts/lfs.mts'
      - '.github/workflows/test-sql-analyzer.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/positron-sql/sql-analyzer/**'
      - 'extensions/positron-sql/resources/sql-analyzer.wasm'
      - 'extensions/positron-sql/scripts/build-analyzer.mts'
      - 'extensions/positron-sql/scripts/lfs.mts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-sql-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: Test and verify the SQL analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/positron-sql
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Installs the toolchain pinned in sql-analyzer/rust-toolchain.toml, target included. It
      # has to be that one rather than whatever stable is: a different rustc builds a different
      # module, and the check below compares bytes.
      - name: Setup Rust
        working-directory: extensions/positron-sql/sql-analyzer
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/positron-sql/sql-analyzer/target
          key: sql-analyzer-${{ runner.os }}-${{ hashFiles('extensions/positron-sql/sql-analyzer/Cargo.lock') }}
          restore-keys: sql-analyzer-${{ runner.os }}-

      - name: Check the crate's formatting and lints
        working-directory: extensions/positron-sql/sql-analyzer
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run the crate's tests
        run: npm run test-analyzer

      # Recomputes sql-analyzer/wasm-fingerprint.txt without building. Fails with the command to
      # run when the crate changed without a rebuild, or the module changed without the crate.
      - name: Check the committed module matches the crate
        run: npm run check-analyzer
