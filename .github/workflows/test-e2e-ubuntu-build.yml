name: "E2E: Build Postiron (Ubuntu)"

on:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA to test"
        required: false
        default: ""
        type: string
      skip_cache:
        description: "Skip restoring caches (use when testing a specific commit)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build:
    name: build-ubuntu
    timeout-minutes: 35
    runs-on: ubuntu-latest-amd64-8-core
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.22.1-py3.14.7-r4.6.1
      options: --user 0:0 --init
      # Static PAT is needed because the bot can't pass a token to the job for security reasons
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
    services:
      postgres:
        image: ghcr.io/posit-dev/positron-postgres:24.22.1-py3.14.7-r4.6.1
        credentials:
          username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
          password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-postgres-test
          POSTGRES_DB: postgres
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_CONFIG: /tmp/.docker # Ensure Docker client doesn't try to read a root-owned config file in the container
      POSITRON_BUILD_NUMBER: 0 # CI skips building releases
      _R_CHECK_FUTURE_FILE_TIMESTAMPS_: false # this check can be flaky in the R pkg tests
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_SYSTEM_CLOCK_: false
      AWS_S3_BUCKET: positron-test-reports
      E2E_POSTGRES_USER: e2e
      E2E_POSTGRES_PASSWORD: e2e-postgres-test
      R_LIBS_SITE: /usr/local/lib/R/site-library
      R_LIBS_USER: /usr/local/lib/R/site-library
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      # reticulate 1.47 cannot run on Python 3.14 (rstudio/reticulate#1930); bind the 3.13
      RETICULATE_PYTHON: /root/.pyenv/versions/3.13.0/bin/python
      HOME: /root

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout specific commit
        if: ${{ inputs.commit != '' }}
        run: git checkout ${{ inputs.commit }}

      - name: Ensure Docker config dir is writable
        run: |
          mkdir -p /tmp/.docker
          chmod 700 /tmp/.docker

      - name: Setup build environment
        id: setup-build
        uses: ./.github/actions/setup-build-env
        with:
          distro: ubuntu
          skip-cache: ${{ inputs.skip_cache }}
          install-playwright: 'true'
          github-token: ${{ github.token }}

      - name: Move Positron License
        run: |
          mv /positron-license /__w/positron || true
          printf "%s" "${{ secrets.POSITRON_DEV_LICENSE }}" > /__w/positron/positron-license/pdol/target/debug/pdol_rsa || true

      - name: Create Build Artifact
        run: |
          # The e2e test content lives in-repo at test/e2e/test-files and is included
          # in the tarball below, so downstream runners get it without network access.

          # Create a tarball of the entire positron workspace. Exclude .git to avoid including repository history.
          mkdir -p /tmp/artifacts
          if ! command -v zstd >/dev/null; then
            DEBIAN_FRONTEND=noninteractive apt-get update -y || true
            DEBIAN_FRONTEND=noninteractive apt-get install -y zstd || true
          fi
          command -v zstd >/dev/null || { echo "zstd is required to build the artifact"; exit 1; }

          # Every e2e shard downloads this archive, so size matters more than compression time.
          # --long finds repeats across the many duplicate packages in node_modules trees.
          # Window 2^27 is the default decoder limit, so `zstd -d` needs no extra flag.
          start=$(date +%s)
          # Place options (exclude) before the filenames so tar respects them.
          # tar exit 1 means a file changed while being read (tolerated); 2+ is a real failure.
          tar -C /__w \
            --exclude='positron/.git' \
            --exclude='positron/.npm-cache' \
            --exclude='positron/.pip-cache' \
            --use-compress-program='zstd -T0 -3 --long=27' \
            -cf /tmp/artifacts/positron-build.tar.zst positron || { rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; }
          echo "Compressed in $(( $(date +%s) - start ))s to $(du -h /tmp/artifacts/positron-build.tar.zst | cut -f1)"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          # Unzipped, so the e2e shards can fetch it in parallel byte ranges.
          # The artifact is named after the file: positron-build.tar.zst.
          path: /tmp/artifacts/positron-build.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1
