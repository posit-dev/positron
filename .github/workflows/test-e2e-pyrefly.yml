name: "Test: E2E Pyrefly (Ubuntu)"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA to test"
        required: false
        default: ""
        type: string
      skip_cache:
        description: "Skip restoring caches (use when testing a specific commit)"
        required: false
        default: false
        type: boolean
      enable_diagnostic_logging:
        required: false
        description: "Enable diagnostic logging (free memory, process list, CPU usage) at the end of each test."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  e2e-linux:
    name: 'e2e-pyrefly-ubuntu'
    timeout-minutes: 60
    runs-on: ubuntu-latest-amd64-8-core
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.18.0-py3.14.7-r4.6.1
      # --device/--cap-add give the container a TUN device so the Tailscale step can bring up
      # kernel-mode networking (transparent routing to the tailnet, needed to reach Connect).
      options: --user 0:0 --init --device /dev/net/tun --cap-add=NET_ADMIN
      # Static PAT is needed because the bot can't pass a token to the job for security reasons
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0 # CI skips building releases
      HOME: /root
      _R_CHECK_FUTURE_FILE_TIMESTAMPS_: false # this check can be flaky in the R pkg tests
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_SYSTEM_CLOCK_: false
      AWS_S3_BUCKET: positron-test-reports
      R_LIBS_SITE: /usr/local/lib/R/site-library
      R_LIBS_USER: /usr/local/lib/R/site-library

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout specific commit
        if: ${{ inputs.commit != '' }}
        run: git checkout ${{ inputs.commit }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          distro: ubuntu
          install-playwright: 'true'
          github-token: ${{ github.token }}
          skip-cache: ${{ inputs.skip_cache }}

      - name: Setup E2E Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          aws-role-to-assume: ${{ secrets.QA_AWS_RO_ROLE }}
          aws-region: ${{ secrets.QA_AWS_REGION }}

      - name: Alter AppArmor Restrictions for Playwright
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Send Results to GH Summary
        uses: ./.github/actions/gen-report-dir
        with:
          identifier: e2e-electron-pyrefly

      # The e2e-test-insights reporter publishes results to connect.posit.it, which is
      # reachable only from the tailnet.
      - name: Join tailnet
        uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}

      - name: 🧪 Run Playwright Tests - Electron
        shell: bash
        env:
          POSITRON_PY_VER_SEL: "3.14.7"
          POSITRON_R_VER_SEL: 4.6.1
          POSITRON_PY_ALT_VER_SEL: "3.13.0"
          POSITRON_R_ALT_VER_SEL: 4.4.2
          POSITRON_HIDDEN_PY: "3.12.10 (Conda)"
          POSITRON_HIDDEN_R: 4.4.1
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          PWTEST_BLOB_DO_NOT_REMOVE: 1
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          SHARD_NAME: electron-pyrefly
          USE_KEY: true
          GH_SUMMARY_REPORT: true
          ENABLE_DIAGNOSTIC_LOGGING: ${{ inputs.enable_diagnostic_logging }}
        run: |
          ALLOW_PYREFLY=true npx playwright test test/e2e/tests/lsp test/e2e/tests/quarto/quarto-outline.test.ts --project=e2e-electron --workers=1

      - name: Upload Playwright Report to S3
        if: ${{ success() || failure() }}
        continue-on-error: true
        uses: ./.github/actions/upload-report-to-s3
        with:
          role-to-assume: ${{ secrets.AWS_TEST_REPORTS_ROLE }}
          report-dir: ${{ env.REPORT_DIR }}
