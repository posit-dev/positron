name: "drive-positron: UI Drift"

# drive-positron (.claude/skills/drive-positron) is how an agent drives Positron
# for exploratory testing. Its helpers find the UI through the classes, test
# ids and accessible names in scripts/selectors.ts. This tells a PR that renames
# one of them which entry broke and which helpers read it, so the author can fix
# the entry in the same PR.
#
#   drift  test/drift.ts, no install, ~1 min (the full test/check.ts when the
#          skill changed). Runs nightly and on a manual run; on PRs touching
#          UI source it is off for now (the pull_request trigger is commented
#          out below).
#   smoke  nightly on main (and on a manual run): builds Positron the way
#          test-e2e-ubuntu.yml does and runs test/smoke.ts. Not per PR, because
#          no PR job shares its build and a build costs ~20 min.
#
# Both are warn-only (continue-on-error), so they never block a merge. To make
# one required, remove its continue-on-error and add it to branch protection.
#
# Plain `pull_request`: a fork PR gets no secrets and a read-only token.

on:
  # Drift on PRs is off for now; uncomment to turn it back on.
  # pull_request:
  #   types: [opened, synchronize, reopened]
  #   paths:
  #     # Positron's own UI, and the extensions whose command titles the helpers run.
  #     - "src/vs/workbench/contrib/positron*/**"
  #     - "src/vs/workbench/browser/positron*/**"
  #     - "src/vs/platform/positron*/**"
  #     - "extensions/positron-*/**"
  #     # Upstream UI the registry reads: lists, menus, dialogs, quick input,
  #     # editor parts, notifications, debug and notebook views, codicons.
  #     - "src/vs/base/browser/ui/**"
  #     - "src/vs/base/common/codicons*.ts"
  #     - "src/vs/platform/quickinput/**"
  #     - "src/vs/workbench/browser/parts/**"
  #     - "src/vs/workbench/services/views/**"
  #     - "src/vs/workbench/contrib/debug/browser/**"
  #     - "src/vs/workbench/contrib/notebook/browser/**"
  #     - ".claude/skills/drive-positron/**"
  #     - ".github/workflows/drive-positron.yml"
  schedule:
    - cron: "30 3 * * 1-5" # 03:30 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: drift
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The merge commit with its first parent, to tell whether the skill changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      # drift.ts reads only selectors.ts and the source tree: no install.
      - name: Check the registry against src/
        shell: bash
        run: |
          set -uo pipefail
          # The shell runs with -e: capture drift's exit code instead of stopping on it.
          code=0
          node .claude/skills/drive-positron/test/drift.ts > /tmp/drift.txt || code=$?
          cat /tmp/drift.txt
          {
            echo "### drive-positron: UI drift"
            if [ "$code" -eq 0 ]; then
              echo "No drift. $(tail -n 1 /tmp/drift.txt)"
            else
              echo "Heads up: this PR renames or removes some UI text or classes that the **drive-positron** skill uses to drive Positron during exploratory testing."
              echo
              echo "To keep drive-positron running smoothly, please update each entry below in \`.claude/skills/drive-positron/scripts/selectors.ts\` to what the UI now uses (usually a one-line change), then run \`node .claude/skills/drive-positron/test/check.ts\`. Thank you! More in \`.claude/skills/drive-positron/CONTRIBUTING.md\`."
              echo
              echo '```'
              awk '/^MISSING/ { on = 1 } /^(FOUND|SKIPPED|drift:)/ { on = 0 } on' /tmp/drift.txt
              tail -n 1 /tmp/drift.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          { grep '^MISSING' /tmp/drift.txt || true; } | while read -r _ key value; do
            echo "::warning file=.claude/skills/drive-positron/scripts/selectors.ts,title=drive-positron UI drift::drive-positron uses $value, which this PR no longer has. Please update $key in selectors.ts (see the job summary)."
          done
          exit "$code"

      - name: Did the skill change?
        id: skill
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- .claude/skills/drive-positron; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # check.ts uses the repo's typescript, eslint (and its config's plugins)
      # and playwright types: the root dependencies, without their install
      # scripts, which build the extensions.
      - name: Install root dependencies
        if: ${{ !cancelled() && steps.skill.outputs.changed == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run the skill's static checks
        if: ${{ !cancelled() && steps.skill.outputs.changed == 'true' }}
        run: node .claude/skills/drive-positron/test/check.ts

  smoke:
    name: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # The build is the one test-e2e-ubuntu.yml uses, in the same image.
    timeout-minutes: 75
    runs-on: ubuntu-latest-amd64-8-core
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.18.0
      options: --user 0:0 --init
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0
      HOME: /root
      R_LIBS_SITE: /usr/local/lib/R/site-library
      R_LIBS_USER: /usr/local/lib/R/site-library
      RETICULATE_PYTHON: /root/.venv/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Restore caches
        id: restore-caches
        uses: ./.github/actions/restore-build-caches

      - name: Install node dependencies
        if: steps.restore-caches.outputs.cache-npm-core-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true'
        uses: nick-fields/retry@v4
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          POSITRON_GITHUB_RO_PAT: ${{ github.token }}
          POSITRON_PARALLEL_INSTALL: '0'
          POSITRON_NPM_CONCURRENCY: '10'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NPM_CONFIG_DEVDIR: '.node-gyp-cache'
          DOCKER_CONFIG: /tmp/.docker
          POSITRON_EXTENSIONS_FILTER: ${{ (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true' && 'stable') || (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' && 'volatile') || '' }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 5
          shell: bash
          command: bash scripts/install-npm-parallel.sh

      - name: Download binaries (Ark, Kallichore)
        uses: ./.github/actions/download-binaries
        with:
          cache-hit: ${{ steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' ||
                         steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' }}

      - name: Compile Positron and Download Electron
        run: npm exec -- npm-run-all --max-old-space-size=8192 -p compile "electron x64"

      - name: Prelaunch
        run: npm run prelaunch

      # After Prelaunch, which can re-extract Electron and reset permissions.
      - name: Set permissions on SUID sandbox helper
        run: |
          ELECTRON_ROOT=.build/electron
          sudo chown root $ELECTRON_ROOT/chrome-sandbox
          sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox

      # launch.sh and the helpers parse JSON with jq; stop.sh finds the
      # instance with lsof. Neither is in the image.
      - name: Install jq and lsof
        run: sudo apt-get update && sudo apt-get install -y jq lsof

      # A from-source build bundles no Quarto CLI (see release-screenshots.yml).
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # smoke.ts links the fixture's .venv to positron-python's venv; in the
      # image the interpreter with the e2e packages is /root/.venv.
      - name: Point the fixture at the image's Python
        shell: bash
        run: |
          set -euo pipefail
          test -e extensions/positron-python/.venv || ln -s /root/.venv extensions/positron-python/.venv
          /root/.venv/bin/python -c "import matplotlib, ipykernel" \
            || /root/.venv/bin/python -m pip install matplotlib ipykernel
          /root/.venv/bin/python -c "import matplotlib.pyplot as plt; plt.figure()"

      - name: Setup Xvfb
        uses: ./.github/actions/setup-xvfb

      - name: Alter AppArmor restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The app flags after `--` are the ones test-exploratory.yml launches
      # with in this image: root needs --no-sandbox, and there is no GPU.
      # --keep leaves the instance and its run directory (the logs) for the
      # upload below; the container goes with the job.
      - name: Run the smoke test
        shell: bash
        run: |
          set -uo pipefail
          node .claude/skills/drive-positron/test/smoke.ts --keep -- \
            --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader \
            --enable-unsafe-swiftshader --disable-gpu-compositing \
            --password-store=basic 2>&1 | tee /tmp/smoke.txt
          code=${PIPESTATUS[0]}
          {
            echo "### drive-positron: smoke"
            echo '```'
            grep -E '^(FAIL|KNOWN)|^       ' /tmp/smoke.txt || true
            tail -n 1 /tmp/smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload the instance's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drive-positron-smoke-logs
          path: |
            /tmp/smoke.txt
            /tmp/positron-dev-launch/
          if-no-files-found: ignore
