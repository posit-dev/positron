name: "Test: Merge to branch"

on:
  push:
    branches:
      - main
      - "prerelease/**"
      - "release/**"

jobs:
  # Decides whether this push to main changes only docs or tooling (see
  # scripts/lib/pr-docs-only-lib.sh), checking against the workflows this file
  # calls. If so, the test jobs below are skipped, except unit-tests, which
  # keeps saving the Ubuntu caches PRs restore from. (e2e-windows saves the
  # Windows caches, so those can go stale over a run of docs-only pushes.)
  # Release and prerelease branches always run the tests.
  #
  # Fails open: the jobs below run even if this job fails or is skipped
  # (`!cancelled()`), and an empty output means "not docs-only".
  docs-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts
          filter: blob:none
      - name: Check for a docs-only change
        id: docs-only
        run: bash scripts/pr-docs-only.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CI_WORKFLOW: .github/workflows/test-merge.yml

  setup:
    name: setup
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-e2e-ubuntu-build.yml
    secrets: inherit

  e2e-electron:
    name: e2e
    needs: [setup]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    uses: ./.github/workflows/test-e2e-ubuntu-run.yml
    with:
      grep: ""
      project: "e2e-electron"
      display_name: "electron"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
      shards: 2
      matrix: '{"shard":[1,2]}'
      workers: 2
      max_failures: 10  # 20 max failures / 2 shards = 10
    secrets: inherit

  e2e-windows:
    name: e2e
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-e2e-windows-run.yml
    secrets: inherit
    with:
      save_cache: true
      grep: ""
      project: "e2e-windows"
      display_name: "electron-win"
      upload_logs: false
      shards: 3
      matrix: '{"shard":[1,2,3]}'
      max_failures: 7  # 20 max failures / 3 shards = 6.66, rounded up to 7

  e2e-ubuntu-chromium:
    name: e2e
    needs: [setup]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    uses: ./.github/workflows/test-e2e-ubuntu-run.yml
    with:
      grep: ""
      display_name: "chromium"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: true
      shards: 2
      matrix: '{"shard":[1,2]}'
      workers: 2
      max_failures: 10  # 20 max failures / 2 shards = 10
    secrets: inherit

  unit-tests:
    name: test
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit
    with:
      save_cache: true  # Saves Ubuntu caches for subsequent runs

  ext-host-tests:
    name: test
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-ext-host.yml
    secrets: inherit
    with:
      pull_request: false

  ext-host-tests-windows:
    name: test
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-ext-host-windows.yml
    secrets: inherit

  slack-notify:
    if: always()
    needs:
      [
        docs-only,
        setup,
        unit-tests,
        ext-host-tests,
        ext-host-tests-windows,
        e2e-electron,
        e2e-windows,
        e2e-ubuntu-chromium,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: always()
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/notify-e2e-insights

      - name: Notify E2E Test Insights
        if: always()
        uses: ./.github/actions/notify-e2e-insights
        with:
          webhook_secret: ${{ secrets.E2E_INSIGHTS_WEBHOOK_SECRET }}
          connect_api_key: ${{ secrets.CONNECT_API_KEY }}
          tailscale_oauth_client_id: ${{ secrets.POSITRON_TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.POSITRON_TAILSCALE_OAUTH_SECRET }}
          repo_id: "positron"
          # A docs-only push runs only unit-tests; leave out the skipped jobs.
          hide_skipped: ${{ needs.docs-only.outputs.docs_only == 'true' }}
          filter_jobs: "(e2e / ([^0-9]*)|vscode|vitest|ext-host(-win)?)$"

  analyze-e2e-failures:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [e2e-electron, e2e-windows, e2e-ubuntu-chromium]
    uses: ./.github/workflows/analyze-e2e-failures.yml
    with:
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
