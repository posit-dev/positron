name: "Test: E2E (Windows) — Sharded"

# Cache Save Strategy:
# This workflow has a save_cache parameter to prevent race conditions when multiple jobs
# try to save the same cache key simultaneously. Only ONE job per calling workflow should
# set save_cache: true, and only shard 1 actually saves. The uv, R, and Graphviz caches
# save from shard 1 on any non-PR run instead. PRs never save: a cache saved on a PR
# ref is readable only by that PR, so it just evicts main's caches from the 10 GB repo
# limit. Examples:
# - test-pull-request.yml: only restores (save_cache: false)
# - test-merge.yml: windows e2e saves (save_cache: true, shard 1 only)
# - test-full-suite.yml: saves uv/R/Graphviz only (save_cache omitted)

on:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA to test"
        required: false
        default: ""
        type: string
      skip_cache:
        required: false
        description: "Skip restoring caches (use when testing a specific commit)"
        type: boolean
        default: false
      save_cache:
        required: false
        description: "Whether to save caches after the run (only one job per workflow should save to avoid race conditions)"
        type: boolean
        default: false
      grep:
        required: false
        description: "Only run tests matching this regex. Supports tags (comma-separated), titles, filenames. Confirm pattern matching locally with: npx playwright test --grep=<regex>"
        default: "@:win"
        type: string
      project:
        required: false
        description: "The name of the Playwright project to run tests for."
        default: "e2e-windows"
        type: string
      workers:
        required: false
        description: "Number of parallel workers to use, defaults to 2."
        default: 2
        type: number
      shards:
        required: false
        description: "Total number of shards (for display purposes and shard argument)"
        default: 1
        type: number
      matrix:
        required: false
        description: "Pre-calculated matrix JSON from caller workflow"
        default: '{"shard":[1]}'
        type: string
      repeat_each:
        required: false
        description: "Run each test N times, defaults to one."
        default: 1
        type: number
      display_name:
        required: false
        description: "The name of the job as it will appear in the GitHub Actions UI."
        default: "electron-win"
        type: string
      upload_logs:
        required: false
        description: "Whether or not to upload e2e test logs."
        type: boolean
        default: true
      skip_extension_tests:
        required: false
        description: "Whether to skip the extensions tests."
        type: boolean
        default: false
      max_failures:
        required: false
        description: "Maximum number of test failures before aborting. Should be calculated as: base_max_failures / number_of_shards (e.g., 10 / 4 = 3 for 4 shards)."
        type: number
        default: 10
      enable_diagnostic_logging:
        required: false
        description: "Enable diagnostic logging (free memory, process list, CPU usage) at the end of each test."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  windows:
    name: ${{ inputs.display_name || 'electron-win' }}-${{ matrix.shard }}
    timeout-minutes: 150
    runs-on: windows-latest-8x
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0 # CI skips building releases
      AWS_S3_BUCKET: positron-test-reports
      DATABRICKS_WORKSPACE: ${{ secrets.DATABRICKS_WORKSPACE }}
      DATABRICKS_PAT: ${{ secrets.DATABRICKS_PAT }}
      # Account identifier for the posit-assistant Snowflake Cortex test, which signs in
      # with it and SNOWFLAKE_API_KEY (loaded from 1Password below). The
      # Linux lanes set this from the same secret for the data-connections suite.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      # Username/password sign-in for connections-snowflake.test.ts's Snowflake Connection
      # suite. Same secrets the Linux lanes export.
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      # Pinned because the graphviz plot tests compare against a master
      # screenshot (graphviz-win32) rendered with this version. Bump the
      # version, the hash, and the screenshot together. The hash is the one
      # Graphviz publishes next to the zip (append .sha256 to its URL).
      GRAPHVIZ_VERSION: '16.1.0'
      GRAPHVIZ_SHA256: '733e49626c492242eb8dca30ea627b6ead20710e207998c7933b4909d92d6abc'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout specific commit
        if: ${{ inputs.commit != '' }}
        run: git checkout ${{ inputs.commit }}

      - name: Load secret
        uses: 1password/load-secrets-action@v5
        with:
          # Export loaded secrets as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_KEY: "op://Positron/Anthropic/credential"
          OPENAI_KEY: "op://Positron/OpenAI/credential"
          MS_FOUNDRY_KEY: "op://Positron/MS-Foundry-East2TestAI/credential"
          MS_FOUNDRY_BASE_URL: "op://Positron/MS-Foundry-East2TestAI/hostname"
          POSIT_AUTH_HOST: "op://Positron/Posit-AI-Login/website"
          POSIT_EMAIL: "op://Positron/Posit-AI-Login/username"
          POSIT_PASSWORD: "op://Positron/Posit-AI-Login/password"
          REDSHIFT_TEST_HOST: "op://Positron/Redshift_Test_Environment/hostname"
          REDSHIFT_TEST_USERNAME: "op://Positron/Redshift_Test_Environment/username"
          REDSHIFT_TEST_PASSWORD: "op://Positron/Redshift_Test_Environment/password"
          TS_OAUTH_CLIENT_ID: "op://Positron/Tailscale_OAuth/client_id"
          TS_OAUTH_SECRET: "op://Positron/Tailscale_OAuth/client_secret"
          # Snowflake programmatic access token for the posit-assistant Snowflake Cortex
          # test. Pairs with the SNOWFLAKE_ACCOUNT env var set on the job above.
          SNOWFLAKE_API_KEY: "op://Positron/Snowflake-API-key/credential"

      # Bring up Tailscale so tests can reach private test infrastructure (e.g. the serverless
      # Redshift workgroup used by the data-connections e2e tests). OAuth creds are loaded from
      # 1Password in the previous step.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:positron-gha

      - name: Set screen resolution
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Transform to Playwright tags $PW_TAGS
        run: bash scripts/pr-tags-transform.sh "${{ inputs.project }}" "${{ inputs.grep }}"
        shell: bash

      - name: Install System Level Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup build environment
        id: build-env
        uses: ./.github/actions/setup-build-env-windows
        with:
          skip-cache: ${{ inputs.skip_cache }}

      - name: Compile Positron and Download Electron
        run: npm exec -- npm-run-all --max-old-space-size=8192 -p compile "electron x64"

      - name: Install Playwright browsers
        run: npm run playwright-install

      - name: Install E2E test dependencies
        run: npm --prefix test/e2e ci --no-audit --no-fund

      - name: Compile E2E Tests
        run: npm --prefix test/e2e run compile

      # Downloads Builtin Extensions (needed for integration & e2e testing)
      - shell: bash
        run: npm run prelaunch

      - name: 💾 Save caches
        if: ${{ inputs.save_cache && matrix.shard == 1 }}
        uses: ./.github/actions/save-build-caches
        with:
          cache-npm-core-hit: ${{ steps.build-env.outputs.cache-npm-core-hit }}
          cache-npm-extensions-volatile-hit: ${{ steps.build-env.outputs.cache-npm-extensions-volatile-hit }}
          cache-npm-extensions-stable-hit: ${{ steps.build-env.outputs.cache-npm-extensions-stable-hit }}
          cache-builtins-hit: ${{ steps.build-env.outputs.cache-builtins-hit }}
          cache-playwright-hit: ${{ steps.build-env.outputs.cache-playwright-hit }}
          extensions-volatile-hash: ${{ steps.build-env.outputs.extensions-volatile-hash }}
          extensions-stable-hash: ${{ steps.build-env.outputs.extensions-stable-hash }}
          package-locks-hash: ${{ steps.build-env.outputs.package-locks-hash }}
          node-version: ${{ steps.build-env.outputs.node-version }}
          playwright-version: ${{ steps.build-env.outputs.playwright-version }}

      - name: Stage Python requirements file
        id: download-python-reqs
        run: |
          Copy-Item test/e2e/test-files/requirements.txt requirements.txt
          $hash = (Get-FileHash requirements.txt -Algorithm SHA256).Hash
          echo "requirements-hash=$hash" >> $env:GITHUB_OUTPUT
          echo "Python requirements hash: $hash"

      - name: Restore Python packages cache
        id: cache-python
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\uv-cache
          key: ${{ runner.os }}-uv-${{ steps.download-python-reqs.outputs.requirements-hash }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install python dependencies
        env:
          UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system trcli

      - name: Save Python packages cache
        if: ${{ github.event_name != 'pull_request' && matrix.shard == 1 && steps.cache-python.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\uv-cache
          key: ${{ runner.os }}-uv-${{ steps.download-python-reqs.outputs.requirements-hash }}

      # Alternate python version
      - name: Install Python 3.13.0
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.0"

      # Ensure Python 3.13.0 is used and only install ipykernel
      - name: Install ipykernel for Python 3.13.0
        env:
          UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
        run: |
          python --version  # Verify it's 3.13.0
          uv pip install --system ipykernel

      # rig, the R release, and the R packages. The R cache saves from shard 1
      # on a cache miss in any non-PR run (see the note at the top of this
      # file). test-ext-host-windows.yml restores the same cache.
      - name: Setup R
        id: setup-r
        uses: ./.github/actions/setup-r-windows
        with:
          save-cache: ${{ github.event_name != 'pull_request' && matrix.shard == 1 }}

      # The alternate R version (oldrel-2), resolved the same way as the
      # release. Added after the default's packages are installed so
      # `rig default` stays on the release version during the package install.
      - name: Install alternate R (oldrel-2)
        id: r-alt-version
        shell: pwsh
        run: |
          $oldrel2 = (Invoke-RestMethod -Uri 'https://api.r-hub.io/rversions/r-oldrel/2' -MaximumRetryCount 3 -RetryIntervalSec 5).version
          Write-Host "Resolved R oldrel-2=$oldrel2"
          "r_alt_version=$oldrel2" >> $env:GITHUB_OUTPUT
          rig add $oldrel2
          rig ls

      - name: Restore Graphviz cache
        id: cache-graphviz
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\graphviz
          key: graphviz-win64-${{ env.GRAPHVIZ_VERSION }}

      # Graphviz comes from the cache, else the official zip on the Graphviz
      # GitLab package registry, else Chocolatey. The Chocolatey community feed
      # alone was not reliable enough: it has returned 503/504 for every retry
      # in a run, and `choco install` exits 0 when that happens ("Chocolatey
      # installed 0/0 packages"), so the step went green and the graphviz plot
      # tests failed half an hour later as a confusing screenshot diff. Both
      # sources install the same pinned version, and the step proves `dot`
      # runs before moving on.
      - name: Setup Graphviz
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            $ver = $env:GRAPHVIZ_VERSION
            $gvRoot = Join-Path $env:RUNNER_TEMP 'graphviz'
            $bin = Join-Path $gvRoot "Graphviz-$ver-win64\bin"

            if (-not (Test-Path (Join-Path $bin 'dot.exe'))) {
              try {
                $url = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$ver/windows_10_cmake_Release_Graphviz-$ver-win64.zip"
                $zip = Join-Path $env:RUNNER_TEMP "graphviz-$ver.zip"
                Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 2 -RetryIntervalSec 5
                $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
                if ($hash -ne $env:GRAPHVIZ_SHA256) {
                  throw "SHA256 mismatch: expected $env:GRAPHVIZ_SHA256, got $hash"
                }
                Expand-Archive $zip -DestinationPath $gvRoot -Force
              } catch {
                Write-Warning "Graphviz zip install failed, falling back to Chocolatey: $_"
                # Don't leave a partial extraction behind for the next attempt
                # (or the cache) to mistake for a good install.
                Remove-Item $gvRoot -Recurse -Force -ErrorAction SilentlyContinue
              }
            }

            if (-not (Test-Path (Join-Path $bin 'dot.exe'))) {
              choco install graphviz --version $ver -y --no-progress
              # The graphviz installer puts its bin dir on the machine PATH, which
              # the already-running runner process does not pick up. Re-read it so
              # `dot` resolves here.
              $env:PATH = "$([Environment]::GetEnvironmentVariable('Path', 'Machine'));$env:PATH"
              $dot = Get-Command dot -ErrorAction SilentlyContinue
              if (-not $dot) {
                throw 'Graphviz is not installed from the zip or Chocolatey (see the output above)'
              }
              $bin = Split-Path $dot.Source -Parent
            }

            # Use it here, then publish it for the later test steps.
            $env:PATH = "$bin;$env:PATH"
            if ((Get-Content $env:GITHUB_PATH -ErrorAction SilentlyContinue) -notcontains $bin) {
              Add-Content -Path $env:GITHUB_PATH -Value $bin
            }
            # Log the version, checking the exit code rather than the output: dot
            # writes its version banner to stderr, which 'Stop' would otherwise
            # treat as a failure.
            $ErrorActionPreference = 'Continue'
            dot -V
            if ($LASTEXITCODE -ne 0) {
              throw "dot -V failed with exit code $LASTEXITCODE"
            }

      # Fails (and is ignored) when the Chocolatey fallback left nothing to cache.
      - name: Save Graphviz cache
        if: ${{ github.event_name != 'pull_request' && matrix.shard == 1 && steps.cache-graphviz.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\graphviz
          key: graphviz-win64-${{ env.GRAPHVIZ_VERSION }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Setup AWS S3 Access
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.QA_AWS_RO_ROLE }}
          aws-region: ${{ secrets.QA_AWS_REGION }}
          # Session must outlast the full build + sharded test run so the Bedrock
          # sign-in e2e test doesn't hit an expired STS token (must be <= role
          # MaxSessionDuration).
          role-duration-seconds: 21600

      - name: Set Report URL
        uses: ./.github/actions/gen-report-dir
        with:
          identifier: ${{ inputs.project }}
          skip-summary: true

      - name: 🧪 Run Bootstrap Extensions Test
        if: ${{ inputs.skip_extension_tests != true }}
        id: bootstrap
        shell: bash
        env:
          POSITRON_PY_VER_SEL: 3.10.10
          POSITRON_R_VER_SEL: ${{ steps.setup-r.outputs.r-version }}
          POSITRON_PY_ALT_VER_SEL: 3.13.0
          POSITRON_R_ALT_VER_SEL: ${{ steps.r-alt-version.outputs.r_alt_version }}
          PWTEST_BLOB_DO_NOT_REMOVE: 1
        run: npx playwright test test/e2e/tests/extensions/bootstrap-extensions.test.ts --project "${{ inputs.project }}" --reporter=null

      - name: 🧪 Run Playwright E2E Tests
        shell: bash
        env:
          POSITRON_PY_VER_SEL: 3.10.10
          POSITRON_R_VER_SEL: ${{ steps.setup-r.outputs.r-version }}
          POSITRON_PY_ALT_VER_SEL: 3.13.0
          POSITRON_R_ALT_VER_SEL: ${{ steps.r-alt-version.outputs.r_alt_version }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          PWTEST_BLOB_DO_NOT_REMOVE: 1
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          USE_KEY: true
          GH_SUMMARY_REPORT: false # prevent reporting individual shard results to github summary
          ENABLE_DIAGNOSTIC_LOGGING: ${{ inputs.enable_diagnostic_logging }}
        run: |
          # Build the --grep argument only if PW_TAGS is non-empty
          if [ -z "${PW_TAGS}" ]; then
            GREP_ARG=""
          else
            GREP_ARG="--grep \"${PW_TAGS}\""
          fi

          export SKIP_BOOTSTRAP=true
          # Skip re-provisioning test-files if we already did the bootstrap test
          if [ "${{ inputs.skip_extension_tests }}" != "true" ]; then
            export SKIP_CLONE=true
          else
            export SKIP_CLONE=false
          fi

          # Shards are duration-balanced by the reporter's preprocess hook
          # (see playwright.config.ts); falls back to the native split on error.
          CMD="npx playwright test \
            --shard=${{ matrix.shard }}/${{ inputs.shards }} \
            --project ${{ inputs.project }} \
            --workers ${{ inputs.workers }} \
            $GREP_ARG \
            --repeat-each ${{ inputs.repeat_each }} \
            --max-failures ${{ inputs.max_failures }}"

          echo "Running: $CMD"

          # Always run with || true when using blob reporter (merge-reports determines pass/fail)
          eval SKIP_BOOTSTRAP=true $CMD || true

      - name: Upload Blob Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ inputs.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload Test Logs
        if: ${{ always() && inputs.upload_logs }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-win-logs
          path: test-logs
          if-no-files-found: ignore

      # A native crash leaves a minidump in `.build/crashes` (electron.ts's
      # `--crash-reporter-directory`); the job used to discard it. `always()`,
      # not `failure()`: the Playwright step ends in `|| true`.
      - name: Upload Crash Dumps
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-win-crash-dumps-${{ inputs.project }}-${{ matrix.shard }}
          path: .build/crashes
          retention-days: 7
          if-no-files-found: ignore

  merge-reports:
    name: ${{ inputs.display_name }}
    timeout-minutes: 10
    if: ${{ !cancelled() }}
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout specific commit
        if: ${{ inputs.commit != '' }}
        run: git checkout ${{ inputs.commit }}

      - uses: ./.github/actions/merge-e2e-blob-reports
        with:
          project: ${{ inputs.project }}
          shards: ${{ inputs.shards }}
          aws-role-to-assume: ${{ secrets.QA_AWS_RO_ROLE }}
          aws-region: ${{ secrets.QA_AWS_REGION }}
          report-upload-role: ${{ secrets.AWS_TEST_REPORTS_ROLE }}
          github-token: ${{ github.token }}
