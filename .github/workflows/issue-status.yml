name: Issue Status

# Keeps the Positron Backlog board and issue state in step with each other.
# See .github/scripts/issue-status.mts for the rules.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed]
  schedule:
    # Daily, 14:00 UTC (morning in the Americas).
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what the daily close would do without closing anything
        type: boolean
        default: true

jobs:
  # Moves an issue along the board as the PR that closes it opens, becomes ready, or closes.
  on-pull-request:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate token for GitHub App
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          owner: posit-dev
          repositories: positron

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/issue-status.mts
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Update board status
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PROJECT_OWNER: posit-dev
          PROJECT_NUMBER: 2
        run: node .github/scripts/issue-status.mts

  # Dragging an issue to Done on the board does not close it. Close those once a day.
  close-done:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate token for GitHub App
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          permission-issues: write
          permission-organization-projects: read
          owner: posit-dev
          repositories: positron

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/issue-status.mts
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Close open issues that are Done on the board
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PROJECT_OWNER: posit-dev
          PROJECT_NUMBER: 2
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node .github/scripts/issue-status.mts close-done
