name: Close Done Issues

# Dragging an issue to Done on the Positron Backlog board does not close it.
# Once a day, close the open issues in this repo that are Done on the board.

on:
  schedule:
    # Daily, 14:00 UTC (morning in the Americas).
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would close without closing anything
        type: boolean
        default: true

jobs:
  close-done:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate token for GitHub App
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          permission-issues: write
          permission-organization-projects: read
          owner: posit-dev
          repositories: positron

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/close-done-issues.mts
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Close open issues that are Done on the board
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PROJECT_OWNER: posit-dev
          PROJECT_NUMBER: 2
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node .github/scripts/close-done-issues.mts
