name: "Test: PR"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "prerelease/**"
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this PR changes only docs or tooling (see
  # scripts/lib/pr-docs-only-lib.sh). If so, the unit, ext-host, and
  # e2e / electron jobs are skipped with a caller-level `if:`. That doesn't
  # block the merge: required-tests (below) is the one required check, and it
  # counts a skipped job as passing. `paths-ignore` won't do, because then
  # required-tests wouldn't report at all.
  #
  # Fails open: the jobs below run even if this job fails (`!cancelled()`), and
  # an empty output means "not docs-only", so the tests run.
  docs-only:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for a docs-only change
        id: docs-only
        run: bash scripts/pr-docs-only.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  pr-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pr-tags.outputs.tags }}
      win_tag_found: ${{ steps.pr-tags.outputs.win_tag_found }}
      web_tag_found: ${{ steps.pr-tags.outputs.web_tag_found }}
      rocky_electron_tag_found: ${{ steps.pr-tags.outputs.rocky_electron_tag_found }}
      rocky_web_tag_found: ${{ steps.pr-tags.outputs.rocky_web_tag_found }}
      suse_electron_tag_found: ${{ steps.pr-tags.outputs.suse_electron_tag_found }}
      suse_web_tag_found: ${{ steps.pr-tags.outputs.suse_web_tag_found }}
      sles_electron_tag_found: ${{ steps.pr-tags.outputs.sles_electron_tag_found }}
      sles_web_tag_found: ${{ steps.pr-tags.outputs.sles_web_tag_found }}
      debian_electron_tag_found: ${{ steps.pr-tags.outputs.debian_electron_tag_found }}
      debian_web_tag_found: ${{ steps.pr-tags.outputs.debian_web_tag_found }}
      pyrefly_tag_found: ${{ steps.pr-tags.outputs.pyrefly_tag_found }}
      workbench_tag_found: ${{ steps.pr-tags.outputs.workbench_tag_found }}
      workbench_stable_tag_found: ${{ steps.pr-tags.outputs.workbench_stable_tag_found }}
      workbench_rocky_tag_found: ${{ steps.pr-tags.outputs.workbench_rocky_tag_found }}
      workbench_suse_tag_found: ${{ steps.pr-tags.outputs.workbench_suse_tag_found }}
      jupyter_tag_found: ${{ steps.pr-tags.outputs.jupyter_tag_found }}
      remote_ssh_tag_found: ${{ steps.pr-tags.outputs.remote_ssh_tag_found }}
      connect_tag_found: ${{ steps.pr-tags.outputs.connect_tag_found }}
      # Per-lane shard plans from the test-count listing (see pr-tags-parse.sh).
      linux_shards: ${{ steps.pr-tags.outputs.linux_shards }}
      linux_matrix: ${{ steps.pr-tags.outputs.linux_matrix }}
      linux_max_failures: ${{ steps.pr-tags.outputs.linux_max_failures }}
      win_shards: ${{ steps.pr-tags.outputs.win_shards }}
      win_matrix: ${{ steps.pr-tags.outputs.win_matrix }}
      win_max_failures: ${{ steps.pr-tags.outputs.win_max_failures }}
      web_shards: ${{ steps.pr-tags.outputs.web_shards }}
      web_matrix: ${{ steps.pr-tags.outputs.web_matrix }}
      web_max_failures: ${{ steps.pr-tags.outputs.web_max_failures }}

    steps:
      - uses: actions/checkout@v7
      # Install just enough for `playwright test --list`: pr-tags-parse.sh counts
      # each lane's tests to pick a shard count, and derive-test-change-tags.mjs
      # discovers e2e test tags. Shared with pr-e2e-comment.yml so the two
      # derivation environments can't drift -- see the composite action.
      - name: Set up e2e tag listing
        uses: ./.github/actions/e2e-tag-listing-setup
      # Guardrail for the tag-derivation scripts; fail fast before relying on them below.
      - name: Unit test the tag-derivation helpers
        run: bash scripts/test/pr-tags-lib-test.sh
      - name: Unit test the docs-only helpers
        run: bash scripts/test/pr-docs-only-lib-test.sh
      - name: Test the docs-only script
        run: bash scripts/test/pr-docs-only-test.sh
      - name: Validate test-tag-paths-map.json tags against test-tags.ts
        run: bash scripts/check-test-tag-map.sh --tags-only
      - name: Parse Tags from PR Body
        id: pr-tags
        run: bash scripts/pr-tags-parse.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      # Scoped to dirs THIS PR touches, unlike the tree-wide weekly sweep
      # (check-test-tag-map.sh), which stays warn-only so unrelated drift
      # can't fail an unrelated PR.
      - name: Fail if this PR touches an unmapped Positron dir
        if: ${{ steps.pr-tags.outputs.unmapped_dirs != '' }}
        run: |
          echo "This PR touches a Positron source dir with no entry in test-tag-paths-map.json:"
          echo "${{ steps.pr-tags.outputs.unmapped_dirs }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "Add each dir to .github/workflows/test-tag-paths-map.json: a feature tag list (e.g. [\"@:console\"]) or [] if it has no e2e coverage."
          exit 1
      # The advisory comment (no-match / unmapped-dir warnings) is posted from
      # the pr-e2e-comment workflow, folded into the single "E2E Tests" comment.

  e2e-ubuntu-electron:
    name: e2e
    uses: ./.github/workflows/test-e2e-ubuntu.yml
    needs: [pr-tags, docs-only]
    if: ${{ !cancelled() && needs.pr-tags.result == 'success' && needs.docs-only.outputs.docs_only != 'true' }}
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
      workers: 2
      shards: ${{ fromJson(needs.pr-tags.outputs.linux_shards) }}
      matrix: ${{ needs.pr-tags.outputs.linux_matrix }}
      max_failures: ${{ fromJson(needs.pr-tags.outputs.linux_max_failures) }}
    secrets: inherit

  e2e-windows-electron:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.win_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-windows-run.yml
    with:
      save_cache: false  # PRs restore from main only; test-merge.yml saves
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron-win"
      upload_logs: false
      shards: ${{ fromJson(needs.pr-tags.outputs.win_shards) }}
      matrix: ${{ needs.pr-tags.outputs.win_matrix }}
      max_failures: ${{ fromJson(needs.pr-tags.outputs.win_max_failures) }}
    secrets: inherit

  e2e-ubuntu-browser:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.web_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-ubuntu.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "chromium"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: false
      shards: ${{ fromJson(needs.pr-tags.outputs.web_shards) }}
      matrix: ${{ needs.pr-tags.outputs.web_matrix }}
      max_failures: ${{ fromJson(needs.pr-tags.outputs.web_max_failures) }}
    secrets: inherit

  e2e-rocky-electron:
    name: e2e
    uses: ./.github/workflows/test-e2e-rocky.yml
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.rocky_electron_tag_found == 'true' }}
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron (Rocky)"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
    secrets: inherit

  e2e-rocky-chromium:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.rocky_web_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-rocky.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "chromium (Rocky)"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: false
    secrets: inherit

  e2e-suse-electron:
    name: e2e
    uses: ./.github/workflows/test-e2e-suse.yml
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.suse_electron_tag_found == 'true' }}
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron (SUSE)"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
    secrets: inherit

  e2e-suse-chromium:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.suse_web_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-suse.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "chromium (SUSE)"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: false
    secrets: inherit

  e2e-sles-electron:
    name: e2e
    uses: ./.github/workflows/test-e2e-sles.yml
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.sles_electron_tag_found == 'true' }}
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron (SLES)"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
    secrets: inherit

  e2e-sles-chromium:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.sles_web_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-sles.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "chromium (SLES)"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: false
    secrets: inherit

  e2e-debian-electron:
    name: e2e
    uses: ./.github/workflows/test-e2e-debian.yml
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.debian_electron_tag_found == 'true' }}
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "electron (Debian)"
      install_undetectable_interpreters: false
      install_license: false
      upload_logs: false
    secrets: inherit

  e2e-debian-chromium:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.debian_web_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-debian.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "chromium (Debian)"
      project: "e2e-chromium"
      install_undetectable_interpreters: false
      install_license: true
      upload_logs: false
    secrets: inherit

  e2e-pyrefly:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.pyrefly_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-pyrefly.yml
    secrets: inherit

  build-workbench:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.workbench_tag_found == 'true' || needs.pr-tags.outputs.workbench_stable_tag_found == 'true' || needs.pr-tags.outputs.workbench_rocky_tag_found == 'true' || needs.pr-tags.outputs.workbench_suse_tag_found == 'true' }}
    name: build
    uses: ./.github/workflows/build-workbench-linux.yml
    secrets: inherit

  # The four Workbench lanes below run strictly one after another (Ubuntu ->
  # Rocky -> openSUSE -> stable): the managed-credential shards all sign in with
  # the same service-account TOTP secret, and overlapping sign-ins burn the same
  # OTP window. The ordering lives in `needs`; a concurrency group would not
  # work, since it holds only one pending entry and cancels the rest outright.
  # Same shape as positron-builds' test-e2e-release.yml.
  #
  # Each lane is selected by its own PR tag, so a lane behind a skipped or failed
  # one must still run: hence `!cancelled()` plus an explicit check that the
  # build succeeded, instead of relying on the default "all needs succeeded".
  e2e-workbench:
    needs: [pr-tags, build-workbench]
    if: ${{ needs.pr-tags.outputs.workbench_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-workbench-linux.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "workbench"
      install_license: false
      upload_logs: false
    secrets: inherit

  # Same test set as the workbench lane, run against a Rocky Linux 9 container.
  # `grep` is pinned to "@:workbench" rather than the PR's derived tags:
  # @:workbench-rocky selects the lane, never individual tests, so no test
  # carries it.
  e2e-workbench-rocky:
    needs: [pr-tags, build-workbench, e2e-workbench]
    if: ${{ !cancelled() && needs.build-workbench.result == 'success' && needs.pr-tags.outputs.workbench_rocky_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-workbench-linux.yml
    with:
      os: "rocky9"
      grep: "@:workbench"
      display_name: "workbench-rocky"
      install_license: false
      upload_logs: false
    secrets: inherit

  # Same test set again, on an openSUSE Leap 15.6 container. `grep` is pinned to
  # "@:workbench" for the same reason as the Rocky lane above: @:workbench-suse
  # selects the lane, never individual tests, so no test carries it.
  # @:workbench-all sets this lane's flag too (see scripts/pr-tags-parse.sh),
  # which is why there is no separate condition for it here.
  e2e-workbench-suse:
    needs: [pr-tags, build-workbench, e2e-workbench-rocky]
    if: ${{ !cancelled() && needs.build-workbench.result == 'success' && needs.pr-tags.outputs.workbench_suse_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-workbench-linux.yml
    with:
      os: "opensuse15"
      grep: "@:workbench"
      display_name: "workbench-suse"
      install_license: false
      upload_logs: false
    secrets: inherit

  e2e-workbench-stable:
    needs: [pr-tags, build-workbench, e2e-workbench-suse]
    if: ${{ !cancelled() && needs.build-workbench.result == 'success' && needs.pr-tags.outputs.workbench_stable_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-workbench-linux.yml
    with:
      grep: "@:workbench"
      display_name: "workbench-stable"
      install_license: false
      upload_logs: false
      install_mode: "ci-stable"
    secrets: inherit

  build-jupyter:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.jupyter_tag_found == 'true' }}
    name: build
    uses: ./.github/workflows/build-jupyter-linux.yml
    secrets: inherit

  e2e-jupyter:
    needs: [pr-tags, build-jupyter]
    if: ${{ needs.pr-tags.outputs.jupyter_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-jupyter-ubuntu.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "jupyter"
      install_license: true
      upload_logs: false
    secrets: inherit

  build-remote-ssh:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.remote_ssh_tag_found == 'true' }}
    name: build
    uses: ./.github/workflows/build-remote-ssh-linux.yml
    secrets: inherit

  e2e-remote-ssh:
    needs: [pr-tags, build-remote-ssh]
    if: ${{ needs.pr-tags.outputs.remote_ssh_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-remote-ssh-ubuntu.yml
    with:
      grep: ${{ needs.pr-tags.outputs.tags }}
      display_name: "remote-ssh"
      upload_logs: false
    secrets: inherit

  build-connect:
    needs: pr-tags
    if: ${{ needs.pr-tags.outputs.connect_tag_found == 'true' }}
    name: build
    uses: ./.github/workflows/build-connect-linux.yml
    secrets: inherit

  e2e-connect:
    needs: [pr-tags, build-connect]
    if: ${{ needs.pr-tags.outputs.connect_tag_found == 'true' }}
    name: e2e
    uses: ./.github/workflows/test-e2e-connect.yml
    with:
      display_name: "connect"
      upload_logs: false
    secrets: inherit

  unit-tests:
    name: test
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit
    with:
      save_cache: false  # PRs restore from main only; test-merge.yml saves

  ext-host-tests:
    name: test
    needs: docs-only
    if: ${{ !cancelled() && needs.docs-only.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/test-ext-host.yml
    secrets: inherit
    with:
      pull_request: true

  # Single always-reported check for every test job in this workflow, meant to
  # be the one required check in the branch ruleset (in place of test / unit,
  # test / ext-host and e2e / electron).
  #
  # The tag-driven lanes can't be required directly: when a lane's tag is
  # absent its job is skipped at the caller level, so its "e2e / <lane>" check
  # is never created and a required check would wait forever. Here a skipped
  # job counts as passing, so any job can be skipped with a caller-level `if:`
  # (a tag that's absent, or a docs-only PR) without blocking the merge. A
  # failed or cancelled job, or a failed pr-tags, fails the gate. It needs
  # `if: always()`: without it, a failed dependency would skip the gate, and a
  # skipped gate reads as passing.
  #
  # The build-* jobs are listed too: when a build fails, the e2e lane behind
  # it is skipped rather than failed, so without them the gate would pass.
  # Keep this list in sync when adding a test job above.
  required-tests:
    name: required-tests
    if: ${{ always() }}
    needs:
      [
        pr-tags,
        unit-tests,
        ext-host-tests,
        e2e-ubuntu-electron,
        e2e-windows-electron,
        e2e-ubuntu-browser,
        e2e-rocky-electron,
        e2e-rocky-chromium,
        e2e-suse-electron,
        e2e-suse-chromium,
        e2e-sles-electron,
        e2e-sles-chromium,
        e2e-debian-electron,
        e2e-debian-chromium,
        e2e-pyrefly,
        build-workbench,
        e2e-workbench,
        e2e-workbench-rocky,
        e2e-workbench-suse,
        e2e-workbench-stable,
        build-jupyter,
        e2e-jupyter,
        build-remote-ssh,
        e2e-remote-ssh,
        build-connect,
        e2e-connect,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "One or more test jobs failed or were cancelled:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          exit 1
