name: "PR: Comment"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

jobs:
  e2e-tags:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.state != 'closed' }} # Skip job if PR is closed
    steps:
      - uses: actions/checkout@v7

      # Install just enough for `playwright test --list`, so the comment shows
      # the e2e test-change tags and each lane's test count. Shared with the
      # pr-tags job in test-pull-request.yml so the two environments match.
      - name: Set up e2e tag listing
        uses: ./.github/actions/e2e-tag-listing-setup

      - name: Parse Tags from PR Body
        id: pr-tags
        run: bash scripts/pr-tags-parse.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

      - name: Update PR Comment with Tags
        run: bash ./scripts/pr-e2e-comment.sh "<!-- PR Tags -->" "${{ env.tags }}" "${{ steps.pr-tags.outputs.no_matches }}" "${{ steps.pr-tags.outputs.unmapped_dirs }}" "${{ steps.pr-tags.outputs.invalid_tags }}" "${{ steps.pr-tags.outputs.tag_reasons }}" "${{ steps.pr-tags.outputs.lane_summary }}"
        env:
          tags: ${{ steps.pr-tags.outputs.tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
