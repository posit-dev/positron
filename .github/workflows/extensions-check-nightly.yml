name: 'Nightly: Bootstrap Extensions Check'

# Run builds daily at 2am UTC (10p EST) on weekdays for now, or manually
on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Dry run: detect mismatches and run the bump script, but skip commit/push/PR/Slack.'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  extensions-linux:
    name: 'extensions-linux'
    timeout-minutes: 60
    runs-on: ubuntu-latest-8x
    container:
      image: ghcr.io/posit-dev/positron-ubuntu24:24.18.0
      options: --user 0:0
      # Static PAT is needed because the bot can't pass a token to the job for security reasons
      credentials:
        username: ${{ secrets.POSITRON_GITHUB_RO_USER }}
        password: ${{ secrets.POSITRON_GITHUB_RO_PAT }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0 # CI skips building releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          distro: ubuntu
          install-playwright: 'true'
          github-token: ${{ github.token }}

      - name: Setup Xvfb
        uses: ./.github/actions/setup-xvfb

      - name: Send Results to GH Summary
        uses: ./.github/actions/gen-report-dir
        with:
          identifier: e2e-electron

      - name: 🧪 Run Playwright Tests (Electron)
        shell: bash
        env:
          POSITRON_PY_VER_SEL: "3.10.12"
          POSITRON_R_VER_SEL: 4.5.2
          POSITRON_PY_ALT_VER_SEL: "3.13.0"
          POSITRON_R_ALT_VER_SEL: 4.4.2
          PWTEST_BLOB_DO_NOT_REMOVE: 1
          EXTENSIONS_FAIL_ON_MISMATCH: true
          # pyrefly is blocked from installing in every other e2e run because
          # its language server is expensive. This check never opens a Python
          # file or a notebook, so nothing activates it -- it only needs the
          # extension on disk to compare versions. Allowing it here is what
          # lets pyrefly be detected like any other bootstrap extension
          # instead of being bumped unconditionally every night.
          ALLOW_PYREFLY: 'true'
        run: |
          echo "Running: npx playwright test test/e2e/tests/extensions/bootstrap-extensions.test.ts --project e2e-electron --reporter=null"
          npx playwright test test/e2e/tests/extensions/bootstrap-extensions.test.ts --project e2e-electron --reporter=null

      - name: Upload mismatched extensions list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mismatched-extensions-linux
          path: |
            test-logs/mismatched-extensions.txt
            test-logs/mismatched-versions.json
          retention-days: 3
          if-no-files-found: ignore

  # A version can be published for Linux but not Windows (meta.pyrefly 1.3.2
  # shipped without a win32-x64 build). Windows only reports a mismatch once the
  # new version actually installs there, and auto-update bumps an extension only
  # when both platforms report it.
  extensions-windows:
    name: 'extensions-windows'
    timeout-minutes: 90
    runs-on: windows-latest-8x
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSITRON_BUILD_NUMBER: 0 # CI skips building releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install System Level Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.10"

      - name: 📦 Restore caches
        id: restore-caches
        uses: ./.github/actions/restore-build-caches

      # See test-e2e-windows-run.yml for why the VS 2022 build tools are needed.
      - name: Install Visual Studio 2022 C++ build tools
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            $ErrorActionPreference = 'Stop'
            $bootstrapper = "$env:TEMP\vs_buildtools.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $bootstrapper
            $p = Start-Process -FilePath $bootstrapper -Wait -PassThru -ArgumentList @(
              '--quiet','--wait','--norestart','--nocache',
              '--add','Microsoft.VisualStudio.Workload.VCTools',
              '--add','Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
              '--includeRecommended'
            )
            if ($p.ExitCode -notin 0,3010) { exit $p.ExitCode }

      - name: Install node dependencies
        if: steps.restore-caches.outputs.cache-npm-core-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' ||
            steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true'
        uses: nick-fields/retry@v4
        env:
          npm_config_arch: x64
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          POSITRON_GITHUB_RO_PAT: ${{ github.token }}
          POSITRON_PARALLEL_INSTALL: '0'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          POSITRON_EXTENSIONS_FILTER: ${{ (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit == 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit != 'true' && 'stable') || (steps.restore-caches.outputs.cache-npm-extensions-volatile-hit != 'true' && steps.restore-caches.outputs.cache-npm-extensions-stable-hit == 'true' && 'volatile') || '' }}
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 5
          shell: bash
          command: |
            set -e
            npm --prefix build ci --no-audit --no-fund --fetch-timeout 120000
            npm ci --no-audit --no-fund --fetch-timeout 120000

      - name: Download binaries (Ark, Kallichore) with retry
        uses: nick-fields/retry@v4
        env:
          POSITRON_GITHUB_RO_PAT: ${{ github.token }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            set -e
            cd extensions
            cd positron-r && npm rebuild --foreground-scripts
            cd ../positron-supervisor && npm rebuild --foreground-scripts

      - name: Compile Positron and Download Electron
        run: npm exec -- npm-run-all --max-old-space-size=8192 -p compile "electron x64"

      - name: Install Playwright browsers
        run: npm run playwright-install

      - name: Install E2E test dependencies
        run: npm --prefix test/e2e ci --no-audit --no-fund

      - name: Compile E2E Tests
        run: npm --prefix test/e2e run compile

      - name: Download builtin extensions
        shell: bash
        run: npm run prelaunch

      - name: 🧪 Run Playwright Tests (Electron)
        shell: bash
        env:
          POSITRON_PY_VER_SEL: 3.10.10
          PWTEST_BLOB_DO_NOT_REMOVE: 1
          EXTENSIONS_FAIL_ON_MISMATCH: true
          # See extensions-linux.
          ALLOW_PYREFLY: 'true'
        run: npx playwright test test/e2e/tests/extensions/bootstrap-extensions.test.ts --project e2e-electron --reporter=null

      - name: Upload mismatched extensions list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mismatched-extensions-windows
          path: |
            test-logs/mismatched-extensions.txt
            test-logs/mismatched-versions.json
          retention-days: 3
          if-no-files-found: ignore

  dependency-check:
    name: 'check-bootstrap-extension-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-dependency-check
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    outputs:
      flagged: ${{ steps.depcheck.outputs.flagged }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check bootstrap extension dependencies
        id: depcheck
        run: |
          node scripts/check-bootstrap-extension-deps.ts --json > depcheck.json
          echo "hits=$(jq '.hits | length' depcheck.json)" >> "$GITHUB_OUTPUT"
          echo "flagged=$(jq -r '[.hits[].id] | join(" ")' depcheck.json)" >> "$GITHUB_OUTPUT"
          {
            jq -r '.summary' depcheck.json
            jq -r '.warnings[]? | "- " + .' depcheck.json
            jq -r '.hits[]? | "- HIT: " + .issueTitle' depcheck.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for each hit
        if: steps.depcheck.outputs.hits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          KNOWN_TITLES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --label "area: extensions" --limit 1000 --json title)
          jq -c '.hits[]' depcheck.json | while read -r hit; do
            title=$(jq -r '.issueTitle' <<<"$hit")
            existing=$(jq --arg t "$title" '[.[] | select(.title == $t)] | length' <<<"$KNOWN_TITLES")
            if [ "$existing" != "0" ]; then
              echo "Issue already filed, skipping: $title" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$DRYRUN" = "true" ]; then
              echo "[dryrun] Would open issue: $title"
              jq -r '.issueBody' <<<"$hit" | sed 's/^/[dryrun]   /'
            else
              jq -r '.issueBody' <<<"$hit" | gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --label "area: extensions" --label "bug" --body-file -
              echo "Opened issue: $title" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  auto-update:
    name: 'auto-update-extensions'
    if: always() && needs.extensions-linux.result != 'cancelled' && needs.extensions-windows.result != 'cancelled' && needs.dependency-check.result == 'success'
    needs: [extensions-linux, extensions-windows, dependency-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.sync.outputs.pr_url }}
      pr_action: ${{ steps.sync.outputs.pr_action }}
      unexplained_failure: ${{ steps.update.outputs.unexplained_failure }}
    steps:
      # Local composite actions (used below) only resolve once the repo is on
      # disk, so check out first. detect-managed-pr re-checks-out with the bot
      # token to set up push credentials.
      - uses: actions/checkout@v7
      - name: Detect managed PR
        id: detect
        uses: ./.github/actions/detect-managed-pr
        with:
          branch-prefix: automated/update-extensions
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}

      - name: Capture pre-update state
        id: prepare
        if: steps.detect.outputs.exists == 'true'
        run: |
          # Extension set already on the PR (before any reset/reapply); drives
          # the Slack "new extensions" trigger downstream.
          PRE_SET=$(jq -rn \
            --argjson old "$(git show origin/main:product.json)" \
            --argjson new "$(cat product.json)" \
            '($old.bootstrapExtensions | map({(.name): .version}) | add) as $ov |
             ($new.bootstrapExtensions | map({(.name): .version}) | add) as $nv |
             [$nv | to_entries[] | select(.value != $ov[.key]) | .key] | sort | join(" ")')
          echo "Pre-update extension set: ${PRE_SET:-<empty>}"
          echo "pre_set=$PRE_SET" >> "$GITHUB_OUTPUT"

      - name: Reset branch to main (clean reapply)
        if: steps.detect.outputs.exists == 'true' && steps.detect.outputs.mode == 'reset'
        run: |
          echo "Resetting to origin/main; the bump script will reapply today's changes from scratch."
          git reset --hard origin/main

      - name: Download Linux mismatched extensions list
        if: needs.extensions-linux.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mismatched-extensions-linux
          path: mismatched/linux

      - name: Download Windows mismatched extensions list
        if: needs.extensions-windows.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mismatched-extensions-windows
          path: mismatched/windows

      - name: Update extensions
        id: update
        env:
          LINUX_RESULT: ${{ needs.extensions-linux.result }}
          WINDOWS_RESULT: ${{ needs.extensions-windows.result }}
          FLAGGED: ${{ needs.dependency-check.outputs.flagged }}
        run: |
          MISMATCHED=()
          if [ "$LINUX_RESULT" = "failure" ] && [ -s mismatched/linux/mismatched-extensions.txt ]; then
            read -ra MISMATCHED <<< "$(cat mismatched/linux/mismatched-extensions.txt)"
          fi
          # Empty when Windows found no drift, or failed before recording any;
          # either way nothing is confirmed there, so nothing is bumped.
          WINDOWS_MISMATCHED=$(cat mismatched/windows/mismatched-extensions.txt 2>/dev/null || true)
          EXTENSIONS_TO_BUMP=()
          HELD_BACK=()
          NOT_ON_WINDOWS=()
          for ext in "${MISMATCHED[@]}"; do
            if [[ " $FLAGGED " == *" $ext "* ]]; then
              HELD_BACK+=("$ext")
            elif [[ " $WINDOWS_MISMATCHED " != *" $ext "* ]]; then
              NOT_ON_WINDOWS+=("$ext")
            else
              EXTENSIONS_TO_BUMP+=("$ext")
            fi
          done
          {
            echo "### Bootstrap extensions to bump"
            echo ""
            if [ ${#EXTENSIONS_TO_BUMP[@]} -eq 0 ]; then
              echo "- (none)"
            else
              printf -- '- %s\n' "${EXTENSIONS_TO_BUMP[@]}"
            fi
            if [ ${#HELD_BACK[@]} -gt 0 ]; then
              echo ""
              echo "Held back, latest version depends on a blocked extension:"
              echo ""
              printf -- '- %s\n' "${HELD_BACK[@]}"
            fi
            if [ ${#NOT_ON_WINDOWS[@]} -gt 0 ]; then
              echo ""
              echo "Held back, new version not confirmed on Windows:"
              echo ""
              printf -- '- %s\n' "${NOT_ON_WINDOWS[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#HELD_BACK[@]} -gt 0 ]; then
            echo "Holding back: ${HELD_BACK[*]}"
          fi
          if [ ${#NOT_ON_WINDOWS[@]} -gt 0 ]; then
            echo "Holding back (not on Windows): ${NOT_ON_WINDOWS[*]}"
          fi
          # A failed check that recorded no drift failed for some other reason
          # (setup, install timeout), so slack-notify still sends the generic alert.
          UNEXPLAINED=false
          if { [ "$LINUX_RESULT" = "failure" ] && [ ${#MISMATCHED[@]} -eq 0 ]; } ||
             { [ "$WINDOWS_RESULT" = "failure" ] && [ -z "$WINDOWS_MISMATCHED" ]; }; then
            UNEXPLAINED=true
          fi
          echo "unexplained_failure=$UNEXPLAINED" >> "$GITHUB_OUTPUT"
          # One "<ext> <current> -> <new>: <reason>" line per held-back extension.
          held_back_line() {
            local current new
            current=$(jq -r --arg e "$1" '.bootstrapExtensions[] | select(.name == $e) | .version' product.json)
            new=$(jq -r --arg e "$1" '.[$e] // "newer"' mismatched/linux/mismatched-versions.json 2>/dev/null || echo newer)
            echo "$1 $current -> $new: $2"
          }
          HELD_BACK_LINES=$(
            for ext in "${HELD_BACK[@]}"; do held_back_line "$ext" "latest version depends on a blocked extension"; done
            for ext in "${NOT_ON_WINDOWS[@]}"; do held_back_line "$ext" "new version not confirmed on Windows"; done
          )
          if [ -n "$HELD_BACK_LINES" ]; then
            DELIM="HELD_BACK_EOF_$(openssl rand -hex 8)"
            {
              echo "held_back<<$DELIM"
              printf '%s\n' "$HELD_BACK_LINES"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ ${#EXTENSIONS_TO_BUMP[@]} -eq 0 ]; then
            echo "Nothing to bump."
            exit 0
          fi
          echo "Bumping extensions: ${EXTENSIONS_TO_BUMP[*]}"
          ./scripts/update-extensions.sh "${EXTENSIONS_TO_BUMP[@]}"
          git add product.json

      - name: Show product.json diff
        run: |
          if git diff --cached --quiet product.json; then
            echo "No changes to product.json."
          else
            git --no-pager diff --cached product.json
          fi

      - name: Render test tags
        id: render-tags
        env:
          PRE_SET: ${{ steps.prepare.outputs.pre_set }}
        run: |
          # Compare against origin/main so reused PRs report the *full* bump set,
          # not just today's incremental change on top of an existing commit.
          git fetch origin main
          UPDATED=$(jq -rn \
            --argjson old "$(git show origin/main:product.json)" \
            --argjson new "$(cat product.json)" \
            '($old.bootstrapExtensions | map({(.name): .version}) | add) as $ov |
             ($new.bootstrapExtensions | map({(.name): .version}) | add) as $nv |
             [$nv | to_entries[] | select(.value != $ov[.key]) | .key] | sort | join(" ")')
          if [ -z "$UPDATED" ]; then
            echo "No bootstrap extension version changes detected."
            echo "updated=" >> "$GITHUB_OUTPUT"
            echo "new_exts=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extensions newly added on top of the existing PR (empty for a brand-new PR).
          if [ -z "$PRE_SET" ]; then
            NEW_EXTS="$UPDATED"
          else
            NEW_EXTS=$(comm -23 \
              <(printf '%s\n' $UPDATED | sort -u) \
              <(printf '%s\n' $PRE_SET | sort -u) \
              | tr '\n' ' ' | sed 's/ *$//')
          fi
          echo "new_exts=$NEW_EXTS" >> "$GITHUB_OUTPUT"
          TAG_MAP=.github/workflows/extensions-tag-map.json
          TAG_BULLETS=$(echo "$UPDATED" | tr ' ' '\n' | jq -R -s -r --slurpfile map "$TAG_MAP" '
            (split("\n") | map(select(length > 0))) as $exts |
            $map[0] as $m |
            $exts | map(
              . as $e | $m[$e] as $entry |
              if $entry == null then
                "- " + $e + " -> (unmapped; add to extensions-tag-map.json)"
              elif ($entry.tags | length) > 0 then
                "- " + $e + " -> " + ($entry.tags | join(", "))
              else
                "- " + $e + " -> n/a"
              end
            ) | join("\n")
          ')
          COMBINED_TAGS=$(echo "$UPDATED" | tr ' ' '\n' | jq -R -s -r --slurpfile map "$TAG_MAP" '
            split("\n") | map(select(length > 0)) | map($map[0][.].tags // []) | flatten | unique | join(" ")
          ')
          UNMAPPED=$(echo "$UPDATED" | tr ' ' '\n' | jq -R -s -r --slurpfile map "$TAG_MAP" '
            split("\n") | map(select(length > 0)) | map(select($map[0][.] == null)) | join(", ")
          ')
          {
            echo "### Suggested test tags"
            echo ""
            echo "$TAG_BULLETS"
            if [ -n "$COMBINED_TAGS" ]; then
              echo ""
              echo "Combined: $COMBINED_TAGS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "combined_tags=$COMBINED_TAGS" >> "$GITHUB_OUTPUT"
          echo "unmapped=$UNMAPPED" >> "$GITHUB_OUTPUT"

      - name: Build PR content
        id: content
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAP_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/extensions-tag-map.json
          UPDATED: ${{ steps.render-tags.outputs.updated }}
          COMBINED_TAGS: ${{ steps.render-tags.outputs.combined_tags }}
          UNMAPPED: ${{ steps.render-tags.outputs.unmapped }}
        run: |
          EXT_BULLETS=$(echo "$UPDATED" | tr ' ' '\n' | sed 's/^/- /')
          EXT_ARRAY=($UPDATED)
          COUNT=${#EXT_ARRAY[@]}
          if [ "$COUNT" -le 3 ]; then
            TITLE="chore: update bootstrap extensions ($(echo "$UPDATED" | tr ' ' ','))"
          else
            FIRST3="${EXT_ARRAY[0]},${EXT_ARRAY[1]},${EXT_ARRAY[2]}"
            TITLE="chore: update bootstrap extensions ($FIRST3 +$((COUNT - 3)) more)"
          fi
          TAGS_LINE=""
          [ -n "$COMBINED_TAGS" ] && TAGS_LINE="${COMBINED_TAGS}
          "
          UNMAPPED_LINE=""
          [ -n "$UNMAPPED" ] && UNMAPPED_LINE="[Unmapped](${MAP_URL}): ${UNMAPPED}
          "
          BODY="### Summary
          Update bootstrap extensions detected as out-of-date by the nightly check.

          ${EXT_BULLETS}

          ### QA Notes
          ${TAGS_LINE}${UNMAPPED_LINE}Triggered by [nightly extensions check](${RUN_URL}).

          _This PR is auto-managed by the nightly bootstrap-extensions workflow; the title and body may be overwritten on subsequent runs._"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          # Randomized delimiter so a body line can't accidentally match it and
          # truncate the multiline output.
          DELIM="PR_BODY_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            printf '%s\n' "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and sync PR
        id: sync
        uses: ./.github/actions/commit-and-sync-pr
        with:
          github-token: ${{ steps.detect.outputs.github-token }}
          exists: ${{ steps.detect.outputs.exists }}
          mode: ${{ steps.detect.outputs.mode }}
          pr_number: ${{ steps.detect.outputs.pr_number }}
          pr_url: ${{ steps.detect.outputs.pr_url }}
          pr_branch: ${{ steps.detect.outputs.pr_branch }}
          branch-prefix: automated/update-extensions
          commit-message: 'chore: update bootstrap extensions'
          title: ${{ steps.content.outputs.title }}
          body: ${{ steps.content.outputs.body }}
          dryrun: ${{ inputs.dryrun }}
          clear-stale-branch-on-empty-reset: 'false'

      - name: Post PR to Slack
        if: steps.sync.outputs.pr_action == 'created' || steps.sync.outputs.pr_action == 'updated'
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN_TEST_STATUS }}
          PR_URL: ${{ steps.sync.outputs.pr_url }}
          PR_ACTION: ${{ steps.sync.outputs.pr_action }}
          UPDATED: ${{ steps.render-tags.outputs.updated }}
          NEW_EXTS: ${{ steps.render-tags.outputs.new_exts }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          if [ "$PR_ACTION" = "updated" ] && [ -z "$NEW_EXTS" ]; then
            echo "Reused existing PR with no new extensions -- skipping Slack repost."
            exit 0
          fi
          # Slack bullets reflect today's contribution: the newly added subset for reuse,
          # or the full set for a brand-new PR.
          BULLET_EXTS="${NEW_EXTS:-$UPDATED}"
          PAYLOAD=$(jq -n \
            --arg channel "#positron-dev" \
            --arg pr_url "$PR_URL" \
            --arg ext "$BULLET_EXTS" \
            '($pr_url | split("/") | last) as $pr_num |
             (if $ext != "" then "\n\n" + ($ext | split(" ") | map("• " + .) | join("\n")) else "" end) as $bullets |
             {
               channel: $channel,
               text: ("📦 *Bootstrap Extensions Updated* · <" + $pr_url + "|PR #" + $pr_num + ">" + $bullets)
             }')
          if [ "$DRYRUN" = "true" ]; then
            echo "[dryrun] Would post to Slack:"
            printf '%s\n' "$PAYLOAD" | sed 's/^/[dryrun]   /'
            exit 0
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Post held-back extensions to Slack
        if: steps.update.outputs.held_back != ''
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN_TEST_STATUS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HELD_BACK: ${{ steps.update.outputs.held_back }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          PAYLOAD=$(jq -n \
            --arg channel "#positron-dev" \
            --arg run_url "$RUN_URL" \
            --arg run_number "$RUN_NUMBER" \
            --arg held "$HELD_BACK" \
            '($held | split("\n") | map(select(length > 0)) | map("• " + .) | join("\n")) as $bullets |
             {
               channel: $channel,
               text: (":pause_button: *Bootstrap Extension Bumps Held Back* · <" + $run_url + "|run #" + $run_number + ">\n\n" + $bullets)
             }')
          if [ "$DRYRUN" = "true" ]; then
            echo "[dryrun] Would post to Slack:"
            printf '%s\n' "$PAYLOAD" | sed 's/^/[dryrun]   /'
            exit 0
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  slack-notify:
    # Drift that was bumped or held back is reported by auto-update's own
    # Slack messages; this alert covers everything else.
    if: always() && inputs.dryrun != true && (((needs.extensions-linux.result == 'failure' || needs.extensions-windows.result == 'failure') && needs.auto-update.outputs.pr_url == '' && (needs.auto-update.result != 'success' || needs.auto-update.outputs.unexplained_failure == 'true')) || needs.dependency-check.result == 'failure')
    needs: [extensions-linux, extensions-windows, auto-update, dependency-check]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: midleman/slack-workflow-status@v3.1.3
        with:
          gh_repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_token: ${{ secrets.SLACK_TOKEN_TEST_STATUS }}
          slack_channel: "#positron-test-results"
          notify_on: "failure"
