name: "Test: Exploratory Suggest"

# Suggests `/explore` once on a PR that looks worth exploratory testing, and
# stays quiet on the rest. Requesting a reviewer is the "ready" signal: agent
# PRs are often opened as non-drafts well before then.
#
# Auto-run experiment (#16610): when the author is on the
# EXPLORE_AUTO_RUN_AUTHORS repo variable, post starts test-exploratory.yml
# instead of posting the tip. That run posts to the PR only if its own gate
# passes it. Listing positron-projects[bot] auto-runs claude.yml's agent PRs;
# no other bot gets through. Empty the variable to end the experiment. The full list of when
# a PR gets a run is in the exploratory-test skill's CONTRIBUTING.md.
#
# pull_request_target, not pull_request: the judge job holds the positron-bot
# key, so this file and its scripts always come from main and never run PR
# code (as in test-pr-dispatch.yml). precheck skips fork PRs: /explore refuses
# a head outside this repo, so there is nothing to suggest. The model runs in
# posit-dev/positron-builds (explore-suggest.yml) with positron main's scripts,
# so a PR cannot change what judges it. It gets no tools and no checkout of
# the PR: it reads the title, body and diff from the API, framed as untrusted.
on:
  pull_request_target:
    # ready_for_review catches a reviewer requested while the PR was a draft.
    types: [review_requested, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true
        type: string
      # Dry run judges even a PR precheck would skip, and posts nothing. The
      # verdicts are in the step summary.
      dry_run:
        description: "Dry run"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Requesting two reviewers at once fires two events. One at a time per PR, so
# the second sees the first's comment instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # The free checks: draft, fork, bot, release base, the author's positron-dev
  # membership (the listed agent bot passes these two), any sign of a prior run or suggestion, and a diff with no
  # product file in it. Most PRs stop here.
  precheck:
    name: precheck
    # A fork has no secrets to mint the App token with; skip before trying.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To find an auto-run already started for the PR.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      auto: ${{ steps.check.outputs.auto }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            .github/actions/pr-exploratory-test
            .claude/skills/exploratory-test/renderer
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      # lib.mjs imports the renderer's parser.
      - name: Install renderer dependencies
        working-directory: .claude/skills/exploratory-test/renderer
        run: npm ci --no-audit --no-fund

      - name: Mint org-scoped App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.POSITRON_PROJECTS_CLIENT_ID }}
          private-key: ${{ secrets.POSITRON_PROJECTS_PEM }}
          owner: posit-dev

      - name: Check the PR
        id: check
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_ACTION: ${{ github.event.action }}
          AUTO_RUN_AUTHORS: ${{ vars.EXPLORE_AUTO_RUN_AUTHORS }}
        run: node suggest.ts precheck

  # One model call, in posit-dev/positron-builds (explore-suggest.yml), which
  # holds the Anthropic key and judges with positron main's scripts. This job
  # holds only the bot key: it dispatches the call, waits, and reads back the
  # verdict. Fails closed: an error or an unclear answer is no suggestion.
  judge:
    name: judge
    needs: [precheck]
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      suggest: ${{ steps.verdict.outputs.suggest }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/pr-exploratory-test
          persist-credentials: false

      - name: Mint a token for positron-builds
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.POSITRON_BOT_APP_ID }}
          private-key: ${{ secrets.POSITRON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: positron-builds
          permission-actions: write

      - name: Judge the PR in positron-builds
        id: run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          POSITRON_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash .github/actions/pr-exploratory-test/run-builds.sh \
            explore-suggest.yml main "explore suggest #$PR_NUMBER ($POSITRON_RUN)" 900 "$RUNNER_TEMP/judge" explore-suggest \
            -f "pr_number=$PR_NUMBER" -f "positron_run=$POSITRON_RUN"

      # post puts the reason in a PR comment, so it is held to one line.
      - name: Read the verdict
        id: verdict
        env:
          FILE: ${{ runner.temp }}/judge/explore-suggest.json
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -uo pipefail
          suggest=$(jq -r '.suggest // ""' "$FILE" 2>/dev/null) || suggest=""
          reason=$(jq -r '.reason // ""' "$FILE" 2>/dev/null | tr '\r\n\t' '   ' | tr -s ' ' | sed 's/^ //; s/ $//') || reason=""
          reason=${reason:0:1000}
          if [ "$suggest" = "true" ]; then
            { echo "suggest=true"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
          else
            echo "suggest=false" >> "$GITHUB_OUTPUT"
            [ "$suggest" = "false" ] || echo "::warning::The judge gave no verdict, so nothing is suggested."
          fi
          echo "**#$PR_NUMBER** judge: ${suggest:-no verdict}${reason:+. $reason}${RUN_ID:+ ([details](https://github.com/posit-dev/positron-builds/actions/runs/$RUN_ID))}" >> "$GITHUB_STEP_SUMMARY"

  # The only job that can write, and it runs no model.
  post:
    name: post
    needs: [precheck, judge]
    if: needs.judge.outputs.suggest == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To start an auto-run.
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            .github/actions/pr-exploratory-test
            .claude/skills/exploratory-test/renderer
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install renderer dependencies
        working-directory: .claude/skills/exploratory-test/renderer
        run: npm ci --no-audit --no-fund

      - name: Post the suggestion
        working-directory: .github/actions/pr-exploratory-test
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.judge.outputs.reason }}
          AUTO_RUN: ${{ needs.precheck.outputs.auto }}
          # Always main: test-exploratory.yml refuses runs off main, since its
          # dispatch job holds the positron-bot key.
          DISPATCH_REF: ${{ github.event.repository.default_branch }}
        run: node suggest.ts post
