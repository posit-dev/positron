name: PWB Code Server PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-latest-8x' || 'ubuntu-24.04-arm64-8-core' }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    outputs:
      version: ${{ steps.build.outputs.version }}
      code_oss_version: ${{ steps.build.outputs.code_oss_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # jenkins/set-version.sh derives the build number from the commit count
          # since version/base_commit, so it needs the full history.
          fetch-depth: 0
          filter: blob:none

      - name: Build PWB Code Server
        id: build
        uses: ./.github/actions/build-pwb-code-server
        with:
          arch: ${{ matrix.arch }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Report: one sticky comment listing both tarballs. Runs even when a leg fails
  # so a partial build still surfaces the architecture that did succeed.
  # ─────────────────────────────────────────────────────────────────────────────
  report:
    name: Report build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Build comment body
        id: comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE_OSS_VERSION: ${{ needs.build.outputs.code_oss_version }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ARTIFACTS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[]
                  | select(.expired == false and (.name | startswith("pwb-code-server-")))
                  | "- [\(.name)](https://github.com/'"${GITHUB_REPOSITORY}"'/actions/runs/'"${GITHUB_RUN_ID}"'/artifacts/\(.id)) — \(.size_in_bytes / 1048576 | floor) MB"')
          {
            echo 'body<<COMMENT_EOF'
            echo "**PWB Code Server Build** — \`${VERSION:-unknown}\` (Code OSS \`${CODE_OSS_VERSION:-unknown}\`)"
            echo ""
            if [ -n "$ARTIFACTS" ]; then
              echo "$ARTIFACTS"
              echo ""
              echo "Extract with \`tar -xzf pwb-code-server-*.tar.gz\`."
            else
              echo ":warning: No build artifacts were produced."
            fi
            if [ "$BUILD_RESULT" != "success" ]; then
              echo ""
              echo ":x: At least one architecture failed to build (\`${BUILD_RESULT}\`) — check the run log."
            fi
            echo ""
            echo "<sub>Built from ${PR_HEAD_SHA} | [Workflow run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})</sub>"
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post build comment on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pwb-code-server-build
          message: ${{ steps.comment.outputs.body }}
