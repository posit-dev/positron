name: 'Setup E2E Test Dependencies'
description: 'Install TypeScript, Playwright, and test dependencies, then compile tests'

inputs:
  working-directory:
    description: 'Working directory to run commands in (default: current directory)'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup test dependencies and compile tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      run: |
        # Read these ranges out of the root package.json while it's still here,
        # so this action can't drift from it. Hardcoded copies did drift: this
        # step pinned @playwright/test ^1.53.1 long after the root moved to
        # ^1.62.1, and the sharding reporter's preprocess hook needs >= 1.62.
        ROOT_DEPS=$(node -e '
          const pkg = require("./package.json");
          const ranges = { ...pkg.dependencies, ...pkg.devDependencies };
          const names = [
            "@playwright/test",
            "@midleman/playwright-reporter",
            "@midleman/github-actions-reporter",
            "@vscode/v8-heap-parser",
          ];
          const missing = names.filter((n) => !ranges[n]);
          if (missing.length) {
            console.error("not declared in the root package.json: " + missing.join(", "));
            process.exit(1);
          }
          console.log(names.map((n) => n + "@" + ranges[n]).join(" "));
        ')

        # Captured here for the same reason as ROOT_DEPS: the root package.json is
        # about to be removed, and the range has to come from it rather than be
        # restated, or it drifts.
        TS_SPEC=$(node -e '
          const pkg = require("./package.json");
          const range = { ...pkg.dependencies, ...pkg.devDependencies }.typescript;
          if (!range) {
            console.error("typescript not declared in the root package.json");
            process.exit(1);
          }
          console.log("typescript@" + range);
        ')

        # Must remove root package.json and provide simple stub to use root dir for test run but not build
        rm package.json
        echo '{"scripts":{"compile":"npx tsc"}}' > package.json

        # The compile script in test/e2e/package.json invokes the root's
        # TypeScript by path, so the binary's *name* follows the root dependency.
        # `typescript` is currently aliased to @typescript/typescript6, whose bin
        # is `tsc6` rather than `tsc`.
        #
        # This used to install an unpinned `typescript` deliberately, on the
        # grounds that the root pins a build for the product and this step only
        # compiles test/e2e. That stopped being safe when the alias landed: the
        # unpinned install resolved to registry TypeScript 7, which ships only
        # `bin/tsc`, and every lane using this action failed with
        # "Cannot find module .../bin/tsc6".
        npm install "$TS_SPEC"

        npm install $ROOT_DEPS
        npx playwright install
        npx playwright install-deps

        # Declared nowhere else, so there is no version to inherit.
        npm install @currents/playwright@^1.14.1
        npm install fs-extra
        npm install axe-core

        npm --prefix test/e2e install
        npm --prefix test/e2e run compile
