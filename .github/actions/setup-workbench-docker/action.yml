name: 'Setup Workbench Docker'
description: 'Start Docker Compose services and install Workbench in container'

inputs:
  os:
    description: 'Host OS for the test container: "ubuntu24", "rocky9" or "opensuse15"'
    required: false
    default: 'ubuntu24'
  install-mode:
    description: 'Installation mode: "ci" for latest daily build or "ci-stable" for stable release'
    required: false
    default: 'ci'
  credentials:
    description: 'Optional managed credential to provision: "snowflake", "databricks", or empty for none'
    required: false
    default: ''
  wb-password:
    description: 'Workbench password'
    required: true
  github-token:
    description: 'GitHub token for authentication'
    required: true
  run-id:
    description: 'GitHub run ID for Docker Compose project name'
    required: true
  custom-positron-tarball:
    description: 'Optional path to custom Positron workbench tar.gz to install instead of downloading'
    required: false
    default: ''
  workbench-license-path:
    description: 'Path to Workbench license file'
    required: false
    default: '/tmp/workbench.lic'
  connect-license-path:
    description: 'Path to Connect license file'
    required: false
    default: '/tmp/connect.lic'

runs:
  using: 'composite'
  steps:
    - name: Prepare Connect license for volume mount
      shell: bash
      run: |
        # Create connect directory if it doesn't exist
        mkdir -p docker/environments/wb-local/connect
        # Copy Connect license to the location expected by docker-compose volume mount
        if [ -f "${{ inputs.connect-license-path }}" ]; then
          cp "${{ inputs.connect-license-path }}" docker/environments/wb-local/connect/connect.lic
          echo "Connect license copied to docker/environments/wb-local/connect/connect.lic"
        else
          echo "Warning: Connect license not found at ${{ inputs.connect-license-path }}"
        fi

    - name: Resolve the test container image for this OS
      shell: bash
      run: |
        # Resolve through wb_os_image rather than hardcoding a tag here, so the
        # image the lane runs and the image `npm run pwb --os=...` runs can never
        # drift apart. Also validates the input: an unknown OS fails here, in
        # seconds, instead of surfacing as a confusing package error mid-install.
        source docker/environments/wb-local/workbench-local-lib.sh
        if ! WB_TEST_IMAGE="$(wb_os_image "${{ inputs.os }}")"; then
          echo "::error::Unknown os input '${{ inputs.os }}' (expected one of: ${WB_OS_CHOICES})"
          exit 1
        fi
        echo "WB_TEST_IMAGE=${WB_TEST_IMAGE}" >> "$GITHUB_ENV"
        echo "Test container image: ${WB_TEST_IMAGE}"

    - name: Start Docker Compose Services
      shell: bash
      run: |
        docker compose \
          -p "${{ inputs.run-id }}" \
          -f docker/environments/wb-local/docker-compose.workbench.yml \
          up -d

    - name: Setup workbench scripts
      shell: bash
      run: |
        # Scripts are checked out with the repo under docker/environments/wb-local
        SCRIPTS_DIR="docker/environments/wb-local"

        # Copy scripts into the container
        docker cp "$SCRIPTS_DIR/install-workbench.sh" test:/tmp/install-workbench.sh
        docker cp "$SCRIPTS_DIR/ensure-connect-token.sh" test:/tmp/ensure-connect-token.sh
        docker cp "$SCRIPTS_DIR/positronDownload.sh" test:/tmp/positronDownload.sh
        docker cp "$SCRIPTS_DIR/get-latest-wb-url.sh" test:/tmp/get-latest-wb-url.sh
        # get-latest-wb-url.sh sources the lib for its URL-resolution rules.
        docker cp "$SCRIPTS_DIR/workbench-local-lib.sh" test:/tmp/workbench-local-lib.sh
        docker cp "$SCRIPTS_DIR/configure-datasources.sh" test:/tmp/configure-datasources.sh

        # Copy Workbench license into test container if it exists
        if [ -f "${{ inputs.workbench-license-path }}" ]; then
          docker cp "${{ inputs.workbench-license-path }}" test:/tmp/workbench.lic
        fi

        # Make scripts executable
        docker exec test chmod +x /tmp/install-workbench.sh
        docker exec test chmod +x /tmp/ensure-connect-token.sh
        docker exec test chmod +x /tmp/positronDownload.sh
        docker exec test chmod +x /tmp/get-latest-wb-url.sh
        docker exec test chmod +x /tmp/configure-datasources.sh

    - name: Install Workbench in container
      shell: bash
      run: |
        CREDENTIALS_FLAG=""
        if [ -n "${{ inputs.credentials }}" ]; then
          CREDENTIALS_FLAG="--credentials=${{ inputs.credentials }}"
        fi
        docker exec \
          -e GITHUB_TOKEN="${{ inputs.github-token }}" \
          -e ARCH_SUFFIX=amd64 \
          -e WB_OS="${{ inputs.os }}" \
          -e WB_PASSWORD="${{ inputs.wb-password }}" \
          -e DATABRICKS_URL_="${DATABRICKS_URL}" \
          -e DATABRICKS_CLIENT_ID_="${DATABRICKS_CLIENT_ID}" \
          -e SNOWFLAKE_ACCOUNT_="${SNOWFLAKE_ACCOUNT}" \
          -e SNOWFLAKE_CLIENT_ID_="${SNOWFLAKE_CLIENT_ID}" \
          -e SNOWFLAKE_CLIENT_SECRET_="${SNOWFLAKE_CLIENT_SECRET}" \
          -e AZURE_SERVICE_PRINCIPAL_CLIENT_SECRET_="${AZURE_SERVICE_PRINCIPAL_CLIENT_SECRET}" \
          test /bin/bash -c "/tmp/install-workbench.sh --${{ inputs.install-mode }} $CREDENTIALS_FLAG"

    - name: Install custom Positron build (if provided)
      if: inputs.custom-positron-tarball != ''
      shell: bash
      run: |
        # Copy the custom workbench tar.gz into container
        docker cp "${{ inputs.custom-positron-tarball }}" test:/tmp/positron-custom.tar.gz

        # Extract and replace the Positron installation
        docker exec test /bin/bash -c "
          cd /tmp &&
          tar -xzf positron-custom.tar.gz &&
          # Remove the default Positron installation
          rm -rf /usr/lib/rstudio-server/bin/positron-server/new &&
          # Install our custom build
          cp -r vscode-reh-web-pwb-linux-x64 /usr/lib/rstudio-server/bin/positron-server/new &&
          chown -R rstudio-server:rstudio-server /usr/lib/rstudio-server/bin/positron-server/new
        "

        # Restart so rserver picks up our build, then confirm Workbench is still
        # serving. The init script's exit status is not a reliable signal on
        # either rpm OS: EL9's status check uses `pidof -c` and SUSE's uses
        # `checkproc`, and neither sees rserver inside a container -- so a
        # restart that worked can still print "failed", and on SUSE exit
        # non-zero, which would fail this step for no reason. Ask :8787 instead,
        # which is the thing the tests actually depend on.
        #
        # On failure, dump state rather than just the verdict. A bare ":8787 never
        # answered" is close to undiagnosable after the fact, and the container is
        # gone by the time anyone looks. The HTTP code is the discriminator worth
        # having: 502 means an orphaned rserver-http is still holding the port with
        # no rserver behind it, connection-refused means nothing is listening at
        # all, and those point at different bugs.
        docker exec test /bin/bash -c '
          sudo rstudio-server restart || true
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8787 && exit 0
            sleep 1
          done
          echo "Workbench is not serving on :8787 after the build swap" >&2
          echo "--- curl (code 000 = nothing listening) ---"
          curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 5 http://localhost:8787 || true
          echo "--- listeners on :8787 ---"
          (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep 8787 || echo "(none)"
          echo "--- rserver processes ---"
          ps -eo pid,ppid,etime,comm | grep -E "rserver|rstudio" || echo "(none)"
          echo "--- launcher socket ---"
          ls -la /var/run/rstudio-server/rserver-launcher.socket 2>&1 || true
          echo "--- rserver.log (tail) ---"
          sudo tail -n 60 /var/log/rstudio/rstudio-server/rserver.log 2>/dev/null || echo "(absent)"
          echo "--- rserver-http-error.log (tail) ---"
          sudo tail -n 30 /var/log/rstudio/rstudio-server/rserver-http-error.log 2>/dev/null || echo "(absent)"
          echo "--- launcher logs (tail) ---"
          sudo tail -n 30 /var/log/rstudio/launcher/* 2>/dev/null || echo "(absent)"
          exit 1
        '
