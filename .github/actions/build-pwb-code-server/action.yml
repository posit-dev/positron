name: 'Build PWB Code Server'
description: >-
  Builds and packages the PWB Code Server tarball for one architecture, mirroring
  the BuildAndPackage stages of the Jenkinsfile. The build runs inside the same
  container image the Jenkins pipeline uses (Dockerfile.<arch>), so the native
  modules in the tarball are linked against the same toolchain/glibc as the
  released builds.

inputs:
  arch:
    description: 'Target architecture: x86_64 or arm64'
    required: true
  version_major:
    description: 'PWB Code Server major version (Jenkins RSW_VSCODE_SERVER_VERSION_MAJOR)'
    required: false
    default: '2026'
  version_minor:
    description: 'PWB Code Server minor version (Jenkins RSW_VSCODE_SERVER_VERSION_MINOR)'
    required: false
    default: '07'
  pwb_ext_version:
    description: >-
      Version to pin the rstudio.rstudio-workbench built-in extension to. Leave
      empty to build with the version already in product.json.
    required: false
    default: ''
  upload_artifact:
    description: "Upload the tarball as a GitHub artifact"
    required: false
    default: 'true'
  artifact_retention_days:
    description: 'How many days to keep the GitHub artifact'
    required: false
    default: '7'

outputs:
  version:
    description: 'PWB Code Server version computed by jenkins/set-version.sh (e.g. 2026.07-b1234)'
    value: ${{ steps.version.outputs.version }}
  code_oss_version:
    description: 'Code OSS version from package.json'
    value: ${{ steps.version.outputs.code_oss_version }}
  archive:
    description: >-
      Tarball filename (pwb-code-server-<version>-<arch>.tar.gz). This is also the
      workflow artifact's name, since the tarball is uploaded unarchived.
    value: ${{ steps.package.outputs.archive }}
  archive_path:
    description: 'Workspace-relative path to the tarball, for publishing steps'
    value: ${{ steps.package.outputs.archive_path }}
  artifact_url:
    description: 'URL of the uploaded workflow artifact (empty when upload_artifact is false)'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Resolve build parameters
      id: params
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        case "$ARCH" in
          x86_64) GULP_ARCH=x64 ;;
          arm64) GULP_ARCH=arm64 ;;
          *) echo "::error::Unsupported arch '${ARCH}' (expected x86_64 or arm64)"; exit 1 ;;
        esac
        {
          echo "gulp_task=vscode-reh-web-pwb-linux-${GULP_ARCH}"
          echo "image=pwb-code-server-build:${ARCH}"
          echo "container=pwb-build-${ARCH}"
          # The container's `jenkins` user needs the runner's uid/gid to write to
          # the bind-mounted workspace, the same reason the Jenkinsfile passes
          # `id -u jenkins`.
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build the build container
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        context: .
        file: Dockerfile.${{ inputs.arch }}
        load: true
        tags: ${{ steps.params.outputs.image }}
        build-args: |
          JENKINS_UID=${{ steps.params.outputs.uid }}
          JENKINS_GID=${{ steps.params.outputs.gid }}
        # Keeps the expensive toolchain layers (Development Tools, gcc-toolset-12,
        # Python) warm between runs. The uid/gid args only bust the
        # final user-creation layers. If the two per-arch caches start evicting
        # each other out of the repo cache budget, publish these images to GHCR
        # and switch to `type=registry` instead.
        cache-from: type=gha,scope=pwb-code-server-build-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=pwb-code-server-build-${{ inputs.arch }}

    - name: Start build container
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
        IMAGE: ${{ steps.params.outputs.image }}
      run: |
        set -euo pipefail
        # gulp writes its output to the PARENT of the repo, so mount the
        # workspace one level down and keep /build as scratch space.
        docker run --detach --name "$CONTAINER" \
          --user jenkins \
          --volume "$GITHUB_WORKSPACE":/build/vscode-server \
          --workdir /build/vscode-server \
          "$IMAGE" sleep infinity
        # /build is root-owned; the Jenkinsfile chmods the parent for the same
        # reason before invoking gulp.
        docker exec "$CONTAINER" sudo chmod 777 /build
        docker exec "$CONTAINER" git config --global --add safe.directory /build/vscode-server

    - name: Install npm dependencies
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
      run: |
        set -euo pipefail
        # Retried like the Jenkins Requirements stage: this pulls native deps
        # over the network and fails transiently.
        for attempt in 1 2 3; do
          if docker exec "$CONTAINER" ./jenkins/install-npm-deps.sh; then
            exit 0
          fi
          echo "::warning::npm install failed (attempt ${attempt} of 3)"
          sleep 15
        done
        echo "::error::npm install failed after 3 attempts"
        exit 1

    - name: Stamp version
      id: version
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
        VERSION_MAJOR: ${{ inputs.version_major }}
        VERSION_MINOR: ${{ inputs.version_minor }}
      run: |
        set -euo pipefail
        docker exec "$CONTAINER" ./jenkins/set-version.sh "${VERSION_MAJOR}.${VERSION_MINOR}"
        VERSION="$(cat pwb-version)"
        if [ -z "$VERSION" ]; then
          echo "::error::set-version.sh did not produce a version"
          exit 1
        fi
        CODE_OSS_VERSION="$(docker exec "$CONTAINER" node -p "require('./package.json').version")"
        if [ -z "$CODE_OSS_VERSION" ]; then
          echo "::error::Failed to read the Code OSS version from package.json"
          exit 1
        fi
        {
          echo "version=${VERSION}"
          echo "code_oss_version=${CODE_OSS_VERSION}"
        } >> "$GITHUB_OUTPUT"
        echo "PWB Code Server \`${VERSION}\` (Code OSS \`${CODE_OSS_VERSION}\`)" >> "$GITHUB_STEP_SUMMARY"

    - name: Pin PWB extension version
      if: inputs.pwb_ext_version != ''
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
        PWB_EXT_VERSION: ${{ inputs.pwb_ext_version }}
      run: docker exec --env "PWB_EXT_VERSION=${PWB_EXT_VERSION}" "$CONTAINER" node ./jenkins/configure.mjs

    - name: Build
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
        GULP_TASK: ${{ steps.params.outputs.gulp_task }}
      run: docker exec "$CONTAINER" npm run gulp "$GULP_TASK"

    - name: Package tarball
      id: package
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
      run: |
        set -euo pipefail
        docker exec "$CONTAINER" ./jenkins/create-package.sh
        ARCHIVE="$(cat pwb-package)"
        # create-package.sh writes to /build/package, outside the mounted
        # workspace — move the tarball in so the runner can upload/publish it.
        docker exec "$CONTAINER" bash -c 'mkdir -p artifacts && mv "../package/$(cat pwb-package)" artifacts/'
        {
          echo "archive=${ARCHIVE}"
          echo "archive_path=artifacts/${ARCHIVE}"
        } >> "$GITHUB_OUTPUT"
        ls -lh "artifacts/${ARCHIVE}"

    - name: Upload tarball artifact
      id: upload
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.package.outputs.archive_path }}
        retention-days: ${{ inputs.artifact_retention_days }}
        archive: false

    - name: Remove build container
      if: always()
      shell: bash
      env:
        CONTAINER: ${{ steps.params.outputs.container }}
      run: docker rm --force "$CONTAINER" || true
