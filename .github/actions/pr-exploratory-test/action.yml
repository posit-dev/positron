name: "PR Exploratory Test"
description: "Run the exploratory-testing skill against a launched Positron via the Claude Agent SDK."
inputs:
  anthropic-api-key:
    description: "Explore and gate modes: Anthropic API key (resolved from 1Password by the caller)"
    required: false
    default: ""
  work-dir:
    description: "Run directory for report.md, actions.log, shots/ and cost.json; not needed in gate mode"
    required: false
    default: ""
  repo-root:
    description: "Repository root the agent drives from: the checkout of the branch under test"
    required: false
    default: ""
  skill-path:
    description: >
      SKILL.md for the exploratory-testing skill. Defaults to the copy in
      repo-root, which is only right when the branch under test already carries
      the skill. Point it at the harness checkout so the run uses the version
      the workflow was dispatched from, not whatever the branch happens to have.
    required: false
    default: ""
  cdp-port:
    description: "CDP port of the already-launched Positron; not needed in gate mode"
    required: false
    default: ""
  branch:
    description: "Explore and gate modes: branch under test"
    required: false
    default: ""
  diff-stat:
    description: "Output of git diff --stat between base and head"
    required: false
    default: ""
  base-sha:
    description: "Explore and gate modes: diff base SHA"
    required: false
    default: ""
  head-sha:
    description: "Head SHA"
    required: true
  model:
    description: "Anthropic model identifier (a tier alias like 'opus' always resolves to the latest)"
    required: false
    default: "opus"
  max-turns:
    description: "Maximum agent turns (cost guard)"
    required: false
    default: "200"
  report-base-url:
    description: "Public CDN base URL the run directory is published under"
    required: false
    default: ""
  mode:
    description: "gate (read the diff and rule on it), explore (the full run), or comment (post or update the /test PR comment)"
    required: false
    default: "explore"
  comment-state:
    description: "Comment mode: 'running' before the build, 'result' after the upload"
    required: false
    default: "result"
  outcome:
    description: "Comment mode: the explore step's outcome output; empty when the agent never ran"
    required: false
    default: ""
  pr-number:
    description: "Comment mode: the PR to comment on"
    required: false
    default: ""
  github-token:
    description: "Comment mode: token with issues: write"
    required: false
    default: ""
outputs:
  outcome:
    description: "Explore mode: complete, partial or no-report; empty if the run crashed"
    value: ${{ steps.agent.outputs.outcome }}
runs:
  using: composite
  steps:
    # Comment mode runs in the ack and report jobs on the runner's own Node and
    # never calls the SDK. Those jobs check out only the harness, so there is
    # no .nvmrc for setup-node to read.
    - name: Set up Node
      if: inputs.mode != 'comment'
      uses: actions/setup-node@v6
      with:
        # Track the repo's .nvmrc. On Node 20 the agent's shell could not run
        # launch.sh, because build/lib/preLaunch.ts is TypeScript and Node 20
        # cannot load it, so a cold start meant patching the launcher first.
        # The workflow's own launch step never hit this: it runs under the
        # container's Node, not the one this action installs.
        node-version-file: .nvmrc

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund

    - name: Install Claude Code CLI
      if: inputs.mode != 'comment'
      # Workaround for an Agent SDK bug that resolves the musl-variant binary
      # before the glibc one on Linux runners (claude-agent-sdk-typescript#296).
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        echo "CLAUDE_CODE_PATH=$(which claude)" >> "$GITHUB_ENV"
        claude --version

    - name: Run the Agent SDK
      id: agent
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        WORK_DIR: ${{ inputs.work-dir }}
        REPO_ROOT: ${{ inputs.repo-root || github.workspace }}
        SKILL_PATH: ${{ inputs.skill-path || format('{0}/.claude/skills/exploratory-testing/SKILL.md', inputs.repo-root || github.workspace) }}
        CDP_PORT: ${{ inputs.cdp-port }}
        BRANCH: ${{ inputs.branch }}
        DIFF_STAT: ${{ inputs.diff-stat }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        REPORT_BASE_URL: ${{ inputs.report-base-url }}
        COMMENT_STATE: ${{ inputs.comment-state }}
        OUTCOME: ${{ inputs.outcome }}
        PR_NUMBER: ${{ inputs.pr-number }}
        GH_TOKEN: ${{ inputs.github-token }}
        # run.mjs reads GATE directly; without it here the gate can decline a
        # run and leave the caller no way to overrule it. VERIFY is deliberately
        # absent: it defaults on, a job-level env var still reaches it for
        # debugging, and verification is what makes an unattended report worth
        # trusting, so it is not a dispatch-time choice.
      run: node ${{ inputs.mode == 'gate' && 'gate.mjs' || inputs.mode == 'comment' && 'comment.mjs' || 'run.mjs' }}
