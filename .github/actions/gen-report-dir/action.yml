name: "Generate Report Directory & Send to GH Summary"
description: "Generates a unique REPORT_DIR/REPORT_URL and optionally appends to GitHub Step summary"

# Usage:
#   For sharded workflows - pass the same identifier to all shards + merge job:
#     - uses: ./.github/actions/gen-report-dir
#       with:
#         identifier: ${{ inputs.project }}  # e.g., "e2e-electron"
#
#   For non-sharded workflows - omit identifier to auto-use github.job:
#     - uses: ./.github/actions/gen-report-dir
#
#   When the job generating the report runs on a DIFFERENT architecture than the
#   one under test (a merge job on a fixed runner), pass the arch explicitly:
#     - uses: ./.github/actions/gen-report-dir
#       with:
#         identifier: ${{ inputs.project }}
#         arch: ${{ inputs.arch }}
#
# Outputs (set as environment variables):
#   REPORT_DIR  - Directory name (e.g., "playwright-report-123456-1-electron-ubuntu-x64")
#   REPORT_URL  - Full URL (e.g., "https://...cloudfront.net/playwright-report-.../index.html")

inputs:
  bucket-url:
    description: "Base URL of the S3 bucket or CDN for the report"
    required: false
    default: "https://d38p2avprg8il3.cloudfront.net"
  identifier:
    description: "Report identifier. For sharded workflows, pass the same value to all shards. Defaults to github.job."
    required: false
    default: "${{ github.job }}"
  arch:
    # Part of the directory name because {identifier}-{os} alone does not
    # distinguish two jobs that differ only by architecture: the nightly runs
    # Windows arm64 and x64 with identifier "electron", and test-full-suite.yml
    # calls test-e2e-macos-run.yml twice with project "e2e-macOS-ci". Those pairs
    # resolved to one directory and silently overwrote each other in S3, leaving
    # whichever uploaded last standing in for both.
    description: "Architecture under test (e.g. arm64, x64). Defaults to the runner's own arch; pass it explicitly when the report is generated by a job running on a different arch than the tests."
    required: false
    default: "${{ runner.arch }}"
  skip-summary:
    description: "Skip writing to GitHub Step Summary (use when setting URL before tests)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Generate REPORT_DIR
      shell: bash
      run: |
        # Format: playwright-report-{run_id}-{run_attempt}-{identifier}-{os}-{arch}

        # 1. Process identifier - strip "e2e-" prefix to avoid GitHub secret masking issues
        IDENTIFIER=$(echo "${{ inputs.identifier }}" | sed -e 's/^\*\*\*-//' -e 's/^e2e-//')
        echo "Identifier: $IDENTIFIER"

        # 2. Detect OS/distro
        case "$RUNNER_OS" in
          Windows) OS_SUFFIX="windows" ;;
          macOS)   OS_SUFFIX="macos" ;;
          Linux)
            if [[ -f /etc/os-release ]]; then
              OS_ID=$(grep "^ID=" /etc/os-release | cut -d= -f2 | tr -d '"')
              case "$OS_ID" in
                ubuntu|debian) OS_SUFFIX="$OS_ID" ;;
                rhel|rocky|centos|fedora|almalinux) OS_SUFFIX="rocky" ;;
                opensuse|opensuse-leap|opensuse-tumbleweed) OS_SUFFIX="opensuse" ;;
                sles) OS_SUFFIX="sles" ;;
                *) OS_SUFFIX="linux" ;;
              esac
            else
              OS_SUFFIX="linux"
            fi
            ;;
          *) OS_SUFFIX="unknown" ;;
        esac
        echo "OS: $OS_SUFFIX"

        # 3. Normalize arch (runner.arch yields X64/ARM64/X86/ARM). An explicitly
        #    passed empty string bypasses the input default, so fall back here too.
        ARCH_SUFFIX=$(echo "${{ inputs.arch }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')
        if [[ -z "$ARCH_SUFFIX" ]]; then
          ARCH_SUFFIX=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        fi
        if [[ -z "$ARCH_SUFFIX" ]]; then
          ARCH_SUFFIX="unknown"
        fi
        echo "Arch: $ARCH_SUFFIX"

        # 4. Build report directory and URL
        REPORT_DIR="playwright-report-${{ github.run_id }}-${{ github.run_attempt }}-${IDENTIFIER}-${OS_SUFFIX}-${ARCH_SUFFIX}"
        REPORT_URL="${{ inputs.bucket-url }}/$REPORT_DIR/index.html"

        echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
        echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
        echo "Generated: $REPORT_DIR"

        # 5. Optionally append to GitHub Step Summary
        if [[ "${{ inputs.skip-summary }}" != "true" ]]; then
          echo "📄 [Playwright Report]($REPORT_URL) <br>" >> $GITHUB_STEP_SUMMARY
        fi
